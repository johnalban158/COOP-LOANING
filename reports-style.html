<style>
/* ═══ Reports Page Styles ═══ */
.rpt-toolbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.rpt-group{display:flex;flex-direction:column;gap:6px;}
.rpt-label{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.06em;}

/* Period toggle buttons */
.rpt-period-btns{display:flex;gap:4px;}
.rpt-pbtn{padding:7px 18px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:0.5px solid #E0DDD6;background:#fff;color:#888;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.15s;}
.rpt-pbtn:hover{background:#FAFAF8;}
.rpt-pbtn.on{background:#1C2B3A;color:#fff;border-color:#1C2B3A;}

/* Selects */
.rpt-select{padding:7px 12px;border-radius:8px;font-size:12px;border:0.5px solid #E0DDD6;background:#fff;color:#333;font-family:'Plus Jakarta Sans',sans-serif;outline:none;cursor:pointer;min-width:120px;}
.rpt-select:focus{border-color:#7BBFFF;box-shadow:0 0 0 3px rgba(123,191,255,0.12);}

/* Month checkboxes */
.rpt-months{display:flex;flex-wrap:wrap;gap:4px;}
.rpt-month-tag{padding:5px 12px;border-radius:16px;font-size:11px;font-weight:500;cursor:pointer;border:0.5px solid #E0DDD6;background:#fff;color:#888;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.15s;user-select:none;}
.rpt-month-tag:hover{background:#FAFAF8;border-color:#bbb;}
.rpt-month-tag.on{background:#7BBFFF;color:#fff;border-color:#7BBFFF;}

/* Generate button */
.rpt-gen-btn{padding:9px 24px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:linear-gradient(135deg,#1C2B3A,#2A4A6B);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;transition:opacity 0.15s;align-self:flex-end;box-shadow:0 2px 8px rgba(28,43,58,0.18);}
.rpt-gen-btn:hover{opacity:0.9;}
.rpt-gen-btn:disabled{opacity:0.5;cursor:not-allowed;}
.rpt-print-btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:0.5px solid #D0CCC6;background:#fff;color:#444;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.15s;}
.rpt-print-btn:hover{background:#FAFAF8;}

/* Report output */
.rpt-output{display:none;}
.rpt-output.visible{display:block;}

/* Header strip */
.rpt-header{text-align:center;padding:24px 16px 18px;border-bottom:2px solid #1C2B3A;margin-bottom:20px;}
.rpt-header-logo{font-size:20px;font-weight:700;color:#1C2B3A;letter-spacing:0.04em;}
.rpt-header-logo span{color:#7BBFFF;}
.rpt-header-sub{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.08em;margin-top:4px;}
.rpt-header-title{font-size:15px;font-weight:700;color:#1C2B3A;margin-top:10px;}
.rpt-header-period{font-size:12px;color:#666;margin-top:3px;}
.rpt-header-gen{font-size:10px;color:#aaa;margin-top:6px;}

/* KPI summary row */
.rpt-kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
.rpt-kpi{background:#fff;border:0.5px solid #E0DDD6;border-radius:10px;padding:14px 16px;text-align:center;}
.rpt-kpi-val{font-size:18px;font-weight:700;font-family:'DM Sans',sans-serif;color:#000;margin-bottom:3px;}
.rpt-kpi-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.05em;font-weight:500;}
.rpt-kpi.green .rpt-kpi-val{color:#3B6D11;}
.rpt-kpi.red .rpt-kpi-val{color:#A32D2D;}
.rpt-kpi.blue .rpt-kpi-val{color:#185FA5;}

/* Section headers */
.rpt-section{margin-bottom:22px;}
.rpt-section-title{font-size:13px;font-weight:700;color:#1C2B3A;text-transform:uppercase;letter-spacing:0.05em;padding-bottom:8px;border-bottom:1px solid #E0DDD6;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.rpt-section-icon{font-size:15px;}

/* Report tables */
.rpt-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border:0.5px solid #E0DDD6;border-radius:10px;overflow:hidden;margin-bottom:4px;}
.rpt-table thead th{text-align:left;padding:10px 12px;font-size:10px;font-weight:600;color:#666;letter-spacing:0.06em;text-transform:uppercase;background:#F8F7F5;border-bottom:0.5px solid #E0DDD6;}
.rpt-table thead th.num{text-align:right;}
.rpt-table tbody td{padding:9px 12px;border-bottom:0.5px solid #F0EDE8;vertical-align:middle;}
.rpt-table tbody td.num{text-align:right;font-family:'DM Sans',sans-serif;font-weight:600;}
.rpt-table tbody tr:last-child td{border-bottom:none;}
.rpt-table tbody tr:hover td{background:#FAFAF8;}
.rpt-table tfoot td{padding:10px 12px;font-weight:700;border-top:1.5px solid #1C2B3A;background:#F8F7F5;font-family:'DM Sans',sans-serif;}
.rpt-table tfoot td.num{text-align:right;}

/* Net cash flow box */
.rpt-cashflow{display:flex;gap:16px;margin-bottom:22px;}
.rpt-cf-card{flex:1;background:#fff;border:0.5px solid #E0DDD6;border-radius:10px;padding:18px;text-align:center;}
.rpt-cf-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;font-weight:600;}
.rpt-cf-val{font-size:20px;font-weight:700;font-family:'DM Sans',sans-serif;}
.rpt-cf-val.positive{color:#3B6D11;}
.rpt-cf-val.negative{color:#A32D2D;}

/* Disclaimer */
.rpt-disclaimer{font-size:10px;color:#aaa;text-align:center;padding:16px;border-top:0.5px solid #E0DDD6;margin-top:8px;line-height:1.6;}

/* Loading */
.rpt-loading{text-align:center;padding:40px;color:#888;font-size:13px;}

/* ── Responsive ── */
@media(max-width:900px){
  .rpt-toolbar{flex-direction:column;}
  .rpt-kpi-row{grid-template-columns:repeat(3,1fr);}
  .rpt-cashflow{flex-direction:column;}
  .rpt-table{font-size:11px;}
}
@media(max-width:480px){
  .rpt-kpi-row{grid-template-columns:repeat(2,1fr);}
  .rpt-months{gap:3px;}
  .rpt-month-tag{padding:4px 8px;font-size:10px;}
}

/* ── Print styles ── */
@media print{
  .sidebar,.sidebar-toggle,.sidebar-overlay,.topbar,.rpt-toolbar,.rpt-gen-btn,.rpt-print-btn,.toast,#toast,.nav-item,.btn-back,.btn-primary,.btn-settings{display:none!important;}
  .shell{display:block!important;}
  .main,.content,.page,.page.active{display:block!important;overflow:visible!important;padding:0!important;}
  .rpt-output{display:block!important;}
  .rpt-header{border-bottom:2px solid #000;page-break-after:avoid;}
  .rpt-section{page-break-inside:avoid;}
  .rpt-table{border:1px solid #ccc;}
  .rpt-kpi{border:1px solid #ccc;}
  body{background:#fff!important;font-size:11px!important;}
}
</style>
