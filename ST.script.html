<script>
/* ── Short Term Loans – Admin Page ── */
var STL_ALL = [];

function doEnrollMemberSTL() {
  var err = document.getElementById('st-addm-err'), ok = document.getElementById('st-addm-ok');
  var btn = document.getElementById('st-addm-enroll-btn');
  if (err) err.style.display = 'none'; if (ok) ok.style.display = 'none';
  var first = (document.getElementById('st-addm-first').value||'').trim();
  var last  = (document.getElementById('st-addm-last').value||'').trim();
  var email = (document.getElementById('st-addm-email').value||'').trim();
  var phone = (document.getElementById('st-addm-phone').value||'').trim();
  var dept  = (document.getElementById('st-addm-dept').value||'').trim();
  var type  = document.getElementById('st-addm-type').value;
  var cap   = Number(document.getElementById('st-addm-capital').value)||0;
  if (!first||!last) { if(err){err.textContent='Fill in all required fields (First Name, Last Name).';err.style.display='block';} return; }
  // Disable the Enroll button to prevent double-submit
  if (btn) { btn.disabled = true; btn.textContent = 'Enrolling...'; }
  
  console.log('ST-Enroll: Sending to server...', { firstName: first, lastName: last, phone: phone });
  try {
    google.script.run
      .withSuccessHandler(function(r) {
        console.log('ST-Enroll: Server success response:', r);
        if (btn) { btn.disabled = false; btn.textContent = '\u2713 Enroll Member'; }
        if (r && r.success) {
          if (ok) {
            var statusHtml = '<br><span style="font-size:11px;color:#666;">'
              + '📱 SMS: ' + (r.smsStatus === 'Sent' ? '✅' : '❌ ' + r.smsStatus)
              + ' &middot; 📧 Email: ' + (r.emailStatus === 'Sent' ? '✅' : '❌ ' + r.emailStatus)
              + '</span>';
            ok.innerHTML = '&#10003; Member enrolled! ID: <strong>' + phone + '</strong> &middot; Pass: <strong style="font-family:monospace;color:#0F4C75;">' + r.tempPassword + '</strong>' + statusHtml;
            ok.style.display = 'block';
          }
          ['st-addm-first', 'st-addm-last', 'st-addm-email', 'st-addm-phone', 'st-addm-dept', 'st-addm-capital'].forEach(function(id) { var el = document.getElementById(id); if (el) el.value = ''; });
          setTimeout(function() { if (typeof loadAccountsPage === 'function') loadAccountsPage(); }, 1500);
        } else {
          if (err) { err.textContent = (r && r.message) || 'Failed to enroll.'; err.style.display = 'block'; }
        }
      })
      .withFailureHandler(function(e) {
        console.error('ST-Enroll: Server failure:', e);
        if (btn) { btn.disabled = false; btn.textContent = '\u2713 Enroll Member'; }
        if (err) { err.textContent = 'Connection error: ' + e.message; err.style.display = 'block'; }
        alert('Server Error: ' + e.message);
      })
      .createMember({ firstName: first, lastName: last, email: email, phone: phone, department: dept, memberType: type, capital: cap });
  } catch (err_js) {
    console.error('ST-Enroll: JS error:', err_js);
    alert('JS Error: ' + err_js.message);
    if (btn) btn.disabled = false;
  }
}


function loadSTLoans() {
  var tbody = document.getElementById('st-table');
  if (tbody) tbody.innerHTML = '<tr><td colspan="9"><div style="text-align:center;padding:30px;color:#888;">Loading short term loans...</div></td></tr>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        STL_ALL = r.loans || [];
        renderSTTable(STL_ALL);
      } else {
        if (tbody) tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#9889;</div><div class="empty-title">Cannot load loans</div><div class="empty-sub">' + (r && r.message || 'Connect spreadsheet in Settings.') + '</div></div></td></tr>';
      }
    })
    .withFailureHandler(function(e) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Error</div><div class="empty-sub">' + e.message + '</div></div></td></tr>';
    })
    .getShortTermLoans();
}

var fmt = function(n) { return '\u20B1' + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };

function renderSTTable(loans) {
  var tbody = document.getElementById('st-table');
  if (!tbody) return;

  // Update stat cards
  var active = 0, totalRel = 0, overdue = 0, paid = 0;
  loans.forEach(function(l) {
    var s = (l.status || '').toLowerCase();
    if (s === 'active') { active++; totalRel += l.amount; }
    else if (s === 'overdue') { overdue++; totalRel += l.amount; }
    else if (s === 'paid') paid++;
  });
  var cards = document.querySelectorAll('.card-val');
  if (cards.length >= 4) {
    cards[0].textContent = active;
    cards[1].textContent = fmt(totalRel);
    cards[2].textContent = overdue;
    cards[3].textContent = paid;
  }

  if (loans.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#9889;</div><div class="empty-title">No short term loans yet</div><div class="empty-sub">Short term loans will appear here once approved from Applications.</div></div></td></tr>';
    return;
  }

  var html = '';
  loans.forEach(function(l, i) {
    var statusClass = l.status === 'Active' ? 'p-approved' : l.status === 'Overdue' ? 'p-rejected' : l.status === 'Paid' ? 'p-approved' : 'p-pending';
    html += '<tr onclick="viewSTLoan(' + i + ')" style="cursor:pointer;">';
    html += '<td><div class="name-cell">' + l.memberName + '</div><div class="sub-cell">' + l.memberId + '</div></td>';
    html += '<td><span class="pill p-stl">STL</span></td>';
    html += '<td class="mono">' + fmt(l.amount) + '</td>';
    html += '<td class="mono">' + fmt(l.monthly) + '</td>';
    html += '<td>' + l.term + ' mo</td>';
    var pct = l.totalPayable > 0 ? Math.round((1 - l.balance / l.totalPayable) * 100) : 0;
    html += '<td><div style="background:#eee;border-radius:10px;height:8px;width:80px;"><div style="background:#185FA5;border-radius:10px;height:8px;width:' + pct + '%;"></div></div><div style="font-size:10px;color:#888;margin-top:2px;">' + pct + '%</div></td>';
    html += '<td class="mono">' + fmt(l.balance) + '</td>';
    html += '<td><span class="pill ' + statusClass + '">' + l.status + '</span></td>';
    html += '<td><button class="action-btn" onclick="event.stopPropagation();viewSTLoan(' + i + ')">View</button></td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function viewSTLoan(idx) {
  var l = STL_ALL[idx];
  if (!l) return;
  var body = document.getElementById('modal-body');
  if (!body) body = document.getElementById('st-modal-body');
  var title = document.getElementById('modal-title');
  if (title) title.textContent = l.loanId + ' — ' + l.memberName;
  var html = '';
  html += '<div class="modal-section">Loan Details</div>';
  html += '<div class="detail-grid">';
  html += '<div class="detail-item"><div class="detail-label">Loan ID</div><div class="detail-val">' + l.loanId + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">Member</div><div class="detail-val">' + l.memberName + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">Member ID</div><div class="detail-val">' + l.memberId + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">Amount</div><div class="detail-val mono">' + fmt(l.amount) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">Monthly Payment</div><div class="detail-val mono">' + fmt(l.monthly) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">Term</div><div class="detail-val">' + l.term + ' months</div></div>';
  html += '<div class="detail-item"><div class="detail-label">Total Payable</div><div class="detail-val mono">' + fmt(l.totalPayable) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">Date Released</div><div class="detail-val">' + l.dateReleased + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">Maturity Date</div><div class="detail-val">' + l.maturityDate + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">Balance</div><div class="detail-val mono">' + fmt(l.balance) + '</div></div>';
  html += '<div class="detail-item"><div class="detail-label">Status</div><div class="detail-val"><span class="pill ' + (l.status === 'Active' ? 'p-approved' : 'p-rejected') + '">' + l.status + '</span></div></div>';
  html += '<div class="detail-item"><div class="detail-label">School Year</div><div class="detail-val">' + l.schoolYear + '</div></div>';

  if (l.netProceeds > 0) {
    html += '<div class="detail-item" style="grid-column: span 2; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px;"><div class="detail-label">DEDUCTION SUMMARY</div></div>';
    html += '<div class="detail-item"><div class="detail-label">Past Dues (B)</div><div class="detail-val mono">' + fmt(l.totalPastDues) + '</div></div>';
    html += '<div class="detail-item"><div class="detail-label">Deductions (C)</div><div class="detail-val mono">' + fmt(l.otherDeductions) + '</div></div>';
    html += '<div class="detail-item" style="background: #F0F7FF; padding: 8px; border-radius: 6px;"><div class="detail-label" style="color:#0D47A1; font-weight:700;">NET PROCEEDS</div><div class="detail-val mono" style="color:#0D47A1; font-size: 16px;">' + fmt(l.netProceeds) + '</div></div>';
  }

  html += '</div>';
  html += '<div class="modal-actions">';
  if (l.status === 'Active' || l.status === 'Overdue') {
    html += '<button class="action-btn approve" onclick="closeModal(\'st-modal\');openAdminPayModal(STL_ALL[' + idx + '])">&#128181; Record Payment</button>';
    html += '<button class="action-btn" id="btn-remind-st" style="background:#F0A500;color:#fff;border:none;" onclick="sendDueReminderST(' + idx + ')">&#128241; Send Due Reminder</button>';
  }
  html += '<button class="btn-close-modal" onclick="closeModal(\'st-modal\')">Close</button>';
  html += '</div>';

  if (l.status === 'Active' || l.status === 'Overdue') {
    html += '<div class="modal-section" style="margin-top:12px;border-top:1px solid #eee;padding-top:12px;">Bulk Mark Months Paid</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0 8px;">';
    html += '<span style="font-size:12px;color:#555;">Mark</span>';
    html += '<input id="bulk-st-months-' + idx + '" type="number" min="1" max="' + l.term + '" value="1" style="width:50px;padding:5px;border:1px solid #ccc;border-radius:5px;text-align:center;font-size:13px;">';
    html += '<span style="font-size:12px;color:#555;">month(s) as paid (\u20B1' + fmt(l.monthly) + '/mo)</span>';
    html += '<button class="action-btn approve" onclick="bulkMarkSTMonths(' + idx + ')" style="padding:5px 12px;font-size:12px;">Mark Paid</button>';
    html += '</div>';
  }

  if (body) body.innerHTML = html;
  var modal = document.getElementById('st-modal');
  if (modal) modal.style.display = 'flex';
}

function bulkMarkSTMonths(idx) {
  var l = STL_ALL[idx];
  if (!l) return;
  var numMonths = parseInt(document.getElementById('bulk-st-months-' + idx).value) || 1;
  var monthly = l.monthly || 0;
  var totalAmount = monthly * numMonths;

  if (numMonths < 1) { showToast('Enter at least 1 month.'); return; }
  if (totalAmount > l.balance) {
    var maxMonths = Math.floor(l.balance / monthly);
    if (maxMonths < 1) { showToast('Insufficient balance for 1 month.'); return; }
    if (!confirm('Balance only covers ' + maxMonths + ' month(s). Mark ' + maxMonths + ' month(s) instead?')) return;
    numMonths = maxMonths;
    totalAmount = monthly * numMonths;
  }

  var monthsPaid = l.amount > 0 ? Math.max(0, Math.round((l.totalPayable - l.balance) / l.monthly)) : 0;
  var monthStart = monthsPaid + 1;

  if (!confirm('Mark ' + numMonths + ' month(s) (Month ' + monthStart + '\u2013' + (monthStart + numMonths - 1) + ') as paid for ' + l.memberName + '?\nTotal: \u20B1' + totalAmount.toLocaleString())) return;

  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        showToast('\u2705 ' + r.message + ' \u2014 ' + r.paymentsCreated + ' record(s) created');
        closeModal('st-modal');
        loadSTLoans();
      } else {
        showToast('\u274C Error: ' + (r && r.message || 'Failed'));
      }
    })
    .withFailureHandler(function(e) {
      showToast('Error: ' + e.message);
    })
    .bulkMarkMonthsPaid({
      loanId: l.loanId,
      memberId: l.memberId,
      memberName: l.memberName,
      memberEmail: l.memberEmail || '',
      loanType: 'Short Term',
      numMonths: numMonths,
      monthStart: monthStart,
      monthlyAmount: monthly,
      datePaid: new Date().toISOString().split('T')[0]
    });
}

function sendDueReminderST(idx) {
  var l = STL_ALL[idx];
  if (!l) return;
  var btn = document.getElementById('btn-remind-st');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }
  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) { btn.disabled = false; btn.textContent = '\uD83D\uDCF1 Send Due Reminder'; }
      if (r && r.success) {
        showToast('\u2705 SMS reminder sent to ' + l.memberName + '!');
      } else {
        showToast('\u274C Failed: ' + (r && r.message || 'Unknown error'));
      }
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.textContent = '\uD83D\uDCF1 Send Due Reminder'; }
      showToast('Error: ' + e.message);
    })
    .sendManualDueReminder(l.memberId, l.memberName, 'Short Term', l.monthly, l.balance);
}

function setFilterST(el, filter) {
  el.closest('.filter-row').querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('on'); });
  el.classList.add('on');
  if (filter === 'all') { renderSTTable(STL_ALL); return; }
  var filtered = STL_ALL.filter(function(l) { return l.status.toLowerCase() === filter; });
  renderSTTable(filtered);
}

/* ════════════════════════════════════════════════
   PENDING APPLICATIONS
════════════════════════════════════════════════ */
var STL_PENDING = [];

function loadSTPendingApps() {
  var tbody = document.getElementById('st-pending-table');
  if (tbody) tbody.innerHTML = '<tr><td colspan="6"><div style="text-align:center;padding:20px;color:#888;font-size:12px;">Loading pending applications...</div></td></tr>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        STL_PENDING = r.apps || [];
        renderSTPendingTable(STL_PENDING);
      } else {
        if (tbody) tbody.innerHTML = '<tr><td colspan="6"><div style="text-align:center;padding:20px;color:#888;font-size:12px;">No pending applications</div></td></tr>';
      }
    })
    .withFailureHandler(function(e) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="6"><div style="text-align:center;padding:20px;color:#A32D2D;font-size:12px;">Error: ' + e.message + '</div></td></tr>';
    })
    .getShortTermPendingApplications();
}

function renderSTPendingTable(apps) {
  var tbody = document.getElementById('st-pending-table');
  if (!tbody) return;
  
  if (!apps || apps.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6"><div style="text-align:center;padding:20px;color:#888;font-size:12px;">No pending applications</div></td></tr>';
    return;
  }
  
  var html = '';
  apps.forEach(function(a, i) {
    var statusClass = a.status === 'Pending' ? 'p-pending' : 'p-approved';
    var statusText = a.status === 'Pending' ? 'Pending' : 'In Settlement';
    html += '<tr>';
    html += '<td>' + a.lastName + ', ' + a.firstName + '<br><span style="font-size:10px;color:#888;">' + a.memberId + '</span></td>';
    html += '<td class="mono">' + fmt(a.amount) + '</td>';
    html += '<td>' + a.term + ' mo</td>';
    html += '<td>' + a.dateSubmitted + '</td>';
    html += '<td><span class="pill ' + statusClass + '">' + statusText + '</span></td>';
    html += '<td>';
    if (a.status === 'Pending') {
      html += '<button class="action-btn approve" onclick="viewSTPendingApp(' + i + ')" style="font-size:11px;padding:4px 8px;">Review</button>';
    } else if (a.status === 'Approved (In Settlement)') {
      html += '<button class="action-btn" onclick="finalReleaseST(' + i + ')" style="background:#0D47A1;font-size:11px;padding:4px 8px;">Release</button>';
    }
    html += '</td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function viewSTPendingApp(idx) {
  var a = STL_PENDING[idx];
  if (!a) return;
  
  // Load deduction settings first
  google.script.run
    .withSuccessHandler(function(dedSettings) {
      if (!dedSettings || !dedSettings.success) {
        dedSettings = { stlCbuRate: 1, stlService: 0, stlInsurancePct: 1.62, stlOn: true };
      }
      
      // Respect the Short Term toggle — zeroed when disabled
      var dedOn = dedSettings.stlOn !== false;
      var stlCbuRate = dedOn ? dedSettings.stlCbuRate : 0;
      var stlService = dedOn ? dedSettings.stlService : 0;
      var stlInsPct  = dedOn ? (dedSettings.stlInsurancePct !== undefined ? dedSettings.stlInsurancePct : (dedSettings.stlInsurance || 0)) : 0;
      var stlInsurance = a.amount * stlInsPct / 100;
      
      // Calculate deductions
      var cbuDeduction = Math.round(a.amount * (stlCbuRate / 100));
      var totalC = cbuDeduction + stlService + stlInsurance;
      var netProceeds = a.amount - totalC;
      
      var msg = 'Approve loan application for ' + a.firstName + ' ' + a.lastName + '?\n\n';
      msg += 'Amount: ₱' + fmt(a.amount) + '\n';
      msg += 'Term: ' + a.term + ' months\n\n';
      msg += 'DEDUCTIONS:\n';
      msg += 'CBU (' + stlCbuRate + '%): ₱' + fmt(cbuDeduction) + '\n';
      if (stlService > 0) msg += 'Service Fee: ₱' + fmt(stlService) + '\n';
      if (stlInsurance > 0) msg += 'Insurance (' + stlInsPct + '%): ₱' + fmt(stlInsurance) + '\n';
      msg += 'Total Deductions: ₱' + fmt(totalC) + '\n';
      msg += 'NET PROCEEDS: ₱' + fmt(netProceeds) + '\n\n';
      msg += 'This will send an approval email to the member and set the loan to "In Settlement" status.';
      
      var confirmed = confirm(msg);
      if (!confirmed) return;
      
      google.script.run
        .withSuccessHandler(function(r) {
          if (r && r.success) {
            alert('Application approved! Member has been notified.');
            loadSTPendingApps();
            loadSTLoans();
          } else {
            alert('Error: ' + (r && r.message || 'Failed'));
          }
        })
        .withFailureHandler(function(e) {
          alert('Error: ' + e.message);
        })
        .approveApplication(a.row, { totalB: 0, totalC: totalC, netProceeds: netProceeds });
    })
    .withFailureHandler(function(e) {
      alert('Error loading deduction settings: ' + e.message);
    })
    .getDeductionSettings();
}

function finalReleaseST(idx) {
  var a = STL_PENDING[idx];
  if (!a) return;
  
  var confirmed = confirm('Release loan for ' + a.firstName + ' ' + a.lastName + '?\n\nAmount: ₱' + fmt(a.amount) + '\nNet Proceeds: ₱' + fmt(a.netProceeds) + '\n\nThis will send a release notification to the member.');
  if (!confirmed) return;
  
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        alert('Loan released! Member has been notified.');
        loadSTPendingApps();
        loadSTLoans();
      } else {
        alert('Error: ' + (r && r.message || 'Failed'));
      }
    })
    .withFailureHandler(function(e) {
      alert('Error: ' + e.message);
    })
    .finalReleaseLoan(a.row);
}

document.addEventListener('DOMContentLoaded', function() { 
  loadSTLoans();
  loadSTPendingApps();
  loadCbuStSettings();
  var inp = document.getElementById('cbu-st-pct');
  if (inp) inp.addEventListener('input', updateCbuStPreview);
  var dateEl = document.getElementById('st-mig-date');
  if (dateEl) dateEl.value = new Date().toISOString().split('T')[0];
});

/* ── CBU % Editor – Short Term ── */
function updateCbuStPreview() {
  var el = document.getElementById('cbu-st-pct');
  var v = el ? (Number(el.value) || 80) : 80;
  var previewEl = document.getElementById('cbu-st-preview');
  if (previewEl) {
    previewEl.textContent = '= ' + (v/100).toFixed(2).replace(/\.?0+$/, '') + '\u00D7 CBU';
  }
}
function saveCbuSt() {
  var el = document.getElementById('cbu-st-pct');
  if (!el) {
    showToast('CBU input field not found');
    return;
  }
  var pct = Number(el.value);
  if (!pct || pct < 1) { showToast('Enter a valid percentage'); return; }
  google.script.run
    .withSuccessHandler(function(r) {
      var badge = document.getElementById('cbu-saved-st');
      if (r && r.success) {
        if (badge) { badge.style.display = 'inline'; setTimeout(function(){ badge.style.display='none'; }, 3000); }
        showToast('\u2713 Short Term CBU % saved: ' + pct + '%');
      } else {
        showToast('\u274C Error: ' + (r && r.message || 'Failed'));
      }
    })
    .withFailureHandler(function(e){ showToast('Error: '+e.message); })
    .saveCbuSettings({ stPct: pct });
}
function loadCbuStSettings() {
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        var el = document.getElementById('cbu-st-pct');
        if (el) { el.value = r.stPct || 80; updateCbuStPreview(); }
      }
    })
    .withFailureHandler(function(){})
    .getCbuSettings();
}


/* ════════════════════════════════════════════════
   Loan Migration (Import Existing Loans)
════════════════════════════════════════════════ */
var migQueue_st = [];
var LOAN_TYPE_ST = 'Short Term';

function calcMigPreview(prefix) {
  var amount = Number(document.getElementById(prefix + '-mig-amount').value) || 0;
  var term = Number(document.getElementById(prefix + '-mig-term').value) || 0;
  var monthsPaid = Number(document.getElementById(prefix + '-mig-paid').value) || 0;
  var preview = document.getElementById(prefix + '-mig-preview');
  if (!amount || !term) { preview.style.display = 'none'; return; }
  var totalToPay = Math.round(amount * 1.06);
  var monthly = Math.round(totalToPay / term);
  var amountPaid = monthly * monthsPaid;
  var balance = Math.max(0, totalToPay - amountPaid);
  var status = balance <= 0 ? 'Paid' : 'Active';
  document.getElementById(prefix + '-mig-pv-monthly').textContent = 'Monthly: \u20B1' + monthly.toLocaleString();
  document.getElementById(prefix + '-mig-pv-total').textContent = 'Total: \u20B1' + totalToPay.toLocaleString();
  document.getElementById(prefix + '-mig-pv-balance').textContent = 'Balance: \u20B1' + balance.toLocaleString();
  document.getElementById(prefix + '-mig-pv-status').innerHTML = 'Status: <span style="color:' + (status === 'Paid' ? '#3B6D11' : '#185FA5') + ';font-weight:600;">' + status + '</span>';
  preview.style.display = 'block';
}

function addMigToQueue(prefix) {
  var id = document.getElementById(prefix + '-mig-id').value.trim();
  var name = document.getElementById(prefix + '-mig-name').value.trim();
  var amount = Number(document.getElementById(prefix + '-mig-amount').value) || 0;
  var term = Number(document.getElementById(prefix + '-mig-term').value) || 0;
  var date = document.getElementById(prefix + '-mig-date').value || new Date().toISOString().split('T')[0];
  var monthsPaid = Number(document.getElementById(prefix + '-mig-paid').value) || 0;
  var msg = document.getElementById(prefix + '-mig-msg');
  if (!id || !name || !amount || !term) {
    showMsg(prefix, 'Please fill Member ID, Name, Amount, and Term.', '#A32D2D');
    return;
  }
  var totalToPay = Math.round(amount * 1.06);
  var monthly = Math.round(totalToPay / term);
  var amountPaid = monthly * monthsPaid;
  var balance = Math.max(0, totalToPay - amountPaid);
  var status = balance <= 0 ? 'Paid' : 'Active';

  migQueue_st.push({ memberId: id, memberName: name, amount: amount, term: term, monthly: monthly, totalToPay: totalToPay, balance: balance, status: status, dateReleased: date, monthsPaid: monthsPaid });
  renderMigQueue('st');
  showMsg(prefix, 'Added ' + name + ' to queue.', '#3B6D11');
  document.getElementById(prefix + '-mig-id').value = '';
  document.getElementById(prefix + '-mig-name').value = '';
  document.getElementById(prefix + '-mig-amount').value = '';
  document.getElementById(prefix + '-mig-term').value = '';
  document.getElementById(prefix + '-mig-paid').value = '';
  document.getElementById(prefix + '-mig-preview').style.display = 'none';
}

function removeMigFromQueue(prefix, index) {
  migQueue_st.splice(index, 1);
  renderMigQueue(prefix);
}

function renderMigQueue(prefix) {
  var tbody = document.getElementById(prefix + '-mig-tbody');
  var countEl = document.getElementById(prefix + '-mig-count');
  var saveBtn = document.getElementById(prefix + '-mig-save-btn');
  var wrap = document.getElementById(prefix + '-mig-queue-wrap');
  var q = migQueue_st;
  countEl.textContent = 'Queue: ' + q.length;
  if (q.length === 0) {
    wrap.style.display = 'none';
    saveBtn.disabled = true;
    saveBtn.style.opacity = '0.5';
    saveBtn.textContent = '\uD83D\uDC32 Save All (0)';
    return;
  }
  wrap.style.display = 'block';
  saveBtn.disabled = false;
  saveBtn.style.opacity = '1';
  saveBtn.textContent = '\uD83D\uDC32 Save All (' + q.length + ')';
  tbody.innerHTML = '';
  for (var i = 0; i < q.length; i++) {
    var r = q[i];
    var tr = document.createElement('tr');
    tr.innerHTML = '<td style="padding:6px;border:1px solid #E0DDD6;text-align:center;">' + (i+1) + '</td>'
      + '<td style="padding:6px;border:1px solid #E0DDD6;">' + r.memberName + '</td>'
      + '<td style="padding:6px;border:1px solid #E0DDD6;">\u20B1' + r.amount.toLocaleString() + '</td>'
      + '<td style="padding:6px;border:1px solid #E0DDD6;">' + r.term + 'mo</td>'
      + '<td style="padding:6px;border:1px solid #E0DDD6;">\u20B1' + r.monthly.toLocaleString() + '</td>'
      + '<td style="padding:6px;border:1px solid #E0DDD6;">\u20B1' + r.balance.toLocaleString() + '</td>'
      + '<td style="padding:6px;border:1px solid #E0DDD6;"><span style="color:' + (r.status === 'Paid' ? '#3B6D11' : '#185FA5') + ';font-weight:600;">' + r.status + '</span></td>'
      + '<td style="padding:6px;border:1px solid #E0DDD6;text-align:center;"><button onclick="removeMigFromQueue(\'st\',' + i + ')" style="padding:2px 8px;background:#A32D2D;color:#fff;border:none;border-radius:4px;font-size:10px;cursor:pointer;">\u2715</button></td>';
    tbody.appendChild(tr);
  }
}

function saveMigQueue(prefix) {
  var q = migQueue_st;
  if (q.length === 0) return;
  var saveBtn = document.getElementById(prefix + '-mig-save-btn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving...';
  var completed = 0;
  var errors = [];
  function saveNext(i) {
    if (i >= q.length) {
      showMsg(prefix, 'Saved ' + completed + '/' + q.length + ' loans' + (errors.length ? '. Errors: ' + errors.join('; ') : ''), errors.length ? '#A32D2D' : '#3B6D11');
      migQueue_st = [];
      renderMigQueue(prefix);
      loadSTLoans();
      saveBtn.disabled = false;
      saveBtn.textContent = '\uD83D\uDC32 Save All (0)';
      return;
    }
    var r = q[i];
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) { completed++; }
        else { errors.push(r.memberName + ': ' + (res && res.message || 'Failed')); }
        saveBtn.textContent = 'Saving ' + (i+1) + '/' + q.length + '...';
        saveNext(i + 1);
      })
      .withFailureHandler(function(e) {
        errors.push(r.memberName + ': ' + e.message);
        saveNext(i + 1);
      })
      .addMigrationLoan({
        loanType: LOAN_TYPE_ST,
        memberId: r.memberId,
        memberName: r.memberName,
        amount: r.amount,
        term: r.term,
        monthly: r.monthly,
        dateReleased: r.dateReleased,
        monthsPaid: r.monthsPaid
      });
  }
  saveNext(0);
}

function showMsg(prefix, text, color) {
  var el = document.getElementById(prefix + '-mig-msg');
  el.textContent = text;
  el.style.color = color;
  el.style.display = 'block';
  el.style.background = color === '#A32D2D' ? '#FCEBEB' : '#EAF3DE';
  el.style.border = '0.5px solid ' + (color === '#A32D2D' ? '#F7C1C1' : '#C0DD97');
  setTimeout(function(){ el.style.display = 'none'; }, 5000);
}

function forceRefreshAccounts() {
  var tbody = document.getElementById('st-acc-tbody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">&#8635;</div><div class="empty-title">Clearing cache and reloading...</div></div></td></tr>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        showToast('\u2713 ' + r.message);
        loadAccountsPage();
      } else {
        showToast('\u274C ' + (r && r.message || 'Failed to clear cache'));
        loadAccountsPage();
      }
    })
    .withFailureHandler(function(e) {
      showToast('\u274C ' + e.message);
      loadAccountsPage();
    })
    .clearMembersCache();
}

/* ACCOUNTS PAGE logic shared via MEMBERS-script.html */

function loadAccountsPage() {
  var tbody = document.getElementById('st-acc-tbody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">&#8635;</div><div class="empty-title">Loading members...</div></div></td></tr>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        REG_ACC_ALL = r.data || r.members || [];
        renderAccountsList();
      } else {
        var msg = (r && r.message) || 'Connect spreadsheet in Settings.';
        if (tbody) tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Cannot load members</div><div class="empty-sub">' + msg + '</div><div style="margin-top:10px;"><button class="btn-primary" onclick="navigate(\'settings\')">&#128452; Open Settings</button><button class="btn-secondary" onclick="forceRefreshAccounts()" style="margin-left:8px;">&#8635; Force Refresh</button></div></div></td></tr>';
      }
    })
    .withFailureHandler(function(e) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Error loading members</div><div class="empty-sub">' + e.message + '</div><div style="margin-top:10px;"><button class="btn-secondary" onclick="forceRefreshAccounts()">&#8635; Force Refresh</button></div></div></td></tr>';
    })
    .getMembers();
}

function renderAccountsList(list) {
  var data = list || REG_ACC_ALL;
  var tbody = document.getElementById('st-acc-tbody');
  if (!tbody) return;
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">&#128100;</div><div class="empty-title">No members enrolled yet</div><div class="empty-sub">Use the form above to enroll your first member.</div></div></td></tr>';
    return;
  }
  var fmtC = function(n) { return '\u20B1' + (Number(n) || 0).toLocaleString(); };
  var html = '';
  data.forEach(function(m) {
    var statusPill = (String(m.status || 'Active')).toLowerCase() === 'active'
      ? '<span class="pill p-approved">Active</span>'
      : '<span class="pill p-pending">' + (m.status || 'Pending') + '</span>';
    html += '<tr>';
    html += '<td><div class="name-cell">' + (m.firstName || '') + ' ' + (m.lastName || '') + '</div><div class="sub-cell">' + (m.username || m.memberId || '') + '</div></td>';
    html += '<td><span class="pill ' + ((String(m.memberType || '')).toLowerCase() === 'teacher' ? 'p-t' : 'p-jo') + '">' + (m.memberType || '-') + '</span></td>';
    html += '<td>' + (m.department || '&mdash;') + '</td>';
    html += '<td>' + (m.phone || '&mdash;') + '</td>';
    html += '<td>' + (m.email || '&mdash;') + '</td>';
    html += '<td class="mono">' + fmtC(m.capital) + '</td>';
    html += '<td>' + (m.dateJoined || '&mdash;') + '</td>';
    html += '<td>' + statusPill + '</td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function filterAccountsList() {
  var q = ((document.getElementById('st-acc-search') || { value: '' }).value || '').toLowerCase();
  if (!q) { renderAccountsList(); return; }
  var filtered = REG_ACC_ALL.filter(function(m) {
    return (String(m.firstName || '') + ' ' + String(m.lastName || '')).toLowerCase().indexOf(q) !== -1
      || String(m.phone || '').indexOf(q) !== -1
      || String(m.username || '').indexOf(q) !== -1;
  });
  renderAccountsList(filtered);
}

function doEnrollAccountsPage() {
  var errEl = document.getElementById('acc-err');
  var okEl  = document.getElementById('acc-ok');
  var btn   = document.getElementById('acc-enroll-btn');
  if (errEl) { errEl.style.display = 'none'; errEl.textContent = ''; }
  if (okEl)  { okEl.style.display  = 'none'; okEl.innerHTML   = ''; }

  var first = (document.getElementById('acc-first').value || '').trim();
  var last  = (document.getElementById('acc-last').value  || '').trim();
  var email = (document.getElementById('acc-email').value || '').trim();
  var phone = (document.getElementById('acc-phone').value || '').trim();
  var dept  = (document.getElementById('acc-dept').value  || '').trim();
  var type  = document.getElementById('acc-type').value;
  var cap   = Number(document.getElementById('acc-capital').value) || 0;

  if (!first || !last) {
    if (errEl) { errEl.textContent = 'Please fill in all required fields: First Name and Last Name.'; errEl.style.display = 'block'; }
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Enrolling... wait'; }

  console.log('ST-Accounts-Enroll: Sending...', { firstName: first, lastName: last, phone: phone });
  try {
    google.script.run
      .withSuccessHandler(function(r) {
        console.log('ST-Accounts-Enroll: Success:', r);
        if (btn) { btn.disabled = false; btn.textContent = '\u2713 Enroll Member'; }
        if (r && r.success) {
          if (okEl) {
            var statusHtml = '<br><span style="font-size:11px;color:#666;">'
              + '📱 SMS: ' + (r.smsStatus === 'Sent' ? '✅' : '❌ ' + r.smsStatus)
              + ' &middot; 📧 Email: ' + (r.emailStatus === 'Sent' ? '✅' : '❌ ' + r.emailStatus)
              + '</span>';
            okEl.innerHTML = '\u2713 Member enrolled!<br>'
              + 'Mobile: <strong>' + phone + '</strong> &middot; Temp password: <strong style="font-family:monospace;color:#0F4C75;">' + r.tempPassword + '</strong>' + statusHtml;
            okEl.style.display = 'block';
          }
          ['acc-first','acc-last','acc-email','acc-phone','acc-dept','acc-capital']
            .forEach(function(id) { var el = document.getElementById(id); if (el) el.value = ''; });
          setTimeout(function() { if (typeof loadAccountsPage === 'function') loadAccountsPage(); }, 1500);
        } else {
          if (errEl) { errEl.textContent = (r && r.message) || 'Failed to enroll. Please try again.'; errEl.style.display = 'block'; }
        }
      })
      .withFailureHandler(function(e) {
        console.error('ST-Accounts-Enroll: Failure:', e);
        if (btn) { btn.disabled = false; btn.textContent = '\u2713 Enroll Member'; }
        if (errEl) { errEl.textContent = 'Connection error: ' + e.message; errEl.style.display = 'block'; }
        alert('Server Error (ST Accounts): ' + e.message);
      })
      .createMember({ firstName: first, lastName: last, email: email, phone: phone, department: dept, memberType: type, capital: cap });
  } catch (err_js) {
    console.error('ST-Accounts-Enroll: JS error:', err_js);
    alert('JS Error (ST Accounts): ' + err_js.message);
    if (btn) btn.disabled = false;
  }
}
</script>
