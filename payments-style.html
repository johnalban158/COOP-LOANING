<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: #F4F2EE;
        color: #000;
        min-height: 100vh;
    }

    .shell {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
    }

    .main {
        display: flex;
        flex-direction: column;
    }

    .topbar {
        background: #fff;
        border-bottom: 0.5px solid #E0DDD6;
        padding: 14px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }

    .topbar-title {
        font-size: 15px;
        font-weight: 600;
    }

    .topbar-sub {
        font-size: 12px;
        color: #666;
        margin-top: 1px;
    }

    .topbar-right {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .btn-primary {
        background: #1C2B3A;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .btn-primary:hover {
        opacity: 0.9;
    }

    .btn-back {
        background: #fff;
        color: #444;
        border: 0.5px solid #D0CCC6;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .btn-back:hover {
        background: #FAFAF8;
    }

    .content {
        padding: 24px 28px;
        flex: 1;
        overflow-y: auto;
    }

    .cards-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 24px;
    }

    .card {
        background: #fff;
        border: 0.5px solid #E0DDD6;
        border-radius: 12px;
        padding: 16px;
    }

    .card-label {
        font-size: 11px;
        color: #666;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 6px;
    }

    .card-val {
        font-size: 22px;
        font-weight: 700;
        font-family: 'DM Sans', sans-serif;
        color: #000;
    }

    .card-sub {
        font-size: 11px;
        color: #777;
        margin-top: 4px;
    }

    .bl1 {
        border-left: 3px solid #7BBFFF;
    }

    .bl2 {
        border-left: 3px solid #7DC28A;
    }

    .bl3 {
        border-left: 3px solid #F5A623;
    }

    .bl4 {
        border-left: 3px solid #E05C5C;
    }

    .filter-row {
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        align-items: center;
    }

    .filter-label {
        font-size: 12px;
        color: #666;
        margin-right: 4px;
    }

    .filter-btn {
        padding: 7px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border: 0.5px solid #E0DDD6;
        background: #fff;
        color: #666;
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: all 0.15s;
    }

    .filter-btn:hover {
        background: #FAFAF8;
    }

    .filter-btn.on {
        background: #1C2B3A;
        color: #fff;
        border-color: #1C2B3A;
    }

    .table-wrap {
        background: #fff;
        border: 0.5px solid #E0DDD6;
        border-radius: 12px;
        overflow: hidden;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
    }

    thead th {
        text-align: left;
        padding: 10px 14px;
        font-size: 11px;
        font-weight: 600;
        color: #666;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: #FAFAF8;
        border-bottom: 0.5px solid #E0DDD6;
    }

    tbody td {
        padding: 11px 14px;
        border-bottom: 0.5px solid #F0EDE8;
        vertical-align: middle;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    tbody tr:hover td {
        background: #FAFAF8;
    }

    .name-cell {
        font-weight: 500;
    }

    .sub-cell {
        font-size: 11px;
        color: #666;
        margin-top: 2px;
    }

    .mono {
        font-family: 'DM Sans', sans-serif;
        font-size: 12px;
        font-weight: 700;
        color: #000;
    }

    .pill {
        display: inline-block;
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 20px;
        font-weight: 500;
    }

    .p-t {
        background: #E6F1FB;
        color: #185FA5;
    }

    .p-jo {
        background: #EAF3DE;
        color: #3B6D11;
    }

    .p-active {
        background: #EAF3DE;
        color: #3B6D11;
    }

    .p-pending {
        background: #FAEEDA;
        color: #854F0B;
    }

    .p-late {
        background: #FCEBEB;
        color: #A32D2D;
    }

    .p-paid {
        background: #F1EFE8;
        color: #5F5E5A;
    }

    .empty-state {
        text-align: center;
        padding: 60px 24px;
    }

    .empty-icon {
        font-size: 36px;
        margin-bottom: 12px;
    }

    .empty-title {
        font-size: 14px;
        font-weight: 600;
        color: #444;
        margin-bottom: 6px;
    }

    .empty-sub {
        font-size: 12px;
        color: #777;
        line-height: 1.7;
        max-width: 320px;
        margin: 0 auto;
    }

    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
    }

    .modal {
        background: #fff;
        border-radius: 16px;
        width: 520px;
        max-width: 95vw;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
    }

    .modal-header {
        padding: 20px 24px 16px;
        border-bottom: 0.5px solid #E0DDD6;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .modal-title {
        font-size: 14px;
        font-weight: 600;
    }

    .modal-close {
        font-size: 22px;
        color: #777;
        cursor: pointer;
        line-height: 1;
    }

    .modal-body {
        padding: 20px 24px 28px;
    }

    .modal-section {
        font-size: 11px;
        font-weight: 600;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
        margin-top: 20px;
    }

    .modal-section:first-child {
        margin-top: 0;
    }

    .detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .detail-item {
        background: #FAFAF8;
        border-radius: 8px;
        padding: 10px 12px;
        border: 0.5px solid #F0EDE8;
    }

    .detail-label {
        font-size: 10px;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 3px;
    }

    .detail-val {
        font-size: 13px;
        font-weight: 500;
        color: #000;
    }

    .modal-actions {
        display: flex;
        gap: 8px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 0.5px solid #F0EDE8;
    }

    .btn-close-modal {
        width: 100%;
        padding: 10px;
        background: #fff;
        color: #444;
        border: 0.5px solid #D0CCC6;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .action-btn {
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border: 0.5px solid #E0DDD6;
        background: #fff;
        color: #444;
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: all 0.15s;
    }

    .action-btn:hover {
        background: #FAFAF8;
    }

    .toast {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        background: #1C2B3A;
        color: #fff;
        padding: 10px 22px;
        border-radius: 8px;
        font-size: 13px;
        display: none;
        z-index: 999;
        white-space: nowrap;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .record-btn {
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border: 0.5px solid #C0DD97;
        background: #EAF3DE;
        color: #3B6D11;
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: all 0.15s;
    }

    .record-btn:hover {
        background: #D4ECBE;
    }

    .progress-wrap {
        width: 90px;
        height: 6px;
        background: #F0EDE8;
        border-radius: 3px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        background: #7DC28A;
        border-radius: 3px;
    }

    /* ── Payment status badges ── */
    .status-badge {
        display: inline-block;
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 20px;
        font-weight: 600;
    }

    .stat-paid {
        background: #EAF3DE;
        color: #3B6D11;
    }

    .stat-pending {
        background: #FAEEDA;
        color: #854F0B;
    }

    .stat-review {
        background: #E3F2FD;
        color: #1565C0;
    }

    /* ── Member cell ── */
    .mem-name {
        font-weight: 500;
        font-size: 13px;
    }

    .mem-id {
        font-size: 11px;
        color: #666;
        margin-top: 1px;
    }

    /* ── Action buttons ── */
    .act-btn {
        padding: 5px 11px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        border: 0.5px solid #D0CCC6;
        background: #fff;
        color: #333;
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: all 0.15s;
    }

    .act-btn:hover {
        background: #F0EDE8;
    }

    .act-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* ── Approve / Reject action buttons ── */
    .btn-approve {
        padding: 6px 13px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        background: #EAF3DE;
        color: #3B6D11;
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: all 0.15s;
        margin-right: 4px;
    }

    .btn-approve:hover {
        background: #C0DD97;
        color: #2A5009;
    }

    .btn-reject {
        padding: 6px 13px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        background: #FCEBEB;
        color: #A32D2D;
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: all 0.15s;
    }

    .btn-reject:hover {
        background: #F7C1C1;
        color: #7A1111;
    }

    .stat-rejected-badge {
        background: #FCEBEB;
        color: #A32D2D;
    }

    /* ── Proof link ── */
    .proof-link {
        font-size: 12px;
        font-weight: 500;
        color: #185FA5;
        text-decoration: none;
    }

    .proof-link:hover {
        text-decoration: underline;
    }

    /* ── Proof image overlay modal ── */
    .proof-ov,
    .reject-ov {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 400;
        padding: 20px;
    }

    .proof-ov.on,
    .reject-ov.on {
        display: flex;
    }

    .proof-modal {
        background: #fff;
        border-radius: 16px;
        width: 580px;
        max-width: 95vw;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 16px 60px rgba(0, 0, 0, 0.25);
    }

    .proof-modal-hdr {
        padding: 18px 22px 14px;
        border-bottom: 0.5px solid #E0DDD6;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .proof-modal-title {
        font-size: 14px;
        font-weight: 600;
    }

    .proof-modal-close {
        font-size: 24px;
        color: #777;
        cursor: pointer;
        line-height: 1;
    }

    .proof-modal-close:hover {
        color: #444;
    }

    .proof-modal-body {
        padding: 20px 22px 24px;
        text-align: center;
    }

    .proof-drive-btn {
        display: inline-block;
        margin-top: 16px;
        padding: 9px 20px;
        background: #1C2B3A;
        color: #fff;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
    }

    .proof-drive-btn:hover {
        opacity: 0.85;
    }

    /* ── Reject reason modal ── */
    .reject-modal {
        background: #fff;
        border-radius: 16px;
        width: 460px;
        max-width: 95vw;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.18);
    }

    .reject-mh {
        padding: 18px 22px 14px;
        border-bottom: 0.5px solid #E0DDD6;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .reject-mt {
        font-size: 14px;
        font-weight: 600;
        color: #A32D2D;
    }

    .reject-mb {
        padding: 20px 22px 24px;
    }

    /* ── OR Search Row ── */
    .or-search-row {
        margin-bottom: 16px;
    }

    .or-search-wrap {
        display: flex;
        gap: 8px;
    }

    .or-search-input {
        flex: 1;
        padding: 10px 16px;
        border: 0.5px solid #E0DDD6;
        border-radius: 10px;
        font-size: 13px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        outline: none;
        background: #fff;
        transition: border-color 0.15s;
    }

    .or-search-input:focus {
        border-color: #1C2B3A;
    }

    .or-search-btn {
        padding: 10px 20px;
        background: #1C2B3A;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: opacity 0.15s;
    }

    .or-search-btn:hover {
        opacity: 0.88;
    }

    /* ── OR Ref link in table ── */
    .or-ref-link {
        font-size: 11px;
        font-weight: 700;
        font-family: 'DM Sans', sans-serif;
        color: #185FA5;
        text-decoration: none;
        cursor: pointer;
    }

    .or-ref-link:hover {
        text-decoration: underline;
    }

    /* ── View OR button ── */
    .btn-view-or {
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        border: 0.5px solid #C0DD97;
        background: #EAF3DE;
        color: #3B6D11;
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: all 0.15s;
    }

    .btn-view-or:hover {
        background: #D4ECBE;
    }

    /* ── OR Receipt Modal Overlay ── */
    .or-ov {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 500;
        padding: 20px;
    }

    .or-ov.on {
        display: flex;
    }

    .or-modal {
        background: #fff;
        border-radius: 16px;
        width: 520px;
        max-width: 95vw;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 16px 60px rgba(0, 0, 0, 0.25);
    }

    .or-mh {
        padding: 18px 22px 14px;
        border-bottom: 0.5px solid #E0DDD6;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .or-mt {
        font-size: 14px;
        font-weight: 600;
    }

    .or-mx {
        font-size: 24px;
        color: #777;
        cursor: pointer;
        line-height: 1;
    }

    .or-mx:hover {
        color: #444;
    }

    .or-mb {
        padding: 20px 22px 24px;
    }

    /* ── OR Receipt Card ── */
    .or-card {
        border: 1.5px solid #E0DDD6;
        border-radius: 14px;
        overflow: hidden;
    }

    .or-card-header {
        background: linear-gradient(135deg, #0D1B2A 0%, #1C2B3A 40%, #2A4A6B 100%);
        padding: 28px 20px;
        text-align: center;
    }

    .or-org {
        font-size: 24px;
        font-weight: 700;
        color: #fff;
        letter-spacing: 0.08em;
        text-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .or-org span {
        color: #5EB8FF;
        text-shadow: 0 0 20px rgba(94,184,255,0.4), 0 2px 8px rgba(0,0,0,0.2);
    }

    .or-org-sub {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.65);
        text-transform: uppercase;
        letter-spacing: 0.10em;
        margin-top: 5px;
        font-weight: 500;
    }

    .or-badge {
        display: inline-block;
        background: rgba(94,184,255,0.18);
        color: #5EB8FF;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        padding: 6px 18px;
        border-radius: 20px;
        margin-top: 14px;
        text-transform: uppercase;
        border: 1px solid rgba(94,184,255,0.25);
    }

    .or-ref-row {
        background: #F8F9FA;
        padding: 16px;
        text-align: center;
        border-bottom: 0.5px solid #E0DDD6;
    }

    .or-ref-label {
        font-size: 10px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 4px;
    }

    .or-ref-val {
        font-size: 17px;
        font-weight: 700;
        font-family: 'DM Sans', sans-serif;
        color: #000;
        letter-spacing: 0.04em;
    }

    .or-detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
    }

    .or-detail-item {
        padding: 12px 16px;
        border-bottom: 0.5px solid #F0EDE8;
    }

    .or-detail-item:nth-child(odd) {
        border-right: 0.5px solid #F0EDE8;
    }

    .or-dl {
        font-size: 10px;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 3px;
    }

    .or-dv {
        font-size: 13px;
        font-weight: 600;
        color: #000;
    }

    .or-amt {
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 16px;
        color: #000;
    }

    .or-status-val {
        color: #3B6D11;
        font-weight: 700;
    }

    .or-note {
        padding: 14px 16px;
        font-size: 11px;
        color: #444;
        text-align: center;
        background: #FAFAF8;
        border-top: 0.5px solid #E0DDD6;
        line-height: 1.6;
    }

    /* ── OR Actions ── */
    .or-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
    }

    .or-btn-print {
        flex: 2;
        padding: 10px;
        background: #1C2B3A;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .or-btn-print:hover {
        opacity: 0.88;
    }

    .or-btn-close {
        flex: 1;
        padding: 10px;
        background: #fff;
        color: #444;
        border: 0.5px solid #D0CCC6;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .or-btn-close:hover {
        background: #FAFAF8;
    }

    /* ── QR Code section ── */
    .or-qr-section {
        padding: 20px 16px;
        text-align: center;
        border-top: 0.5px solid #E0DDD6;
        background: #FDFCFB;
    }

    .or-qr-img {
        width: 120px;
        height: 120px;
        border: 4px solid #fff;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .or-qr-label {
        font-size: 10px;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 8px;
        font-weight: 500;
    }

    /* ── Responsive ── */
    @media(max-width:900px) {
        .shell { grid-template-columns: 1fr; }
        .topbar { padding: 14px 16px; padding-left: 56px; }
        .content { padding: 18px 16px; }
        .cards-row { grid-template-columns: repeat(2, 1fr); }
        .detail-grid { grid-template-columns: 1fr; }
        .or-detail-grid { grid-template-columns: 1fr; }
