<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F4F2EE;color:#1a1a1a;min-height:100vh;}
.setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.setup-card{background:#fff;border:0.5px solid #E0DDD6;border-radius:16px;width:460px;max-width:100%;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.header-bar{padding:32px 32px 20px;border-bottom:0.5px solid #F0EDE8;background:#1C2B3A;color:#fff;}
.header-title{font-size:20px;font-weight:700;letter-spacing:-0.01em;}
.header-sub{font-size:12px;color:rgba(255,255,255,0.7);margin-top:4px;line-height:1.4;}
.form-body{padding:26px 32px 32px;}
.err{background:#FCEBEB;color:#A32D2D;border:0.5px solid #F7C1C1;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:14px;display:none;line-height:1.5;}
.ok{background:#EAF3DE;color:#3B6D11;border:0.5px solid #C0DD97;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:14px;display:none;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.fl{font-size:12px;font-weight:600;color:#444;}
.fi{padding:10px 12px;border:0.5px solid #D0CCC6;border-radius:8px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;width:100%;color:#1a1a1a;transition:border-color 0.15s;}
.fi:focus{border-color:#7BBFFF;}
.btn-submit{width:100%;padding:12px;background:#1C2B3A;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;margin-top:8px;transition:opacity 0.15s;}
.btn-submit:hover{opacity:0.9;}
.btn-submit:disabled{opacity:0.5;cursor:not-allowed;}
.hint{font-size:11px;color:#888;text-align:center;margin-top:12px;line-height:1.4;}
.pw-toggle-btn {position:absolute;right:4px;top:50%;transform:translateY(-50%);cursor:pointer;color:#999;user-select:none;padding:8px;border-radius:6px;display:flex;align-items:center;justify-content:center;}

/* ── Responsive ── */
@media(max-width:480px){
  .setup-wrap{padding:12px;}
  .setup-card{border-radius:12px;}
  .header-bar{padding:24px 20px 16px;}
  .header-title{font-size:18px;}
  .form-body{padding:20px 20px 24px;}
  .fi{font-size:14px;padding:11px 12px;}
}
</style>
