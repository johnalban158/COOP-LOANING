<style>
  /* ── Split View Layout ── */
  .split-view {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
    height: calc(100vh - 140px);
  }

  /* ── Left Panel (Borrower List) ── */
  .left-panel {
    background: #fff;
    border: 0.5px solid #E0DDD6;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 16px 18px;
    border-bottom: 0.5px solid #E0DDD6;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    font-size: 14px;
    font-weight: 600;
    color: #1C2B3A;
  }

  .panel-count {
    font-size: 11px;
    color: #666;
    font-weight: 500;
  }

  .search-bar {
    padding: 12px 18px;
    border-bottom: 0.5px solid #E0DDD6;
  }

  .search-bar input {
    width: 100%;
    padding: 8px 12px;
    border: 0.5px solid #D0CCC6;
    border-radius: 6px;
    font-size: 13px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    box-sizing: border-box;
  }

  .search-bar input:focus {
    outline: none;
    border-color: #7BBFFF;
    box-shadow: 0 0 0 2px rgba(123, 191, 255, 0.1);
  }

  .borrower-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .borrower-item {
    padding: 12px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 4px;
    border: 0.5px solid transparent;
  }

  .borrower-item:hover {
    background: #FAFAF8;
    border-color: #E0DDD6;
  }

  .borrower-item.active {
    background: rgba(123, 191, 255, 0.08);
    border-color: #7BBFFF;
  }

  .borrower-name {
    font-size: 13px;
    font-weight: 600;
    color: #1C2B3A;
    margin-bottom: 4px;
  }

  .borrower-id {
    font-size: 11px;
    color: #666;
    font-family: 'DM Sans', monospace;
  }

  .borrower-balance {
    font-size: 12px;
    font-weight: 600;
    color: #3B6D11;
    margin-top: 6px;
  }

  .borrower-balance.overdue {
    color: #E05C5C;
  }

  /* ── Right Panel (Detail Panel) ── */
  .right-panel {
    background: #fff;
    border: 0.5px solid #E0DDD6;
    border-radius: 12px;
    overflow-y: auto;
    padding: 24px;
  }

  .detail-header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 0.5px solid #E0DDD6;
  }

  .detail-name {
    font-size: 18px;
    font-weight: 700;
    color: #1C2B3A;
    margin-bottom: 4px;
  }

  .detail-id {
    font-size: 12px;
    color: #666;
    font-family: 'DM Sans', monospace;
  }

  .detail-school {
    font-size: 13px;
    color: #444;
    margin-top: 6px;
  }

  /* ── Stats Cards ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: #FAFAF8;
    border: 0.5px solid #E0DDD6;
    border-radius: 8px;
    padding: 14px;
  }

  .stat-label {
    font-size: 10px;
    font-weight: 600;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 16px;
    font-weight: 700;
    font-family: 'DM Sans', sans-serif;
    color: #1C2B3A;
  }

  .stat-value.positive {
    color: #3B6D11;
  }

  .stat-value.negative {
    color: #E05C5C;
  }

  /* ── Sections ── */
  .detail-section {
    margin-bottom: 24px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: #1C2B3A;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-title button {
    font-size: 11px;
    padding: 6px 12px;
    background: #1C2B3A;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  .section-title button:hover {
    background: #0D47A1;
  }

  /* ── Payment History Table ── */
  .payment-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .payment-table th {
    text-align: left;
    padding: 10px 12px;
    font-size: 10px;
    font-weight: 600;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: #FAFAF8;
    border-bottom: 0.5px solid #E0DDD6;
  }

  .payment-table td {
    padding: 10px 12px;
    border-bottom: 0.5px solid #F0EDE8;
  }

  .payment-table .amount {
    font-weight: 600;
    font-family: 'DM Sans', monospace;
  }

  /* ── Deductions List ── */
  .deductions-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .deduction-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: #FAFAF8;
    border: 0.5px solid #E0DDD6;
    border-radius: 6px;
  }

  .deduction-info {
    flex: 1;
  }

  .deduction-name {
    font-size: 13px;
    font-weight: 600;
    color: #1C2B3A;
  }

  .deduction-details {
    font-size: 11px;
    color: #666;
    margin-top: 2px;
  }

  .deduction-amount {
    font-size: 13px;
    font-weight: 700;
    font-family: 'DM Sans', monospace;
    color: #E05C5C;
    margin-right: 12px;
  }

  .deduction-remove {
    width: 24px;
    height: 24px;
    border: none;
    background: #E05C5C;
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .deduction-remove:hover {
    background: #C53030;
  }

  .deductions-total {
    margin-top: 12px;
    padding: 10px 12px;
    background: rgba(224, 92, 92, 0.08);
    border: 0.5px solid #E05C5C;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #E05C5C;
    text-align: right;
  }

  /* ── Remarks Field ── */
  .remarks-field {
    width: 100%;
    min-height: 80px;
    padding: 10px 12px;
    border: 0.5px solid #D0CCC6;
    border-radius: 6px;
    font-size: 13px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    resize: vertical;
    box-sizing: border-box;
  }

  .remarks-field:focus {
    outline: none;
    border-color: #7BBFFF;
    box-shadow: 0 0 0 2px rgba(123, 191, 255, 0.1);
  }

  /* ── Modal Styles ── */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }

  .modal-content {
    background: #fff;
    border-radius: 12px;
    width: 400px;
    max-width: 90%;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-header {
    padding: 16px 20px;
    border-bottom: 0.5px solid #E0DDD6;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 600;
    color: #1C2B3A;
  }

  .modal-close {
    width: 28px;
    height: 28px;
    border: none;
    background: #F0EDE8;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
    color: #666;
  }

  .modal-close:hover {
    background: #E0DDD6;
  }

  .modal-body {
    padding: 20px;
  }

  .modal-footer {
    padding: 16px 20px;
    border-top: 0.5px solid #E0DDD6;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 8px 12px;
    border: 0.5px solid #D0CCC6;
    border-radius: 6px;
    font-size: 13px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    box-sizing: border-box;
  }

  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: #7BBFFF;
    box-shadow: 0 0 0 2px rgba(123, 191, 255, 0.1);
  }

  .radio-group {
    display: flex;
    gap: 16px;
  }

  .radio-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    color: #444;
    cursor: pointer;
  }

  .ded-preview {
    margin-top: 12px;
    padding: 10px 12px;
    background: #F0F7FF;
    border: 0.5px solid #90CAF9;
    border-radius: 6px;
    font-size: 13px;
    color: #0D47A1;
  }

  .ded-preview strong {
    font-family: 'DM Sans', monospace;
  }

  /* ── Empty State ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  .empty-icon {
    font-size: 32px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  .empty-title {
    font-size: 14px;
    font-weight: 600;
    color: #444;
    margin-bottom: 4px;
  }

  .empty-sub {
    font-size: 12px;
    color: #666;
  }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .split-view {
      grid-template-columns: 1fr;
      height: auto;
    }

    .left-panel {
      max-height: 400px;
    }

    .stats-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
