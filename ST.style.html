<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F4F2EE;color:#000;min-height:100vh;}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.main{display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:0.5px solid #E0DDD6;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-title{font-size:15px;font-weight:600;}
.topbar-sub{font-size:12px;color:#666;margin-top:1px;}
.topbar-right{display:flex;gap:8px;align-items:center;}
.btn-primary{background:#1C2B3A;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-primary:hover{opacity:0.9;}
.btn-back{background:#fff;color:#444;border:0.5px solid #D0CCC6;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-back:hover{background:#FAFAF8;}
.content{padding:24px 28px;flex:1;overflow-y:auto;}
.info-banner{background:#E6F1FB;border:0.5px solid #B5D4F4;border-radius:10px;padding:14px 18px;margin-bottom:22px;display:flex;align-items:flex-start;gap:12px;}
.info-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
.info-title{font-size:13px;font-weight:600;color:#185FA5;margin-bottom:3px;}
.info-text{font-size:12px;color:#185FA5;line-height:1.6;opacity:0.85;}
.cards-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px;}
.card{background:#fff;border:0.5px solid #E0DDD6;border-radius:12px;padding:16px;}
.card-label{font-size:11px;color:#666;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:6px;}
.card-val{font-size:22px;font-weight:700;font-family:'DM Sans',sans-serif;color:#000;}
.card-sub{font-size:11px;color:#777;margin-top:4px;}
.bl1{border-left:3px solid #7BBFFF;}
.bl2{border-left:3px solid #7DC28A;}
.bl3{border-left:3px solid #F5A623;}
.bl4{border-left:3px solid #E05C5C;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title{font-size:14px;font-weight:600;}
.filter-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filter-label{font-size:12px;color:#666;margin-right:4px;}
.filter-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid #E0DDD6;background:#fff;color:#666;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.15s;}
.filter-btn:hover{background:#FAFAF8;}
.filter-btn.on{background:#1C2B3A;color:#fff;border-color:#1C2B3A;}
.filter-btn.f-active.on{background:#3B6D11;border-color:#3B6D11;}
.filter-btn.f-overdue.on{background:#A32D2D;border-color:#A32D2D;}
.filter-btn.f-paid.on{background:#555;border-color:#555;}
.table-wrap{background:#fff;border:0.5px solid #E0DDD6;border-radius:12px;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:#666;letter-spacing:0.06em;text-transform:uppercase;background:#FAFAF8;border-bottom:0.5px solid #E0DDD6;}
tbody td{padding:11px 14px;border-bottom:0.5px solid #F0EDE8;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#FAFAF8;}
.name-cell{font-weight:500;}
.sub-cell{font-size:11px;color:#666;margin-top:2px;}
.mono{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;color:#000;}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;}
.p-t{background:#E6F1FB;color:#185FA5;}
.p-jo{background:#EAF3DE;color:#3B6D11;}
.p-active{background:#EAF3DE;color:#3B6D11;}
.p-pending{background:#FAEEDA;color:#854F0B;}
.p-late{background:#FCEBEB;color:#A32D2D;}
.p-paid{background:#F1EFE8;color:#5F5E5A;}
.progress-wrap{width:100px;height:6px;background:#F0EDE8;border-radius:3px;overflow:hidden;}
.progress-bar{height:100%;background:#7BBFFF;border-radius:3px;}
.progress-bar.done{background:#7DC28A;}
.progress-bar.late{background:#E05C5C;}
.empty-state{text-align:center;padding:60px 24px;}
.empty-icon{font-size:36px;margin-bottom:12px;}
.empty-title{font-size:14px;font-weight:600;color:#444;margin-bottom:6px;}
.empty-sub{font-size:12px;color:#777;line-height:1.7;max-width:320px;margin:0 auto;}
.action-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid #E0DDD6;background:#fff;color:#444;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.15s;}
.action-btn:hover{background:#FAFAF8;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:200;}
.modal{background:#fff;border-radius:16px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.12);}
.modal-header{padding:20px 24px 16px;border-bottom:0.5px solid #E0DDD6;display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:14px;font-weight:600;}
.modal-close{font-size:22px;color:#777;cursor:pointer;line-height:1;}
.modal-body{padding:20px 24px 28px;}
.modal-section{font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;margin-top:20px;}
.modal-section:first-child{margin-top:0;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.detail-item{background:#FAFAF8;border-radius:8px;padding:10px 12px;border:0.5px solid #F0EDE8;}
.detail-label{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;}
.detail-val{font-size:13px;font-weight:500;color:#000;}
.schedule-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.schedule-table th{text-align:left;padding:8px 10px;font-size:10px;font-weight:600;color:#666;letter-spacing:0.06em;text-transform:uppercase;background:#FAFAF8;border-bottom:0.5px solid #E0DDD6;}
.schedule-table td{padding:8px 10px;border-bottom:0.5px solid #F0EDE8;font-family:'DM Sans',sans-serif;font-weight:700;}
.schedule-table tr:last-child td{border-bottom:none;}
.row-paid td{color:#999;}
.row-next td{background:#EDF5FF;font-weight:600;}
.modal-actions{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:0.5px solid #F0EDE8;}
.btn-close-modal{width:100%;padding:10px;background:#fff;color:#444;border:0.5px solid #D0CCC6;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1C2B3A;color:#fff;padding:10px 22px;border-radius:8px;font-size:13px;display:none;z-index:999;white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif;}

/* ── Responsive ── */
@media(max-width:900px){
  .shell{grid-template-columns:1fr;}
  .topbar{padding:14px 16px;padding-left:56px;}
  .content{padding:18px 16px;}
  .cards-row{grid-template-columns:repeat(2,1fr);}
  .detail-grid{grid-template-columns:1fr;}
  .modal{width:95vw;}
  .table-wrap{overflow-x:auto;}
}
@media(max-width:480px){
  .cards-row{grid-template-columns:1fr;}
}

/* ── CBU Percentage Editor Panel ── */
.cbu-editor-panel{background:#fff;border:1.5px solid #B5D4F4;border-radius:12px;margin-bottom:20px;overflow:hidden;}
.cbu-panel-header{background:#E6F1FB;padding:10px 18px;font-size:12px;font-weight:700;color:#185FA5;letter-spacing:0.03em;display:flex;align-items:center;justify-content:space-between;}
.cbu-panel-body{padding:14px 18px;}
.cbu-desc{font-size:12px;color:#555;margin-bottom:12px;line-height:1.5;}
.cbu-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.cbu-row label{font-size:13px;font-weight:600;color:#333;}
.cbu-input{width:90px;padding:8px 10px;border:1.5px solid #B5D4F4;border-radius:8px;font-size:15px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;text-align:center;color:#185FA5;outline:none;}
.cbu-input:focus{border-color:#185FA5;}
.cbu-unit{font-size:14px;font-weight:600;color:#555;}
.cbu-preview{font-size:12px;color:#3B6D11;background:#EAF3DE;padding:3px 10px;border-radius:20px;font-weight:600;}
.cbu-save-btn{padding:8px 20px;background:#1C2B3A;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:opacity 0.15s;}
.cbu-save-btn:hover{opacity:0.85;}
.cbu-saved-badge{font-size:12px;font-weight:600;color:#3B6D11;background:#EAF3DE;padding:3px 10px;border-radius:20px;}
</style>
