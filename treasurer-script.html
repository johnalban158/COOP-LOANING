<script>
var RELEASES = [];
var PENDING_LOANS = [];
var RELEASED_LOANS = [];
var _selectedLoans = [];

function loadReleases() {
  var pendingTbody = document.getElementById('pending-tbody');
  var releasedTbody = document.getElementById('released-tbody');
  if (!pendingTbody || !releasedTbody) return;
  
  pendingTbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">&#128176;</div><div class="empty-title">Loading pending loans...</div><div class="empty-sub">Fetching pending loan release records.</div></div></td></tr>';
  releasedTbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#128176;</div><div class="empty-title">Loading released loans...</div><div class="empty-sub">Fetching released loan records.</div></div></td></tr>';
  
  google.script.run
    .withSuccessHandler(function(data) {
      console.log('Treasurer backend response:', JSON.stringify(data));
      if (data && data.success) {
        RELEASES = data.loans || [];
        processLoans();
        renderPendingTable();
        renderReleasedTable();
        updateStats();
      } else {
        var errorMsg = data && data.message ? data.message : 'Unknown error occurred';
        console.log('Error loading treasurer data:', errorMsg);
        pendingTbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Error loading data</div><div class="empty-sub">' + errorMsg + '</div></div></td></tr>';
        releasedTbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Error loading data</div><div class="empty-sub">' + errorMsg + '</div></div></td></tr>';
      }
    })
    .withFailureHandler(function(e) {
      console.log('Treasurer backend failure:', e);
      var errorMsg = 'Failed to connect to server: ' + (e.message || 'Unknown error');
      pendingTbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Connection Error</div><div class="empty-sub">' + errorMsg + '</div></div></td></tr>';
      releasedTbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Connection Error</div><div class="empty-sub">' + errorMsg + '</div></div></td></tr>';
    })
    .getTreasurerReleaseData();
}

function processLoans() {
  PENDING_LOANS = [];
  RELEASED_LOANS = [];
  
  RELEASES.forEach(function(r) {
    var s = (r.status || '').toLowerCase();
    if (s.indexOf('approved') !== -1 && s.indexOf('settlement') !== -1) {
      PENDING_LOANS.push(r);
    } else if (s === 'released') {
      RELEASED_LOANS.push(r);
    }
  });
  
  // Sort released loans by date released (most recent first)
  RELEASED_LOANS.sort(function(a, b) {
    return new Date(b.dateReleased || 0) - new Date(a.dateReleased || 0);
  });
}

function renderPendingTable() {
  var tbody = document.getElementById('pending-tbody');
  if (!tbody) return;
  
  if (PENDING_LOANS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">&#128176;</div><div class="empty-title">No pending loans</div><div class="empty-sub">No loans awaiting release.</div></div></td></tr>';
    return;
  }
  
  var html = '';
  PENDING_LOANS.forEach(function(r, i) {
    var totalDeductions = (r.totalB || 0) + (r.totalC || 0);
    var netRelease = (r.amount || 0) - totalDeductions;
    
    html += '<tr>';
    html += '<td><input type="checkbox" class="loan-checkbox" data-index="' + i + '" data-row="' + r.row + '" data-net="' + netRelease + '" onchange="updateSelection()" /></td>';
    html += '<td><div class="mem-name">' + r.lastName + ', ' + r.firstName + '</div><div class="mem-id">' + r.memberId + '</div></td>';
    html += '<td>' + (r.school || '-') + '</td>';
    html += '<td>' + (r.purpose || '-') + '</td>';
    html += '<td>' + (r.dateSubmitted || r.dateApproved || '-') + '</td>';
    html += '<td class="mono">₱' + (r.amount || 0).toLocaleString() + '</td>';
    html += '<td class="mono">₱' + totalDeductions.toLocaleString() + '</td>';
    html += '<td class="mono" style="color:#3B6D11;font-weight:600;">₱' + netRelease.toLocaleString() + '</td>';
    html += '<td><span class="status-badge stat-settlement">In Settlement</span></td>';
    html += '<td><button class="btn-release" onclick="openReleaseOv(' + i + ')">&#128666; Release</button></td>';
    html += '</tr>';
  });
  
  tbody.innerHTML = html;
}

function renderReleasedTable() {
  var tbody = document.getElementById('released-tbody');
  if (!tbody) return;
  
  if (RELEASED_LOANS.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">&#128176;</div><div class="empty-title">No released loans yet</div><div class="empty-sub">Released loans will appear here.</div></div></td></tr>';
    return;
  }
  
  var html = '';
  RELEASED_LOANS.forEach(function(r, i) {
    // Map back to RELEASES index
    var releaseIdx = RELEASES.indexOf(r);
    var totalDeductions = (r.totalB || 0) + (r.totalC || 0);
    var netReleased = (r.amount || 0) - totalDeductions;
    
    html += '<tr>';
    var memId = r.memberId || '';
    var memName = (r.lastName || '') + ', ' + (r.firstName || '');
    html += '<td><div class="mem-name" style="cursor:pointer;color:#185FA5;" onclick="viewMemberLedger(\'' + memId + '\',\'' + memName.replace(/'/g, "\\'") + '\')">' + memName + '</div><div class="mem-id">' + memId + '</div></td>';
    html += '<td>' + (r.school || '-') + '</td>';
    html += '<td>' + (r.purpose || '-') + '</td>';
    html += '<td class="mono">₱' + (r.amount || 0).toLocaleString() + '</td>';
    html += '<td class="mono">₱' + totalDeductions.toLocaleString() + '</td>';
    html += '<td class="mono" style="color:#3B6D11;font-weight:600;">₱' + netReleased.toLocaleString() + '</td>';
    html += '<td>' + (r.dateReleased || '-') + '</td>';
    html += '<td>' + (r.releasedBy || '-') + '</td>';
    html += '<td><span class="status-badge stat-released">Released</span></td>';
    html += '<td><button class="btn-release" style="background:#1C2B3A;font-size:11px;padding:4px 10px;" onclick="viewLedger(' + releaseIdx + ')">&#128196; Ledger</button></td>';
    html += '</tr>';
  });
  
  tbody.innerHTML = html;
}

function updateStats() {
  var pendingCount = PENDING_LOANS.length;
  var pendingNet = 0;
  var releasedToday = 0;
  var totalReleased = RELEASED_LOANS.length;
  
  var now = new Date();
  var currentMonth = now.getMonth();
  var currentYear = now.getFullYear();
  
  PENDING_LOANS.forEach(function(r) {
    var totalDeductions = (r.totalB || 0) + (r.totalC || 0);
    pendingNet += (r.amount || 0) - totalDeductions;
  });
  
  RELEASED_LOANS.forEach(function(r) {
    var releaseDate = new Date(r.dateReleased || 0);
    if (releaseDate.getMonth() === currentMonth && releaseDate.getFullYear() === currentYear) {
      releasedToday++;
    }
  });
  
  document.getElementById('stat-pending-count').textContent = pendingCount;
  document.getElementById('stat-pending-net').textContent = '₱' + pendingNet.toLocaleString();
  document.getElementById('stat-released-today').textContent = releasedToday;
  document.getElementById('stat-total-released').textContent = totalReleased;
}

function toggleSelectAllPending() {
  var selectAll = document.getElementById('select-all-pending');
  var checkboxes = document.querySelectorAll('.loan-checkbox');
  
  checkboxes.forEach(function(cb) {
    cb.checked = selectAll.checked;
  });
  
  updateSelection();
}

function updateSelection() {
  var checkboxes = document.querySelectorAll('.loan-checkbox:checked');
  var selectedCount = checkboxes.length;
  var selectedTotal = 0;
  
  _selectedLoans = [];
  
  checkboxes.forEach(function(cb) {
    var net = parseFloat(cb.dataset.net) || 0;
    selectedTotal += net;
    _selectedLoans.push({
      row: cb.dataset.row,
      index: cb.dataset.index,
      net: net
    });
  });
  
  var actionBar = document.getElementById('sticky-action-bar');
  if (selectedCount > 0) {
    actionBar.style.display = 'block';
    document.getElementById('selected-count').textContent = selectedCount;
    document.getElementById('selected-total').textContent = '₱' + selectedTotal.toLocaleString();
  } else {
    actionBar.style.display = 'none';
  }
  
  // Update select all checkbox
  var allCheckboxes = document.querySelectorAll('.loan-checkbox');
  var selectAll = document.getElementById('select-all-pending');
  selectAll.checked = (selectedCount > 0 && selectedCount === allCheckboxes.length);
}

function clearSelection() {
  var checkboxes = document.querySelectorAll('.loan-checkbox');
  checkboxes.forEach(function(cb) {
    cb.checked = false;
  });
  
  document.getElementById('select-all-pending').checked = false;
  updateSelection();
}

function batchRelease() {
  if (_selectedLoans.length === 0) return;
  
  var rows = _selectedLoans.map(function(sl) { return sl.row; });
  
  showToast('Releasing ' + _selectedLoans.length + ' loans...');
  
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        showToast('\u2713 ' + _selectedLoans.length + ' loans released!');
        clearSelection();
        loadReleases();
      } else {
        showToast('Error: ' + (res && res.message || 'Failed'));
      }
    })
    .withFailureHandler(function(e) {
      showToast('Error: ' + e.message);
    })
    .batchReleaseLoans(rows);
}

function openReleaseOv(idx) {
  _pendingReleaseIdx = idx;
  var r = PENDING_LOANS[idx];
  if (!r) return;
  
  document.getElementById('release-loan-name').textContent = r.firstName + ' ' + r.lastName + ' (' + r.memberId + ')';
  
  // Clear deduction fields
  document.getElementById('ded-past-st').value = '';
  document.getElementById('ded-past-com').value = '';
  document.getElementById('ded-canteen').value = '';
  document.getElementById('ded-ticket').value = '';
  document.getElementById('ded-others').value = '';
  document.getElementById('ded-reg').value = '';
  document.getElementById('ded-cbu').value = '';
  document.getElementById('ded-service').value = '';
  document.getElementById('ded-insurance').value = '';
  document.getElementById('ded-notarial').value = '';
  
  // Set default claiming date to today
  var today = new Date();
  var tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);
  document.getElementById('claiming-date').value = tomorrow.toISOString().split('T')[0];
  document.getElementById('claiming-time').value = '8:00 AM - 5:00 PM';
  document.getElementById('claiming-location').value = 'CampusCoop Office, SKSU';
  
  // Pre-fill with existing deductions if available
  if (r.totalB) {
    document.getElementById('ded-past-st').value = r.totalB || 0;
  }
  if (r.totalC) {
    document.getElementById('ded-cbu').value = r.totalC || 0;
  }
  
  updateDeductionSummary(r.amount || 0);

  // Auto-compute Insurance from the loan type's saved % (editable)
  google.script.run
    .withSuccessHandler(function(ds) {
      if (!ds || !ds.success) return;
      var lt = (r.loanType || '').toLowerCase();
      var pct = 0;
      if (lt.indexOf('regular') !== -1) {
        pct = ds.regOn === false ? 0 : (ds.regInsurancePct !== undefined ? ds.regInsurancePct : (ds.regInsurance || 0));
      } else if (lt.indexOf('short') !== -1) {
        pct = ds.stlOn === false ? 0 : (ds.stlInsurancePct !== undefined ? ds.stlInsurancePct : (ds.stlInsurance || 0));
      }
      var insEl = document.getElementById('ded-insurance');
      if (insEl) {
        insEl.value = ((r.amount || 0) * pct / 100).toFixed(2);
        updateDeductionSummary(r.amount || 0);
      }
    })
    .withFailureHandler(function() {})
    .getDeductionSettings();
  
  // Add event listeners to deduction fields
  var dedInputs = document.querySelectorAll('#release-ov input[type="number"]');
  dedInputs.forEach(function(input) {
    input.onchange = function() { updateDeductionSummary(r.amount || 0); };
  });
  
  document.getElementById('release-ov').style.display = 'flex';
}

function closeReleaseOv() {
  document.getElementById('release-ov').style.display = 'none';
  _pendingReleaseIdx = null;
}

function updateDeductionSummary(loanAmount) {
  var pastSt = parseFloat(document.getElementById('ded-past-st').value) || 0;
  var pastCom = parseFloat(document.getElementById('ded-past-com').value) || 0;
  var canteen = parseFloat(document.getElementById('ded-canteen').value) || 0;
  var ticket = parseFloat(document.getElementById('ded-ticket').value) || 0;
  var others = parseFloat(document.getElementById('ded-others').value) || 0;
  var reg = parseFloat(document.getElementById('ded-reg').value) || 0;
  var cbu = parseFloat(document.getElementById('ded-cbu').value) || 0;
  var service = parseFloat(document.getElementById('ded-service').value) || 0;
  var insurance = parseFloat(document.getElementById('ded-insurance').value) || 0;
  var notarial = parseFloat(document.getElementById('ded-notarial').value) || 0;
  
  var totalDeductions = pastSt + pastCom + canteen + ticket + others + reg + cbu + service + insurance + notarial;
  var netProceeds = loanAmount - totalDeductions;
  
  document.getElementById('summary-deductions').textContent = '₱' + totalDeductions.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  document.getElementById('summary-net').textContent = '₱' + netProceeds.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function confirmRelease() {
  if (_pendingReleaseIdx === null) return;
  var r = PENDING_LOANS[_pendingReleaseIdx];
  if (!r) return;
  
  var pastSt = parseFloat(document.getElementById('ded-past-st').value) || 0;
  var pastCom = parseFloat(document.getElementById('ded-past-com').value) || 0;
  var canteen = parseFloat(document.getElementById('ded-canteen').value) || 0;
  var ticket = parseFloat(document.getElementById('ded-ticket').value) || 0;
  var others = parseFloat(document.getElementById('ded-others').value) || 0;
  var reg = parseFloat(document.getElementById('ded-reg').value) || 0;
  var cbu = parseFloat(document.getElementById('ded-cbu').value) || 0;
  var service = parseFloat(document.getElementById('ded-service').value) || 0;
  var insurance = parseFloat(document.getElementById('ded-insurance').value) || 0;
  var notarial = parseFloat(document.getElementById('ded-notarial').value) || 0;
  
  var totalB = pastSt + pastCom + canteen + ticket + others;
  var totalC = reg + cbu + service + insurance + notarial;
  var netProceeds = (r.amount || 0) - (totalB + totalC);
  
  // Get claiming schedule data
  var claimingDate = document.getElementById('claiming-date').value;
  var claimingTime = document.getElementById('claiming-time').value;
  var claimingLocation = document.getElementById('claiming-location').value;
  
  closeReleaseOv();
  showToast('Releasing loan...');
  
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        showToast('\u2713 Loan released!');
        loadReleases();
      } else {
        showToast('Error: ' + (res && res.message || 'Failed'));
      }
    })
    .withFailureHandler(function(e) {
      showToast('Error: ' + e.message);
    })
    .finalReleaseLoan(r.row, {
      totalB: totalB,
      totalC: totalC,
      netProceeds: netProceeds
    }, {
      claimingDate: claimingDate,
      claimingTime: claimingTime,
      claimingLocation: claimingLocation
    });
}

function viewLedger(idx) {
  var r = RELEASES[idx];
  if (!r) return;
  viewMemberLedger(r.memberId || '', (r.firstName || '') + ' ' + (r.lastName || ''));
}

function viewMemberLedger(memberId, memberName) {
  document.getElementById('ledger-loan-name').textContent = memberName + ' (' + memberId + ')';
  document.getElementById('ledger-content').innerHTML = '<div style="text-align:center;padding:30px;color:#888;">Loading all loans for ' + memberName + '...</div>';
  document.getElementById('ledger-ov').style.display = 'flex';

  google.script.run
    .withSuccessHandler(function(loansResult) {
      if (!loansResult || !loansResult.success || !loansResult.loans || loansResult.loans.length === 0) {
        document.getElementById('ledger-content').innerHTML = '<div style="text-align:center;padding:30px;color:#888;">No loans found for this member.</div>';
        return;
      }
      var loans = loansResult.loans;

      google.script.run
        .withSuccessHandler(function(payResult) {
          var allPayments = (payResult && payResult.success) ? payResult.payments : [];
          renderMemberLedger(memberId, memberName, loans, allPayments);
        })
        .withFailureHandler(function() {
          renderMemberLedger(memberId, memberName, loans, []);
        })
        .getPaymentsByLoanId('');
    })
    .withFailureHandler(function() {
      document.getElementById('ledger-content').innerHTML = '<div style="text-align:center;padding:30px;color:#A32D2D;">Error loading loan data.</div>';
    })
    .getAllLoansByMember(memberId);
}

function renderMemberLedger(memberId, memberName, loans, allPayments) {
  var memberPayments = allPayments.filter(function(p) { return p.memberId === memberId; });
  var html = '';
  var grandTotalLoans = 0;
  var grandTotalBalance = 0;
  var grandTotalPaid = 0;
  var grandMonthsPaid = 0;
  var grandMonthsTotal = 0;

  loans.forEach(function(loan, li) {
    var loanType = loan.loanType || '';
    var term = loan.term || 1;
    var amount = loan.amount || 0;
    var monthly = loan.monthly || 0;
    var balance = loan.balance || 0;
    var isRegular = loanType === 'Regular';
    var fixedPrincipal = isRegular && term > 0 ? Math.round(amount / term) : 0;

    // Filter payments for this specific loan (by loanType)
    var loanPmts = memberPayments.filter(function(p) { return p.loanType === loanType; });
    var paidMonths = {};
    loanPmts.forEach(function(p) {
      var mn = p.monthNum;
      if (p.status === 'Confirmed' || p.status === 'Paid') {
        if (!paidMonths[mn] || paidMonths[mn].status === 'Pending') paidMonths[mn] = p;
      } else if (p.status === 'Pending') {
        if (!paidMonths[mn]) paidMonths[mn] = p;
      }
    });

    // Loan header with type badge
    var typeColors = { 'Regular': '#3B6D11', 'Commodity': '#6B3B9A', 'Short Term': '#185FA5' };
    var typeBg = { 'Regular': '#EAF3DE', 'Commodity': '#F3EAFB', 'Short Term': '#E6F1FB' };
    var tc = typeColors[loanType] || '#374151';
    var tb = typeBg[loanType] || '#F3F4F6';

    html += '<div class="ledger-section" style="margin-top:' + (li > 0 ? '24px' : '0') + ';">';
    html += '<span style="display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:700;background:' + tb + ';color:' + tc + ';margin-right:8px;">' + loanType + '</span>';
    html += loan.loanId + ' \u2014 \u20B1' + amount.toLocaleString() + ' (' + term + ' mo)';
    html += '</div>';

    html += '<table class="ledger-table">';
    html += '<thead><tr><th>#</th><th>Due Amount</th><th>Paid Amount</th><th>OR Number</th><th>Date Paid</th><th>Status</th><th>Running Balance</th></tr></thead>';
    html += '<tbody>';

    var runningBalance = amount;
    var loanPaid = 0;
    var loanPaidCount = 0;

    for (var i = 1; i <= term; i++) {
      var dueAmount = 0;
      if (isRegular && fixedPrincipal > 0) {
        var intAmt = Math.round(runningBalance * 0.01);
        dueAmount = fixedPrincipal + intAmt;
      } else {
        dueAmount = monthly || Math.round(amount / term);
      }
      if (dueAmount > runningBalance) dueAmount = runningBalance;

      var pmt = paidMonths[i];
      var statusText = 'Due';
      var statusClass = 'stat-pending';
      var paidAmount = 0;
      var orNumber = '-';
      var datePaid = '-';

      if (pmt) {
        paidAmount = pmt.amount || 0;
        orNumber = pmt.orNumber || pmt.reference || '-';
        datePaid = pmt.datePaid || pmt.timestamp || '-';
        if (pmt.status === 'Confirmed' || pmt.status === 'Paid') {
          statusText = 'Paid';
          statusClass = 'stat-released';
          loanPaidCount++;
          loanPaid += paidAmount;
          if (isRegular && fixedPrincipal > 0) {
            runningBalance -= Math.min(paidAmount, fixedPrincipal);
          } else {
            runningBalance -= paidAmount;
          }
        } else {
          statusText = 'Pending';
          statusClass = 'stat-settlement';
        }
      }

      if (runningBalance < 0) runningBalance = 0;
      var balDisplay = (i === term || runningBalance <= 0) && statusText === 'Paid' ? '\u20B10' : '\u20B1' + runningBalance.toLocaleString();
      var isPaid = (statusText === 'Paid');

      html += '<tr class="' + (isPaid ? 'row-paid' : (pmt ? 'row-pending' : '')) + '">';
      html += '<td style="font-weight:600;">' + i + '</td>';
      html += '<td class="mono">\u20B1' + dueAmount.toLocaleString() + '</td>';
      html += '<td class="mono">' + (paidAmount > 0 ? '\u20B1' + paidAmount.toLocaleString() : '-') + '</td>';
      html += '<td style="font-size:11px;">' + orNumber + '</td>';
      html += '<td style="font-size:11px;">' + datePaid + '</td>';
      html += '<td><span class="status-badge ' + statusClass + '">' + statusText + '</span></td>';
      html += '<td class="mono">' + balDisplay + '</td>';
      html += '</tr>';
    }

    html += '</tbody></table>';

    // Per-loan summary
    html += '<div style="display:flex;gap:12px;margin-top:8px;padding:8px 12px;background:#F8F7F5;border-radius:6px;font-size:12px;">';
    html += '<span style="color:#666;">Paid: <strong>' + loanPaidCount + '/' + term + '</strong></span>';
    html += '<span style="color:#666;">Collected: <strong>\u20B1' + loanPaid.toLocaleString() + '</strong></span>';
    html += '<span style="color:#666;">Balance: <strong style="color:' + (balance > 0 ? '#A32D2D' : '#3B6D11') + ';">\u20B1' + balance.toLocaleString() + '</strong></span>';
    html += '</div>';

    grandTotalLoans += amount;
    grandTotalBalance += balance;
    grandTotalPaid += loanPaid;
    grandMonthsPaid += loanPaidCount;
    grandMonthsTotal += term;
  });

  // Grand summary
  html += '<div style="display:flex;gap:16px;margin-top:18px;padding:14px;background:#1C2B3A;border-radius:10px;font-size:13px;color:#fff;">';
  html += '<div style="flex:1;"><span style="color:rgba(255,255,255,0.6);">Total Loans:</span> <strong>\u20B1' + grandTotalLoans.toLocaleString() + '</strong></div>';
  html += '<div style="flex:1;"><span style="color:rgba(255,255,255,0.6);">Months Paid:</span> <strong>' + grandMonthsPaid + '/' + grandMonthsTotal + '</strong></div>';
  html += '<div style="flex:1;"><span style="color:rgba(255,255,255,0.6);">Collected:</span> <strong>\u20B1' + grandTotalPaid.toLocaleString() + '</strong></div>';
  html += '<div style="flex:1;"><span style="color:rgba(255,255,255,0.6);">Outstanding:</span> <strong style="color:' + (grandTotalBalance > 0 ? '#F7C1C1' : '#7DC28A') + ';">\u20B1' + grandTotalBalance.toLocaleString() + '</strong></div>';
  html += '</div>';

  document.getElementById('ledger-content').innerHTML = html;
}

function closeLedgerOv() {
  document.getElementById('ledger-ov').style.display = 'none';
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() {
    t.style.display = 'none';
  }, 3000);
}

// Load releases on page load
if (document.getElementById('page-treasurer')) {
  loadReleases();
}
</script>
