<script>
var _eyeOpen = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var _eyeClosed = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

function togglePW(inputId, icon) {
  var el = document.getElementById(inputId);
  if (!el) return;
  if (el.type === 'password') {
    el.type = 'text';
    icon.innerHTML = _eyeClosed;
  } else {
    el.type = 'password';
    icon.innerHTML = _eyeOpen;
  }
}

// ── Authentication & Onboarding Guards ──
var currentMember = null;
var memberId = '';
var defaultPassword = '';
var isOfficer = false;
var officerRole = '';

(function() {
  // Check if this is officer setup via URL parameter
  var urlParams = new URLSearchParams(window.location.search);
  officerRole = urlParams.get('role') || '';
  
  if (officerRole) {
    isOfficer = true;
    // For officers, we don't need localStorage check - they're already authenticated
    // Just update the UI to reflect officer setup
    var title = document.querySelector('.header-title');
    var sub = document.querySelector('.header-sub');
    if (title) title.textContent = 'Setup Officer Profile';
    if (sub) sub.textContent = 'To secure your officer account, please configure your email address, phone number, and a new personal password.';
    return;
  }
  
  // Member setup flow
  try {
    var saved = localStorage.getItem('campuscoop_current_member');
    if (!saved) {
      redirectToLogin();
      return;
    }
    currentMember = JSON.parse(saved);
    if (!currentMember || !currentMember.username) {
      redirectToLogin();
      return;
    }
    // Block already set-up users from accessing this page
    if (currentMember.isProfileComplete === true) {
      redirectToDashboard();
      return;
    }
    memberId = currentMember.username;
    defaultPassword = currentMember.defaultPassword || '';
    
    // Fill in what we might have (phone normally is same as username initially)
    var phoneInput = document.getElementById('s-phone');
    if (phoneInput && currentMember.phone && currentMember.phone !== currentMember.username) {
      phoneInput.value = currentMember.phone;
    }
  } catch(e) {
    redirectToLogin();
  }
})();

function redirectToLogin() {
  var base = document.querySelector('base');
  var href = base ? base.href : '';
  window.top.location.href = href + '?page=login';
}

function redirectToDashboard() {
  var base = document.querySelector('base');
  var href = base ? base.href : '';
  if (isOfficer) {
    window.top.location.href = href + '?page=dashboard';
  } else {
    window.top.location.href = href + '?page=member-home';
  }
}

function submitSetupForm() {
  var err = document.getElementById('setup-err');
  var btn = document.getElementById('setup-btn');
  if (err) err.style.display = 'none';

  var name = document.getElementById('s-name').value.trim();
  var phone = document.getElementById('s-phone').value.trim();
  var email = document.getElementById('s-email').value.trim();
  var newPassword = document.getElementById('s-password').value;
  var confirmPassword = document.getElementById('s-confirm').value;

  // ── Validations ──
  if (isOfficer) {
    if (!name || !phone || !email || !newPassword || !confirmPassword) {
      showError('Please fill in all required fields (Name, Email, Mobile).');
      return;
    }
  } else {
    if (!phone || !email || !newPassword || !confirmPassword) {
      showError('All fields are required.');
      return;
    }
  }

  // PH mobile starts with 09 and is 11 digits
  var phoneDigits = phone.replace(/\D/g, '');
  if (!/^09\d{9}$/.test(phoneDigits)) {
    showError('Phone must be a valid PH mobile number (e.g. 09171234567).');
    return;
  }

  // Email format validation
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showError('Please enter a valid email address.');
    return;
  }

  // Min 8 chars password
  if (newPassword.length < 8) {
    showError('New password must be at least 8 characters long.');
    return;
  }

  // Prevent old/default password reuse
  if (defaultPassword && newPassword === defaultPassword) {
    showError('New password cannot be the same as your old temporary/default password.');
    return;
  }

  // Matching passwords
  if (newPassword !== confirmPassword) {
    showError('Confirm password does not match.');
    return;
  }

  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Saving Profile...';
  }

  if (isOfficer) {
    // Officer profile setup
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.success) {
          redirectToDashboard();
        } else {
          showError(r.message || 'Failed to save officer profile. Please try again.');
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Complete Profile Setup';
          }
        }
      })
      .withFailureHandler(function(e) {
        showError('Connection Error: ' + e.message);
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Complete Profile Setup';
        }
      })
      .completeOfficerProfileSetup({
        role: officerRole,
        name: name,
        email: email,
        mobile: phoneDigits,
        newPassword: newPassword
      });
  } else {
    // Member profile setup
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.success) {
          try {
            localStorage.setItem('campuscoop_current_member', JSON.stringify(r.member));
          } catch(e) {}
          redirectToDashboard();
        } else {
          showError(r.message || 'Underlying spreadsheet error. Please try again.');
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Complete Profile Setup';
          }
        }
      })
      .withFailureHandler(function(e) {
        showError('Connection Error: ' + e.message);
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Complete Profile Setup';
        }
      })
      .completeProfileSetup(memberId, {
        phone: phoneDigits,
        email: email,
        newPassword: newPassword,
        confirmPassword: confirmPassword
      });
  }
}

function showError(msg) {
  var err = document.getElementById('setup-err');
  if (err) {
    err.textContent = msg;
    err.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}
</script>
