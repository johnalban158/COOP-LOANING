<script>
/* ── Instant SPA navigation ─────────────────
   navigate() just toggles CSS classes.
   Zero server calls. Zero page reloads.
──────────────────────────────────────────── */

document.addEventListener('DOMContentLoaded',
  function() {
    navigate(window.CURRENT_PAGE
      || 'dashboard');
    // Filter sidebar based on role
    if (typeof filterSidebarForRole === 'function') {
      filterSidebarForRole();
    }
    // Always load saved settings on page load
    if (typeof initSettings === 'function') {
      initSettings();
    }
    // Pre-fetch data in background for faster navigation
    if (typeof loadMembers === 'function') {
      google.script.run.withSuccessHandler(function(r) {
        if (r && r.success) window._prefetchedMembers = r;
      }).getMembers();
    }
    if (typeof loadApplications === 'function') {
      google.script.run.withSuccessHandler(function(r) {
        if (r && r.success) window._prefetchedApps = r;
      }).getApplications();
    }
  });

function navigate(page) {
  // Role-based access control
  var role = localStorage.getItem('campuscoop_role') || 'admin';
  var restrictedPages = {
    'chairperson': ['applications', 'shortterm', 'regular', 'commodity', 'treasurer', 'deductions', 'officer', 'payments', 'collections', 'overdue', 'officers', 'sms', 'settings', 'reports'],
    'regular': ['shortterm', 'commodity', 'treasurer', 'deductions', 'officer', 'officers', 'sms', 'settings', 'reports'],
    'shortterm': ['regular', 'treasurer', 'deductions', 'officer', 'officers', 'sms', 'settings', 'reports'],
    'commodity': ['regular', 'treasurer', 'deductions', 'officer', 'officers', 'sms', 'settings', 'reports'],
    'treasurer': ['applications', 'shortterm', 'regular', 'commodity', 'deductions', 'officer', 'officers', 'sms', 'settings', 'reports']
  };
  
  if (restrictedPages[role] && restrictedPages[role].indexOf(page) !== -1) {
    showToast('Access denied: ' + role + ' cannot access ' + page);
    // Redirect to dashboard
    page = 'dashboard';
  }

  var pages = document.querySelectorAll(
    '.page');
  pages.forEach(function(p) {
    p.classList.remove('active');
  });
  var target = document.getElementById(
    'page-' + page);
  if (target) {
    target.classList.add('active');
  } else {
    comingSoon(page);
    return;
  }
  // Auto-initialize settings when navigating to it
  if (page === 'settings' && typeof initSettings === 'function') {
    initSettings();
  }
  // Auto-load applications when navigating to it
  if (page === 'applications' && typeof loadApplications === 'function') {
    loadApplications();
  }
  // Auto-load payments when navigating to it
  if (page === 'payments' && typeof loadPayments === 'function') {
    loadPayments();
  }
  // Auto-load members when navigating to it
  if (page === 'members' && typeof loadMembers === 'function') {
    loadMembers();
  }
  // Auto-load accounts (member enrollment) when navigating to it
  if (page === 'accounts' && typeof loadAccountsPage === 'function') {
    loadAccountsPage();
  }
  // Auto-load officer assignments (chairman) when navigating to it
  if (page === 'officers' && typeof loadOfficersPage === 'function') {
    loadOfficersPage();
  }
  // Auto-load collections when navigating to it
  if (page === 'collections' && typeof loadCollections === 'function') {
    loadCollections();
  }
  // Auto-load overdue when navigating to it
  if (page === 'overdue' && typeof loadOverdue === 'function') {
    loadOverdue();
  }
  // Auto-load reminders when navigating to it
  if (page === 'sms' && typeof loadSmsPage === 'function') {
    loadSmsPage();
  }
  // Auto-load analytics when navigating to it
  if (page === 'analytics' && typeof loadAnalytics === 'function') {
    loadAnalytics();
  }
  // Auto-load dashboard data
  if (page === 'dashboard' && typeof loadDashboard === 'function') {
    loadDashboard();
  }
  // Auto-load reports when navigating to it
  if (page === 'reports' && typeof loadReports === 'function') {
    loadReports();
  }
  // Auto-load treasurer loan releases when navigating to it
  if (page === 'treasurer' && typeof loadReleases === 'function') {
    loadReleases();
  }
  // Auto-load officer borrower ledgers when navigating to it
  if (page === 'officer' && typeof loadOfficerData === 'function') {
    loadOfficerData();
  }
  // Auto-load deductions when navigating to it
  if (page === 'deductions' && typeof initDeductionsPage === 'function') {
    initDeductionsPage();
  }
  // Auto-load short term loans
  if (page === 'shortterm' && typeof loadSTLoans === 'function') {
    loadSTLoans();
  }
  // Auto-load regular loans
  if (page === 'regular' && typeof loadRegLoans === 'function') {
    loadRegLoans();
  }
  // Auto-load commodity loans
  if (page === 'commodity' && typeof loadComLoans === 'function') {
    loadComLoans();
  }
  document.querySelectorAll(
    '.nav-item').forEach(function(n) {
      n.classList.remove('active');
    });
  var nav = document.getElementById(
    'nav-' + page);
  if (nav) nav.classList.add('active');

  // Close sidebar on mobile after navigating
  var sb = document.querySelector('.sidebar');
  var ov = document.getElementById('sidebarOverlay');
  if (sb) sb.classList.remove('open');
  if (ov) ov.classList.remove('on');
}

function filterSidebarForRole() {
  var role = localStorage.getItem('campuscoop_role') || 'admin';
  
  // Elements to hide for chairperson (view-only, no loan management)
  var chairpersonHideIds = [
    'nav-applications', 'nav-shortterm', 'nav-regular', 'nav-commodity',
    'nav-treasurer', 'nav-deductions', 'nav-officer', 'nav-overdue', 'nav-payments', 'nav-collections'
  ];
  
  // Elements to hide for regular officer
  var regularHideIds = ['nav-shortterm', 'nav-commodity', 'nav-treasurer', 'nav-deductions', 'nav-officer'];
  
  // Elements to hide for shortterm/commodity officer
  var stlComHideIds = ['nav-regular', 'nav-treasurer', 'nav-deductions', 'nav-officer'];
  
  // Elements to hide for all officers (non-admin)
  var officerHideIds = ['nav-settings', 'nav-sms', 'nav-officers', 'nav-reports'];
  
  var hideIds = [];
  
  if (role === 'chairperson') {
    hideIds = chairpersonHideIds.concat(officerHideIds);
  } else if (role === 'regular') {
    hideIds = regularHideIds.concat(officerHideIds);
  } else if (role === 'shortterm' || role === 'commodity') {
    hideIds = stlComHideIds.concat(officerHideIds);
  } else if (role !== 'admin') {
    hideIds = officerHideIds;
  }
  
  hideIds.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
  
  // Update sidebar role label
  var roleNames = {
    'admin': 'Master Admin',
    'regular': 'Regular Loan Officer',
    'shortterm': 'Short Term Officer',
    'commodity': 'Commodity Officer',
    'treasurer': 'Treasurer',
    'chairperson': 'Chairperson (View-Only)'
  };
  var label = document.getElementById('sidebar-role-label');
  if (label) label.textContent = roleNames[role] || 'Officer';
  
  // Show officer info for non-admin roles
  var officerInfo = document.getElementById('officer-info');
  if (officerInfo && role !== 'admin') {
    officerInfo.style.display = 'block';
    var name = localStorage.getItem('campuscoop_officer_name') || '';
    var email = localStorage.getItem('campuscoop_officer_email') || '';
    var mustChange = localStorage.getItem('campuscoop_must_change_pw') === 'true';
    var nameEl = document.getElementById('officer-name');
    var warnEl = document.getElementById('officer-warning');
    if (nameEl) nameEl.textContent = name || email || role;
    if (warnEl) warnEl.style.display = mustChange ? 'block' : 'none';
  }
}

function comingSoon(name) {
  showToast((name.charAt(0).toUpperCase()
    + name.slice(1))
    + ' page is coming soon!');
}

function closeModal(id) {
  var m = document.getElementById(id);
  if (m) m.style.display = 'none';
  // Reset approval busy flag so the button works again if user re-opens
  if (typeof _appBusy !== 'undefined') _appBusy = false;
  document.querySelectorAll('.btn-approve, .btn-reject, .action-btn')
    .forEach(function(b){ b.disabled = false; b.style.opacity = ''; b.style.cursor = ''; });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._tt);
  window._tt = setTimeout(function() {
    t.style.display = 'none';
  }, 2500);
}
</script>
<div id="toast" style="position:fixed;
  bottom:28px;left:50%;
  transform:translateX(-50%);
  background:#1C2B3A;color:#fff;
  padding:10px 20px;border-radius:8px;
  font-size:13px;display:none;z-index:999;
  white-space:nowrap;
  font-family:'Plus Jakarta Sans',sans-serif;">
</div>

<!-- ── Fullscreen Toggle Button ── -->
<button id="fs-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen" style="
  position:fixed;
  bottom:18px;
  right:18px;
  z-index:9999;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#1C2B3A;
  color:#fff;
  border:none;
  font-size:18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,0.25);
  transition:transform 0.15s,background 0.15s;
  opacity:0.85;
">&#x26F6;</button>
<script>
(function(){
  function toggleFullscreen() {
    var el = document.documentElement;
    if (!document.fullscreenElement &&
        !document.webkitFullscreenElement &&
        !document.mozFullScreenElement) {
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
      if (req) req.call(el);
    } else {
      var ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
      if (ex) ex.call(document);
    }
  }
  window.toggleFullscreen = toggleFullscreen;

  function updateFsIcon() {
    var btn = document.getElementById('fs-btn');
    if (!btn) return;
    var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
    btn.innerHTML = isFs ? '&#x2715;' : '&#x26F6;';
    btn.title = isFs ? 'Exit Fullscreen' : 'Enter Fullscreen';
    btn.style.background = isFs ? '#A32D2D' : '#1C2B3A';
  }

  // Hover effect
  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('fs-btn');
    if (btn) {
      btn.addEventListener('mouseenter', function(){ this.style.transform='scale(1.12)'; this.style.opacity='1'; });
      btn.addEventListener('mouseleave', function(){ this.style.transform='scale(1)'; this.style.opacity='0.85'; });
    }
  });

  document.addEventListener('fullscreenchange', updateFsIcon);
  document.addEventListener('webkitfullscreenchange', updateFsIcon);
  document.addEventListener('mozfullscreenchange', updateFsIcon);
})();
</script>
