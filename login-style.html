<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F4F2EE;color:#1a1a1a;min-height:100vh;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{background:#fff;border:0.5px solid #E0DDD6;border-radius:16px;width:520px;max-width:100%;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.logo-bar{padding:32px 32px 24px;}
.logo{font-size:22px;font-weight:700;color:#1C2B3A;letter-spacing:-0.02em;}
.logo span{color:#7BBFFF;}
.logo-sub{font-size:12px;color:#666;margin-top:3px;}
.tab-row{display:flex;border-bottom:0.5px solid #F0EDE8;}
.tab-btn{flex:1;padding:13px 0;font-size:13px;font-weight:500;color:#666;cursor:pointer;text-align:center;border-bottom:2px solid transparent;transition:all 0.15s;}
.tab-btn.on{color:#1C2B3A;border-bottom-color:#1C2B3A;}
.tab-btn.on-admin{color:#A32D2D;border-bottom-color:#A32D2D;}
.tab-body{padding:24px 32px 32px;display:none;}
.tab-body.on{display:block;}
.admin-center{text-align:center;padding:16px 0 8px;}
.admin-icon{width:64px;height:64px;border-radius:50%;background:#E6F1FB;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;}
.admin-title{font-size:15px;font-weight:600;color:#1C2B3A;margin-bottom:6px;}
.admin-desc{font-size:13px;color:#666;line-height:1.6;margin-bottom:24px;}
.btn-admin{width:100%;padding:13px;background:#1C2B3A;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:all 0.15s;}
.btn-admin:hover{background:#243447;box-shadow:0 4px 12px rgba(28,43,58,0.25);}
.btn-admin:disabled{opacity:0.5;cursor:not-allowed;box-shadow:none;}
.err{background:#FCEBEB;color:#A32D2D;border:0.5px solid #F7C1C1;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:12px;display:none;}
.ok{background:#EAF3DE;color:#3B6D11;border:0.5px solid #C0DD97;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:12px;display:none;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fl{font-size:12px;font-weight:500;color:#444;}
.fi{padding:9px 12px;border:0.5px solid #D0CCC6;border-radius:8px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;width:100%;color:#1a1a1a;transition:border-color 0.15s;}
.fi:focus{border-color:#7BBFFF;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.type-pills{display:flex;gap:8px;margin-bottom:4px;}
.type-pill{flex:1;padding:9px;border:0.5px solid #E0DDD6;border-radius:8px;text-align:center;cursor:pointer;font-size:12px;font-weight:500;color:#666;transition:all 0.15s;}
.sel-t{background:#E6F1FB;color:#185FA5;border-color:#B5D4F4;}
.sel-jo{background:#EAF3DE;color:#3B6D11;border-color:#C0DD97;}
/* ── Officer Role Pills ── */
.role-pills{display:flex;gap:8px;margin-bottom:12px;width:100%;}
.role-pill{flex:1;padding:10px 6px;border:1px solid #E0DDD6;border-radius:10px;text-align:center;cursor:pointer;font-size:11px;font-weight:600;color:#666;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.role-pill span{font-size:18px;margin-bottom:2px;}
.role-pill:hover{background:#FAFAF8;border-color:#D0CCC6;}
.role-pill.sel-reg{background:#E6F1FB;color:#185FA5;border-color:#7BBFFF;box-shadow:0 0 0 2px rgba(123, 191, 255, 0.2);}
.role-pill.sel-st{background:#FFF9E6;color:#854F0B;border-color:#F5A623;box-shadow:0 0 0 2px rgba(245, 166, 35, 0.2);}
.role-pill.sel-com{background:#EAF3DE;color:#3B6D11;border-color:#7DC28A;box-shadow:0 0 0 2px rgba(125, 194, 138, 0.2);}
.role-pill.sel-ts{background:#FDE9E8;color:#E74C3C;border-color:#F7C1C1;box-shadow:0 0 0 2px rgba(231, 76, 60, 0.2);}
.role-pill.sel-cp{background:#F3F4F6;color:#374151;border-color:#9CA3AF;box-shadow:0 0 0 2px rgba(107, 114, 128, 0.2);}
.id-preview{background:#F4F2EE;border-radius:8px;padding:10px 12px;margin-bottom:12px;display:none;}
.id-label{font-size:10px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;}
.id-val{font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif;color:#1C2B3A;}
.pw-gen{font-size:11px;color:#7BBFFF;cursor:pointer;text-align:right;margin-top:2px;}
.btn-login{width:100%;padding:11px;background:#1C2B3A;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;margin-top:4px;transition:opacity 0.15s;}
.btn-login:hover{opacity:0.9;}
.btn-login:disabled{opacity:0.5;cursor:not-allowed;}
.hint{font-size:11px;color:#888;text-align:center;margin-top:10px;}

/* ── Responsive: tablet ── */
@media(max-width:768px){
  .login-wrap{padding:16px;}
  .login-card{width:100%;max-width:420px;}
  .logo-bar{padding:24px 24px 18px;}
  .tab-body{padding:20px 24px 28px;}
  .tab-btn{font-size:12px;padding:11px 0;}
  .fi{padding:10px 12px;font-size:14px;} /* larger touch target */
  .btn-login,.btn-admin{padding:13px;font-size:15px;}
}
/* ── Responsive: phone ── */
@media(max-width:480px){
  .login-wrap{padding:8px;}
  .login-card{border-radius:12px;}
  .logo-bar{padding:20px 16px 14px;}
  .logo{font-size:20px;}
  .logo-sub{font-size:11px;}
  .tab-body{padding:16px 16px 20px;}
  .tab-btn{font-size:11px;padding:10px 0;}
  .row2{grid-template-columns:1fr;}
  .fi{font-size:14px;}
  .btn-login,.btn-admin{font-size:14px;padding:12px;}
  .admin-icon{width:52px;height:52px;font-size:22px;}
  .admin-title{font-size:14px;}
  .admin-desc{font-size:12px;}
}

/* ── Welcome-back (Messenger-style) ── */
.wb-wrap{text-align:center;padding:18px 0 10px;}
.wb-avatar{width:56px;height:56px;border-radius:50%;background:#1C2B3A;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px;font-weight:700;font-family:'DM Sans',sans-serif;letter-spacing:-0.02em;box-shadow:0 2px 8px rgba(28,43,58,0.18);}
.wb-name{font-size:16px;font-weight:600;color:#1C2B3A;margin-bottom:6px;}
.wb-phone{display:inline-block;background:#F4F2EE;border:0.5px solid #E0DDD6;border-radius:20px;padding:5px 14px;font-size:12px;color:#666;font-family:'DM Sans',sans-serif;letter-spacing:0.02em;margin-bottom:8px;}
.wb-switch{font-size:11px;color:#7BBFFF;cursor:pointer;transition:color 0.15s;}
.wb-switch:hover{color:#185FA5;text-decoration:underline;}

/* ── Forgot Password Link ── */
.forgot-link{font-size:12px;color:#7BBFFF;cursor:pointer;text-align:right;margin:-4px 0 10px;transition:color 0.15s;}
.forgot-link:hover{color:#185FA5;text-decoration:underline;}

/* ── Forgot Password Modal ── */
.fp-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px);}
.fp-overlay.show{display:flex;}
.fp-card{background:#fff;border-radius:16px;width:400px;max-width:100%;padding:32px;position:relative;box-shadow:0 8px 40px rgba(0,0,0,0.15);animation:fpSlide 0.25s ease;}
@keyframes fpSlide{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.fp-close{position:absolute;top:14px;right:18px;font-size:22px;color:#999;cursor:pointer;line-height:1;transition:color 0.15s;}
.fp-close:hover{color:#333;}
.fp-icon{text-align:center;font-size:40px;margin-bottom:8px;}
.fp-title{text-align:center;font-size:18px;font-weight:700;color:#1C2B3A;margin-bottom:6px;}
.fp-desc{text-align:center;font-size:12px;color:#888;line-height:1.6;margin-bottom:20px;}
.fp-btn{margin-top:4px;}
@media(max-width:480px){
  .fp-card{padding:24px 18px;border-radius:12px;}
  .fp-title{font-size:16px;}
}
</style>
