<script>
/* ── Loan Analytics Dashboard ── */
var _analyticsData = null;
var _analyticsFilter = 'all';

function loadAnalytics() {
  var container = document.getElementById('an-main');
  if (!container) return;

  // Show skeleton loading state
  container.innerHTML =
    '<div class="an-kpi-row">'
    + '<div class="an-skeleton an-skel-kpi"></div>'
    + '<div class="an-skeleton an-skel-kpi"></div>'
    + '<div class="an-skeleton an-skel-kpi"></div>'
    + '<div class="an-skeleton an-skel-kpi"></div>'
    + '</div>'
    + '<div class="an-types-row">'
    + '<div class="an-skeleton an-skel-card"></div>'
    + '<div class="an-skeleton an-skel-card"></div>'
    + '<div class="an-skeleton an-skel-card"></div>'
    + '</div>'
    + '<div class="an-bottom">'
    + '<div class="an-skeleton an-skel-panel"></div>'
    + '<div class="an-skeleton an-skel-panel"></div>'
    + '</div>';

  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        _analyticsData = r;
        renderAnalytics(r);
      } else {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9888;</div>'
          + '<div class="empty-title">Cannot load analytics</div>'
          + '<div class="empty-sub">' + (r && r.message || 'Connect your spreadsheet in Settings.') + '</div></div>';
      }
    })
    .withFailureHandler(function(e) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9888;</div>'
        + '<div class="empty-title">Error</div>'
        + '<div class="empty-sub">' + e.message + '</div></div>';
    })
    .getAnalyticsData();
}

function renderAnalytics(d) {
  var k = d.kpi;
  var t = d.types;
  var html = '';

  // ── Determine role filter ──
  var role = '';
  try { role = localStorage.getItem('campuscoop_role') || ''; } catch(e) {}
  // Which loan types to show
  var showST  = !role || role === 'admin' || role === 'chairperson' || role === 'shortterm';
  var showReg = !role || role === 'admin' || role === 'chairperson' || role === 'regular';
  var showCom = !role || role === 'admin' || role === 'chairperson' || role === 'commodity';
  // Role label
  var roleLabel = role === 'regular' ? ' \u00B7 Regular Officer View'
    : role === 'shortterm' ? ' \u00B7 Short Term Officer View'
    : role === 'commodity' ? ' \u00B7 Commodity Officer View'
    : role === 'chairperson' ? ' \u00B7 Chairperson View' : '';
  if (roleLabel) {
    var sub = document.querySelector('.topbar-sub');
    if (sub && sub.textContent.indexOf('Officer View') === -1) sub.textContent += roleLabel;
  }

  // ── KPI Cards (filtered to role) ──
  var myActive   = 0, myReleased = 0, myCollected = 0, myOverdue = 0;
  if (showST)  { myActive += t['Short Term'].active||0; myReleased += t['Short Term'].totalReleased||0; myCollected += t['Short Term'].totalCollected||0; myOverdue += t['Short Term'].overdue||0; }
  if (showReg) { myActive += t['Regular'].active||0;    myReleased += t['Regular'].totalReleased||0;    myCollected += t['Regular'].totalCollected||0;    myOverdue += t['Regular'].overdue||0; }
  if (showCom) { myActive += t['Commodity'].active||0;  myReleased += t['Commodity'].totalReleased||0;  myCollected += t['Commodity'].totalCollected||0;  myOverdue += t['Commodity'].overdue||0; }
  var myRate = myReleased > 0 ? Math.round(myCollected / myReleased * 100) : 0;

  html += '<div class="an-kpi-row">';
  html += kpiCard('kpi-active',   'Active Loans',     myActive,                '\u20B1' + fmtN(myReleased) + ' total released');
  html += kpiCard('kpi-released', 'Total Released',   '\u20B1' + fmtN(myReleased),  'This school year');
  html += kpiCard('kpi-collected','Total Collected',  '\u20B1' + fmtN(myCollected), myRate + '% collection rate');
  html += kpiCard('kpi-overdue',  'Overdue Accounts', myOverdue,               k.pendingApps + ' pending applications');
  html += '</div>';

  // ── Loan Type Cards (only those the officer manages) ──
  html += '<div class="an-types-row">';
  if (showST)  html += typeCard('Short Term', t['Short Term'], 'st');
  if (showReg) html += typeCard('Regular',    t['Regular'],    'reg');
  if (showCom) html += typeCard('Commodity',  t['Commodity'],  'com');
  html += '</div>';

  // ── Bottom Section ──
  html += '<div class="an-bottom">';

  // Left: Monthly Collections Chart
  html += '<div class="an-panel">';
  html += '<div class="an-panel-title">Monthly Collections Comparison</div>';
  html += buildChart(d.monthlySeries);
  html += '<div class="an-legend">';
  if (showST)  html += '<div class="an-legend-item"><span class="an-legend-dot l-st"></span>Short Term (6% flat)</div>';
  if (showReg) html += '<div class="an-legend-item"><span class="an-legend-dot l-reg"></span>Regular (1% diminishing)</div>';
  if (showCom) html += '<div class="an-legend-item"><span class="an-legend-dot l-com"></span>Commodity (1%/mo)</div>';
  html += '</div>';
  html += '</div>';

  // Right: Summary Table
  html += '<div class="an-panel">';
  html += '<div class="an-panel-title">Collection Summary by Type</div>';
  html += buildSummaryTable(t, k, showST, showReg, showCom);
  // Status breakdown
  var totalAct = (t['Short Term'].active || 0) + (t['Regular'].active || 0) + (t['Commodity'].active || 0);
  var totalPnd = (t['Short Term'].pending || 0) + (t['Regular'].pending || 0) + (t['Commodity'].pending || 0) + k.pendingApps;
  var totalOvd = k.totalOverdue;
  var totalPaid = (t['Short Term'].paid || 0) + (t['Regular'].paid || 0) + (t['Commodity'].paid || 0);
  html += '<div style="margin-top:14px;padding-top:12px;border-top:0.5px solid #F0EDE8;">';
  html += '<div style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-bottom:8px;">Status Breakdown</div>';
  html += '<div class="an-status-row">';
  html += '<span class="an-chip c-active"><span class="dot"></span>' + totalAct + ' Active</span>';
  html += '<span class="an-chip c-paid"><span class="dot"></span>' + totalPaid + ' Paid</span>';
  html += '<span class="an-chip c-pending"><span class="dot"></span>' + totalPnd + ' Pending</span>';
  html += '<span class="an-chip c-overdue"><span class="dot"></span>' + totalOvd + ' Overdue</span>';
  html += '</div></div>';
  html += '</div>';

  html += '</div>'; // .an-bottom

  document.getElementById('an-main').innerHTML = html;
}

function kpiCard(cls, label, val, sub) {
  return '<div class="an-kpi ' + cls + '">'
    + '<div class="an-kpi-label">' + label + '</div>'
    + '<div class="an-kpi-val">' + val + '</div>'
    + '<div class="an-kpi-sub">' + sub + '</div>'
    + '</div>';
}

function typeCard(name, d, cls) {
  var html = '<div class="an-type-card">';
  html += '<div class="an-type-header">';
  html += '<span class="an-type-badge ' + cls + '">' + name + '</span>';
  html += '<span class="an-type-count">' + d.loans + ' loan' + (d.loans !== 1 ? 's' : '') + '</span>';
  html += '</div>';
  html += '<div class="an-type-body">';
  html += '<div class="an-type-big">\u20B1' + fmtN(d.totalReleased) + '</div>';
  html += '<div class="an-type-big-label">Total Released</div>';

  // Detail grid
  html += '<div class="an-type-grid">';
  html += tgItem('Max Amount', '\u20B1' + fmtN(d.maxAmount));
  html += tgItem('Interest', d.interestRate);
  html += tgItem('Max Term', d.maxTerm + ' months');
  html += tgItem('Avg Loan', '\u20B1' + fmtN(d.avgLoanSize));
  html += tgItem('Collected', '\u20B1' + fmtN(d.totalCollected));
  html += tgItem('Outstanding', '\u20B1' + fmtN(d.outstanding));
  html += '</div>';

  // Collection rate progress
  html += '<div class="an-prog">';
  html += '<div class="an-prog-head"><span class="an-prog-label">Collection Rate</span><span class="an-prog-pct">' + d.collectionRate + '%</span></div>';
  html += '<div class="an-prog-bar"><div class="an-prog-fill ' + cls + '" style="width:' + Math.min(d.collectionRate, 100) + '%"></div></div>';
  html += '</div>';

  // Paid off progress
  var paidPct = d.loans > 0 ? Math.round((d.paid / d.loans) * 100) : 0;
  html += '<div class="an-prog">';
  html += '<div class="an-prog-head"><span class="an-prog-label">Paid Off</span><span class="an-prog-pct">' + d.paidOff + '</span></div>';
  html += '<div class="an-prog-bar"><div class="an-prog-fill ' + cls + '" style="width:' + paidPct + '%"></div></div>';
  html += '</div>';

  // Status chips
  html += '<div class="an-status-row">';
  if (d.active > 0) html += '<span class="an-chip c-active"><span class="dot"></span>' + d.active + ' Active</span>';
  if (d.paid > 0) html += '<span class="an-chip c-paid"><span class="dot"></span>' + d.paid + ' Paid</span>';
  if (d.overdue > 0) html += '<span class="an-chip c-overdue"><span class="dot"></span>' + d.overdue + ' Overdue</span>';
  if (d.pending > 0) html += '<span class="an-chip c-pending"><span class="dot"></span>' + d.pending + ' Pending</span>';
  if (d.active === 0 && d.paid === 0 && d.overdue === 0 && d.pending === 0) {
    html += '<span style="font-size:11px;color:#aaa;">No loans yet</span>';
  }
  html += '</div>';

  html += '</div></div>';
  return html;
}

function tgItem(label, val) {
  return '<div class="an-tg-item"><div class="an-tg-label">' + label + '</div><div class="an-tg-val">' + val + '</div></div>';
}

function buildChart(series) {
  // Find max value for scaling
  var maxVal = 1;
  series.forEach(function(s) {
    var total = s.st + s.reg + s.com;
    if (total > maxVal) maxVal = total;
    if (s.st > maxVal) maxVal = s.st;
    if (s.reg > maxVal) maxVal = s.reg;
    if (s.com > maxVal) maxVal = s.com;
  });

  var barH = function(v) { return Math.max(Math.round((v / maxVal) * 180), v > 0 ? 4 : 0); };

  var html = '<div class="an-chart-area">';
  series.forEach(function(s) {
    html += '<div class="an-chart-group">';
    html += '<div class="an-bar b-st" style="height:' + barH(s.st) + 'px" title="' + s.label + ' Short Term: \u20B1' + fmtN(s.st) + '"></div>';
    html += '<div class="an-bar b-reg" style="height:' + barH(s.reg) + 'px" title="' + s.label + ' Regular: \u20B1' + fmtN(s.reg) + '"></div>';
    html += '<div class="an-bar b-com" style="height:' + barH(s.com) + 'px" title="' + s.label + ' Commodity: \u20B1' + fmtN(s.com) + '"></div>';
    html += '<span class="an-chart-label">' + s.label + '</span>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function buildSummaryTable(t, k, showST, showReg, showCom) {
  var types = [];
  if (showST)  types.push('Short Term');
  if (showReg) types.push('Regular');
  if (showCom) types.push('Commodity');
  if (!types.length) types = ['Short Term', 'Regular', 'Commodity'];
  var colors = { 'Short Term': '#7BBFFF', 'Regular': '#7DC28A', 'Commodity': '#A78BFA' };
  var html = '<table class="an-sum-table">';
  html += '<thead><tr><th>Loan Type</th><th>Released</th><th>Collected</th><th>Balance</th></tr></thead>';
  html += '<tbody>';

  var totalBal = 0;
  types.forEach(function(name) {
    var d = t[name];
    var bal = d.totalReleased - d.totalCollected;
    if (bal < 0) bal = 0;
    totalBal += bal;
    html += '<tr>';
    html += '<td><span class="an-type-dot" style="background:' + colors[name] + '"></span>' + name + '</td>';
    html += '<td class="mono">\u20B1' + fmtN(d.totalReleased) + '</td>';
    html += '<td class="mono">\u20B1' + fmtN(d.totalCollected) + '</td>';
    html += '<td class="mono">\u20B1' + fmtN(bal) + '</td>';
    html += '</tr>';
  });

  // Total row
  html += '<tr>';
  html += '<td><strong>TOTAL</strong></td>';
  html += '<td class="mono">\u20B1' + fmtN(k.totalReleased) + '</td>';
  html += '<td class="mono">\u20B1' + fmtN(k.totalCollected) + '</td>';
  html += '<td class="mono">\u20B1' + fmtN(totalBal) + '</td>';
  html += '</tr>';
  html += '</tbody></table>';
  return html;
}

function fmtN(n) {
  return Math.round(n).toLocaleString();
}

function refreshAnalytics() {
  showToast('Refreshing analytics data...');
  google.script.run
    .withSuccessHandler(function() { loadAnalytics(); })
    .withFailureHandler(function() { loadAnalytics(); })
    .clearAnalyticsCache();
}
</script>
