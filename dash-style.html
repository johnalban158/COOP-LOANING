<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F4F2EE;color:#000;min-height:100vh;}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.main{display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:0.5px solid #E0DDD6;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-title{font-size:15px;font-weight:600;}
.topbar-sub{font-size:12px;color:#666;margin-top:1px;}
.topbar-right{display:flex;gap:8px;align-items:center;}
.btn-primary{background:#1C2B3A;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-primary:hover{opacity:0.9;}
.btn-settings{background:#fff;color:#444;border:0.5px solid #D0CCC6;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-settings:hover{background:#FAFAF8;}
.content{padding:24px 28px;flex:1;overflow-y:auto;}
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
.card{background:#fff;border:0.5px solid #E0DDD6;border-radius:12px;padding:16px;}
.card-label{font-size:11px;color:#666;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:6px;}
.card-val{font-size:22px;font-weight:700;font-family:'DM Sans',sans-serif;color:#000;}
.card-sub{font-size:11px;color:#777;margin-top:4px;}
.bl1{border-left:3px solid #7BBFFF;}
.bl2{border-left:3px solid #7DC28A;}
.bl3{border-left:3px solid #F5A623;}
.bl4{border-left:3px solid #E05C5C;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title{font-size:14px;font-weight:600;}
.tabs{display:flex;gap:4px;}
.tab{font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:500;border:0.5px solid #E0DDD6;background:#fff;color:#666;}
.tab.on{background:#1C2B3A;color:#fff;border-color:#1C2B3A;}
.section-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px;}
.sc{background:#fff;border:0.5px solid #E0DDD6;border-radius:12px;padding:18px;cursor:pointer;transition:border-color 0.15s;}
.sc:hover{border-color:#7BBFFF;box-shadow:0 0 0 3px rgba(123,191,255,0.1);}
.sc-icon{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;padding:6px 10px;border-radius:6px;display:inline-block;margin-bottom:10px;}
.i-blue{background:#E6F1FB;color:#185FA5;}
.i-green{background:#EAF3DE;color:#3B6D11;}
.i-amber{background:#FAEEDA;color:#854F0B;}
.i-red{background:#FCEBEB;color:#A32D2D;}
.i-gray{background:#F1EFE8;color:#5F5E5A;}
.sc-title{font-size:13px;font-weight:600;margin-bottom:4px;}
.sc-sub{font-size:11px;color:#666;line-height:1.5;}
.sc-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;margin-top:8px;}
.table-wrap{background:#fff;border:0.5px solid #E0DDD6;border-radius:12px;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:#666;letter-spacing:0.06em;text-transform:uppercase;background:#FAFAF8;border-bottom:0.5px solid #E0DDD6;}
tbody td{padding:10px 14px;border-bottom:0.5px solid #F0EDE8;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#FAFAF8;}
.name-cell{font-weight:500;}
.sub-cell{font-size:11px;color:#666;margin-top:2px;}
.mono{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;color:#000;}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;}
.p-t{background:#E6F1FB;color:#185FA5;}
.p-jo{background:#EAF3DE;color:#3B6D11;}
.p-reg{background:#EAF3DE;color:#3B6D11;}
.p-stl{background:#E6F1FB;color:#185FA5;}
.p-active{background:#EAF3DE;color:#3B6D11;}
.p-pending{background:#FAEEDA;color:#854F0B;}
.p-late{background:#FCEBEB;color:#A32D2D;}
.p-paid{background:#F1EFE8;color:#5F5E5A;}
.empty-state{text-align:center;padding:48px 24px;}
.empty-icon{font-size:32px;margin-bottom:10px;}
.empty-title{font-size:13px;font-weight:600;color:#444;margin-bottom:5px;}
.empty-sub{font-size:12px;color:#777;line-height:1.6;}

/* ── Responsive: tablet ── */
@media(max-width:900px){
  .shell{grid-template-columns:1fr;}
  .topbar{padding:14px 16px;padding-left:56px;}
  .content{padding:18px 16px;}
  .cards-row{grid-template-columns:repeat(2,1fr);}
  .section-grid{grid-template-columns:repeat(2,1fr);}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{min-width:600px;}
  .modal{width:95vw!important;max-width:520px;}
  .filter-row{flex-wrap:wrap;gap:5px;}
  .topbar-right{flex-wrap:wrap;gap:6px;}
  .two-col{flex-direction:column;}
}
/* ── Responsive: phone ── */
@media(max-width:480px){
  .cards-row{grid-template-columns:1fr;}
  .section-grid{grid-template-columns:1fr;}
  .topbar-right{flex-wrap:wrap;}
  .topbar-title{font-size:14px;}
  .topbar-sub{font-size:11px;}
  .card-val{font-size:18px;}
  .modal{width:98vw!important;max-width:none;border-radius:12px;}
  .modal-body{padding:16px 18px 22px;}
  .filter-btn{padding:6px 12px;font-size:11px;}
  .btn-primary,.btn-back,.btn-settings{font-size:12px;padding:7px 12px;}
}
/* ── Responsive: very small phone ── */
@media(max-width:360px){
  .topbar{padding:10px 12px;padding-left:50px;}
  .content{padding:12px 10px;}
  .card{padding:12px;}
  .section-title{font-size:12px;}
}
</style>
