<!DOCTYPE html>
<html>
  <head>
    <base href="<?= scriptUrl ?>">
    <meta charset="utf-8">
    <title>CampusCoop – Secure Officer Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <?!= include('setup-style') ?>
  </head>
  <body>
    <div class="setup-wrap">
      <div class="setup-card">
        <div class="header-bar">
          <div class="header-title">Secure Your Officer Account &#128274;</div>
          <div class="header-sub">You were recently assigned an officer position. Before you continue, please set your own email address and a new personal password.</div>
        </div>
        <div class="form-body">
          <div class="err" id="oc-err"></div>
          <div class="ok" id="oc-ok"></div>

          <div class="fg">
            <label class="fl">Signed in as</label>
            <input class="fi" id="oc-user" type="text" disabled style="background:#F8F7F5;color:#666;" />
          </div>

          <div class="fg">
            <label class="fl">Current Password</label>
            <div style="position:relative;">
              <input class="fi" id="oc-current" placeholder="Your temporary / member password" type="password" required style="padding-right:44px;" />
              <span class="pw-toggle-btn" onclick="togglePW('oc-current',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
            </div>
          </div>

          <div class="fg">
            <label class="fl">New Email Address (your Gmail)</label>
            <input class="fi" id="oc-email" placeholder="e.g. you@gmail.com" type="email" required />
            <span style="font-size:11px;color:#888;">You will use this email to sign in as an officer from now on.</span>
          </div>

          <div class="fg">
            <label class="fl">New Password</label>
            <div style="position:relative;">
              <input class="fi" id="oc-newpw" placeholder="Min. 8 characters" type="password" required style="padding-right:44px;" />
              <span class="pw-toggle-btn" onclick="togglePW('oc-newpw',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
            </div>
          </div>

          <div class="fg">
            <label class="fl">Confirm New Password</label>
            <div style="position:relative;">
              <input class="fi" id="oc-confirm" placeholder="Match new password" type="password" required style="padding-right:44px;" />
              <span class="pw-toggle-btn" onclick="togglePW('oc-confirm',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
            </div>
          </div>

          <button class="btn-submit" id="oc-btn" onclick="submitOfficerChange()">Save & Continue to Dashboard</button>
          <button class="btn-skip" id="oc-skip" onclick="skipOfficerChange()" style="display:block;width:100%;margin-top:10px;padding:10px 20px;background:#fff;color:#666;border:0.5px solid #D0CCC6;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Montserrat',sans-serif;">Skip for now</button>

          <div class="hint">A confirmation will be sent to your new email address after saving.</div>
        </div>
      </div>
    </div>
    <?!= include('ochange-script') ?>
  </body>
</html>
