      <div class="topbar">
        <div>
          <div class="topbar-title">Borrower Ledgers</div>
          <div class="topbar-sub">AY 2025-2026 &middot; Manage borrower records and deductions</div>
        </div>
        <div class="topbar-right">
          <button class="btn-back" onclick="navigate('dashboard')">&larr; Dashboard</button>
          <button class="btn-primary" onclick="loadOfficerData()">&#8635; Refresh</button>
          <button class="btn-danger" onclick="deleteMyOfficerAccount()" style="margin-left:8px;background:#A32D2D;">Delete My Officer Account</button>
        </div>
      </div>
      <div class="content">
        <div class="split-view">
          <!-- Left Panel: Borrower List -->
          <div class="left-panel">
            <div class="panel-header">
              <div class="panel-title">Borrowers</div>
              <div class="panel-count" id="borrower-count">0 borrowers</div>
            </div>
            <div class="search-bar">
              <input type="text" id="borrower-search" placeholder="Search by name or ID..." oninput="filterBorrowers()" />
            </div>
            <div class="borrower-list" id="borrower-list">
              <div class="empty-state">
                <div class="empty-icon">&#128100;</div>
                <div class="empty-title">Loading borrowers...</div>
                <div class="empty-sub">Fetching borrower records.</div>
              </div>
            </div>
          </div>
          
          <!-- Right Panel: Detail Panel -->
          <div class="right-panel" id="detail-panel">
            <div class="empty-state">
              <div class="empty-icon">&#128196;</div>
              <div class="empty-title">Select a borrower</div>
              <div class="empty-sub">Choose a borrower from the list to view their ledger.</div>
            </div>
          </div>
        </div>
      </div>

  <!-- Deduction Form Modal -->
  <div class="modal" id="deduction-modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Add Deduction</div>
        <button class="modal-close" onclick="closeDeductionModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Fee Name</label>
          <input type="text" id="ded-name" placeholder="e.g., Late Fee, Penalty" />
        </div>
        <div class="form-group">
          <label>Type</label>
          <div class="radio-group">
            <label><input type="radio" name="ded-type" value="percent" checked onchange="toggleDedType()" /> Percentage of Principal</label>
            <label><input type="radio" name="ded-type" value="fixed" onchange="toggleDedType()" /> Fixed Amount</label>
          </div>
        </div>
        <div class="form-group">
          <label id="ded-value-label">Percentage (%)</label>
          <input type="number" id="ded-value" placeholder="Enter value" />
        </div>
        <div class="form-group">
          <label>Applies To</label>
          <select id="ded-applies">
            <option value="release">Release Amount (Net)</option>
            <option value="balance">Loan Balance</option>
          </select>
        </div>
        <div class="ded-preview">
          <span>Computed Amount: </span>
          <strong id="ded-computed">₱0</strong>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeDeductionModal()">Cancel</button>
        <button class="btn-primary" onclick="addDeduction()">Add Deduction</button>
      </div>
    </div>
  </div>
