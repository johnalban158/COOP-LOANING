<script>
/* ── Pending-officer guard: newly assigned officers must secure
      their account (set own email + password) before entering ── */
(function() {
  try {
    if (sessionStorage.getItem('campuscoop_pending_officer')) {
      var base = document.querySelector('base');
      window.top.location.href = (base ? base.href : '') + '?page=officer-setup';
    }
  } catch(e) {}
})();

/* ── Dashboard data loading ── */
function loadDashboard() {
  // Fetch coop stats (CBU) for admin
  google.script.run.withSuccessHandler(function(r) {
    if(r && r.success) {
      var role = localStorage.getItem("campuscoop_role") || "admin";
      if(role === "admin") {
        var el = document.getElementById("dash-cbu-card");
        if(el) el.style.display = "block";
        var val = document.getElementById("dash-cbu-val");
        if(val) val.textContent = "\u20B1" + Math.round(r.totalCbu).toLocaleString();
      }
    }
  }).getCoopStats();
  initDashboardRole();
  var allLoans = [];
  var typesLoaded = 0;

  // Fetch all loan types (STL, REG, COM) and combine
  ['STL', 'REG', 'COM'].forEach(function(prefix) {
    google.script.run
      .withSuccessHandler(function(r) {
        typesLoaded++;
        if (r && r.success) allLoans = allLoans.concat(r.loans || []);
        if (typesLoaded === 3) renderDashboard(allLoans);
      })
      .withFailureHandler(function() {
        typesLoaded++;
        if (typesLoaded === 3) renderDashboard(allLoans);
      })
      .getLoansByType(prefix);
  });

  // Fetch applications for pending count
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) return;
      var apps = r.apps || [];
      var pending = apps.filter(function(a) { return a.status === 'Pending'; });
      var cards = document.querySelectorAll('#page-dashboard .cards-row .card:not(#dash-cbu-card) .card-val');
      if (cards[2]) cards[2].textContent = pending.length;
    })
    .withFailureHandler(function() {})
    .getApplications();

  // Fetch overdue count
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) return;
      var cards = document.querySelectorAll('#page-dashboard .cards-row .card:not(#dash-cbu-card) .card-val');
      if (cards[3]) cards[3].textContent = r.totalOverdue || 0;
    })
    .withFailureHandler(function() {})
    .getOverdueLoans();
}

function initDashboardRole() {
  var role = localStorage.getItem('campuscoop_role') || 'admin';
  var sub = document.querySelector('#page-dashboard .topbar-sub');
  
  var roleNames = {
    'admin': 'Master Admin',
    'regular': 'Regular Officer',
    'shortterm': 'Short Term Officer',
    'commodity': 'Commodity Officer',
    'chairperson': 'Chairperson'
  };
  
  if (sub) {
    var year = document.querySelector('.sidebar-year') ? document.querySelector('.sidebar-year').textContent.trim() : 'AY 2025-2026';
    sub.innerHTML = year + ' &middot; Welcome back, ' + (roleNames[role] || 'Officer') + '!';
  }
  
  if (role === 'admin') return;

  // Find all cards (.sc) and hide based on role
  var cards = document.querySelectorAll('#page-dashboard .sc');
  cards.forEach(function(card) {
    var title = card.querySelector('.sc-title') ? card.querySelector('.sc-title').textContent.toLowerCase() : '';
    
    var shouldHide = false;
    if (role === 'regular') {
      if (title.includes('short term') || title.includes('commodity')) shouldHide = true;
    } else if (role === 'shortterm' || role === 'commodity') {
      if (title.includes('regular')) shouldHide = true;
    } else if (role === 'chairperson') {
      // Chairperson can see dashboard cards, but not action-oriented ones
      if (title.includes('settings') || title.includes('reminders')) shouldHide = true;
    }
    
    // Always hide settings and reminders for any officer
    if (title.includes('settings') || title.includes('reminders')) shouldHide = true;
    
    if (shouldHide) card.style.display = 'none';
  });
  
  // For chairperson: make all read-only by disabling edit buttons
  if (role === 'chairperson') {
    // Add a "read-only" indicator
    var topbar = document.querySelector('.topbar');
    if (topbar) {
      var badge = document.createElement('div');
      badge.style.cssText = 'display:inline-block;background:#F3F4F6;color:#374151;border:1px solid #9CA3AF;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:600;margin-left:12px;';
      badge.textContent = '\uD83D\uDC41 View-Only Mode';
      topbar.querySelector('.topbar-title')?.after(badge);
    }
  }
}

function renderDashboard(loans) {
  var active = loans.filter(function(l) { return l.status === 'Active'; });
  var totalReleased = loans.reduce(function(s, l) { return s + (l.amount || 0); }, 0);

  // Update stat cards (exclude hidden #dash-cbu-card to avoid off-by-one)
  var cards = document.querySelectorAll('#page-dashboard .cards-row .card:not(#dash-cbu-card) .card-val');
  if (cards[0]) cards[0].textContent = active.length;
  if (cards[1]) cards[1].textContent = '\u20B1' + Math.round(totalReleased).toLocaleString();

  // Build loan accounts table
  var tbody = document.querySelector('#page-dashboard tbody');
  if (!tbody || loans.length === 0) return;

  var html = '';
  loans.forEach(function(l) {
    var loanType = l.loanId && l.loanId.indexOf('REG') === 0 ? 'Regular'
      : l.loanId && l.loanId.indexOf('COM') === 0 ? 'Commodity' : 'Short Term';
    var memberType = l.memberId && l.memberId.indexOf('TCH') === 0 ? 'Teacher' : 'JO';
    var statusClass = l.status === 'Active' ? 'p-active'
      : l.status === 'Paid' ? 'p-paid' : 'p-late';
    var pct = l.totalPayable > 0
      ? Math.round(((l.totalPayable - l.balance) / l.totalPayable) * 100) : 0;
    html += '<tr>'
      + '<td><div style="font-weight:600;font-size:13px;">' + (l.memberName || '\u2014') + '</div>'
      + '<div style="font-size:11px;color:#888;">' + (l.memberId || '') + '</div></td>'
      + '<td><span class="pill ' + (memberType === 'Teacher' ? 'p-t' : 'p-jo') + '">' + memberType + '</span></td>'
      + '<td><span class="pill">' + loanType + '</span></td>'
      + '<td>\u20B1' + Math.round(l.amount || 0).toLocaleString() + '</td>'
      + '<td>\u20B1' + Math.round(l.balance || 0).toLocaleString() + '</td>'
      + '<td>\u20B1' + Math.round(l.monthly || 0).toLocaleString() + '</td>'
      + '<td><div class="progress-wrap"><div class="progress-bar' + (pct >= 100 ? ' done' : '') + '" style="width:' + pct + '%;"></div></div></td>'
      + '<td><span class="pill ' + statusClass + '">' + (l.status || 'Active') + '</span></td>'
      + '</tr>';
  });
  tbody.innerHTML = html;
}

/* ACCOUNTS PAGE logic shared via MEMBERS-script.html */

function doEnrollAccountsPage() {
  var errEl = document.getElementById('acc-err');
  var okEl  = document.getElementById('acc-ok');
  var btn   = document.getElementById('acc-enroll-btn');
  if (errEl) { errEl.style.display = 'none'; errEl.textContent = ''; }
  if (okEl)  { okEl.style.display  = 'none'; okEl.innerHTML   = ''; }

  var first = (document.getElementById('acc-first').value || '').trim();
  var last  = (document.getElementById('acc-last').value  || '').trim();
  var email = (document.getElementById('acc-email').value || '').trim();
  var phone = (document.getElementById('acc-phone').value || '').trim();
  var dept  = (document.getElementById('acc-dept').value  || '').trim();
  var type  = document.getElementById('acc-type').value;
  var cap   = Number(document.getElementById('acc-capital').value) || 0;

  if (!first || !last) {
    if (errEl) { errEl.textContent = 'Please fill in all required fields: First Name and Last Name.'; errEl.style.display = 'block'; }
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Enrolling... wait'; }

  console.log('Dash-Accounts-Enroll: Sending...', { firstName: first, lastName: last, phone: phone });
  try {
    google.script.run
      .withSuccessHandler(function(r) {
        console.log('Dash-Accounts-Enroll: Success:', r);
        if (btn) { btn.disabled = false; btn.textContent = '\u2713 Enroll Member'; }
        if (r && r.success) {
          if (okEl) {
            var statusHtml = '<br><span style="font-size:11px;color:#666;">'
              + '📱 SMS: ' + (r.smsStatus === 'Sent' ? '✅' : '❌ ' + r.smsStatus)
              + ' &middot; 📧 Email: ' + (r.emailStatus === 'Sent' ? '✅' : '❌ ' + r.emailStatus)
              + '</span>';
            okEl.innerHTML = '\u2713 Member enrolled!<br>'
              + 'Mobile: <strong>' + phone + '</strong> &middot; Temp password: <strong style="font-family:monospace;color:#0F4C75;">' + r.tempPassword + '</strong>' + statusHtml;
            okEl.style.display = 'block';
          }
          ['acc-first','acc-last','acc-email','acc-phone','acc-dept','acc-capital']
            .forEach(function(id) { var el = document.getElementById(id); if (el) el.value = ''; });
          setTimeout(function() { if (typeof loadAccountsPage === 'function') loadAccountsPage(); }, 1500);
        } else {
          if (errEl) { errEl.textContent = (r && r.message) || 'Failed to enroll. Please try again.'; errEl.style.display = 'block'; }
        }
      })
      .withFailureHandler(function(e) {
        console.error('Dash-Accounts-Enroll: Failure:', e);
        if (btn) { btn.disabled = false; btn.textContent = '\u2713 Enroll Member'; }
        if (errEl) { errEl.textContent = 'Connection error: ' + e.message; errEl.style.display = 'block'; }
        alert('Server Error (Dash Accounts): ' + e.message);
      })
      .createMember({ firstName: first, lastName: last, email: email, phone: phone, department: dept, memberType: type, capital: cap });
  } catch (err_js) {
    console.error('Dash-Accounts-Enroll: JS error:', err_js);
    alert('JS Error (Dash Accounts): ' + err_js.message);
    if (btn) btn.disabled = false;
  }
}

function loadAccountsPage() {
  var tbody = document.getElementById('acc-tbody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#8635;</div><div class="empty-title">Loading members...</div></div></td></tr>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        REG_ACC_ALL = r.data || r.members || [];
        renderDashAccountsList();
      } else {
        var msg = (r && r.message) || 'Connect spreadsheet in Settings.';
        if (tbody) tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Cannot load members</div><div class="empty-sub">' + msg + '</div><div style="margin-top:10px;"><button class="btn-primary" onclick="navigate(\'settings\')">&#128452; Open Settings</button><button class="btn-secondary" onclick="forceRefreshAccounts()" style="margin-left:8px;">&#8635; Force Refresh</button></div></div></td></tr>';
      }
    })
    .withFailureHandler(function(e) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Error loading members</div><div class="empty-sub">' + e.message + '</div><div style="margin-top:10px;"><button class="btn-secondary" onclick="forceRefreshAccounts()">&#8635; Force Refresh</button></div></div></td></tr>';
    })
    .getMembers();
}

function forceRefreshAccounts() {
  var tbody = document.getElementById('acc-tbody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#8635;</div><div class="empty-title">Clearing cache and reloading...</div></div></td></tr>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        showToast('\u2713 ' + r.message);
        loadAccountsPage();
      } else {
        showToast('\u274C ' + (r && r.message || 'Failed to clear cache'));
        loadAccountsPage();
      }
    })
    .withFailureHandler(function(e) {
      showToast('\u274C ' + e.message);
      loadAccountsPage();
    })
    .clearMembersCache();
}

function renderDashAccountsList(list) {
  var data = list || REG_ACC_ALL;
  var tbody = document.getElementById('acc-tbody');
  if (!tbody) return;
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">&#128100;</div><div class="empty-title">No members enrolled yet</div><div class="empty-sub">Use the form above to enroll your first member.</div></div></td></tr>';
    return;
  }
  var fmtC = function(n) { return '\u20B1' + (Number(n) || 0).toLocaleString(); };
  var html = '';
  data.forEach(function(m) {
    var statusPill = (String(m.status || 'Active')).toLowerCase() === 'active'
      ? '<span class="pill p-approved">Active</span>'
      : '<span class="pill p-pending">' + (m.status || 'Pending') + '</span>';
    html += '<tr>';
    html += '<td><div class="name-cell">' + (m.firstName || '') + ' ' + (m.lastName || '') + '</div><div class="sub-cell">' + (m.username || m.memberId || '') + '</div></td>';
    html += '<td><span class="pill ' + ((String(m.memberType || '')).toLowerCase() === 'teacher' ? 'p-t' : 'p-jo') + '">' + (m.memberType || '-') + '</span></td>';
    html += '<td>' + (m.department || '&mdash;') + '</td>';
    html += '<td>' + (m.phone || '&mdash;') + '</td>';
    html += '<td>' + (m.email || '&mdash;') + '</td>';
    html += '<td class="mono">' + fmtC(m.capital) + '</td>';
    html += '<td>' + (m.dateJoined || '&mdash;') + '</td>';
    html += '<td>' + statusPill + '</td>';
    html += '<td><button class="action-btn" onclick=\'viewMember(' + JSON.stringify(m).replace(/'/g, '&apos;') + ')\'>View</button></td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function filterAccountsList() {
  var q = ((document.getElementById('acc-search') || { value: '' }).value || '').toLowerCase();
  if (!q) { renderDashAccountsList(); return; }
  var filtered = REG_ACC_ALL.filter(function(m) {
    return (String(m.firstName || '') + ' ' + String(m.lastName || '')).toLowerCase().indexOf(q) !== -1
      || String(m.phone || '').indexOf(q) !== -1
      || String(m.username || '').indexOf(q) !== -1;
  });
  renderDashAccountsList(filtered);
}

</script>
