<script>
var _overdueData = [];
var _ovFilter = 'all';

function loadOverdue() {
  var tbody = document.getElementById('ov-tbody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">&#8635;</div><div class="empty-title">Loading overdue accounts...</div></div></td></tr>';

  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) { 
        showToast('Error: ' + (r && r.message || 'Loading overdue data failed')); 
        return; 
      }
      _overdueData = r.overdue || [];
      renderOvStats(r);
      renderOvTable('all');
    })
    .withFailureHandler(function(e) { showToast('Failed: ' + e.message); })
    .getOverdueLoans();
}

function renderOvStats(r) {
  var el1 = document.getElementById('ov-count');
  var el2 = document.getElementById('ov-total-amt');
  var el3 = document.getElementById('ov-avg-days');
  var el4 = document.getElementById('ov-resolved');
  if (el1) el1.textContent = r.totalOverdue || 0;
  if (el2) el2.textContent = '\u20B1' + Math.round(r.totalOverdueAmt || 0).toLocaleString();
  if (el3) el3.textContent = (r.avgDaysOverdue || 0) + ' days';
  if (el4) el4.textContent = '\u2014'; // resolved count not tracked yet

  // Update alert text
  var at = document.getElementById('ov-alert-text');
  if (at) {
    if (r.totalOverdue > 0) {
      at.textContent = r.totalOverdue + ' account(s) have missed their maturity date. Contact members and arrange payment as soon as possible.';
    } else {
      at.textContent = 'Great news! All loans are within their payment schedule.';
    }
  }
}

function renderOvTable(filter) {
  _ovFilter = filter;
  var list = _overdueData;
  if (filter === '30plus') {
    list = _overdueData.filter(function(o) { return o.daysOverdue >= 30; });
  } else if (filter === 'under30') {
    list = _overdueData.filter(function(o) { return o.daysOverdue < 30; });
  }

  var tbody = document.getElementById('ov-tbody');
  if (!tbody) return;

  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">&#127881;</div><div class="empty-title">No overdue accounts</div><div class="empty-sub">Great news! No overdue accounts found.</div></div></td></tr>';
    return;
  }

  var html = '';
  list.forEach(function(o) {
    var typeClass = o.loanType === 'Short Term' ? 'p-stl'
      : o.loanType === 'Regular' ? 'p-reg' : 'p-t';
    var daysClass = o.daysOverdue >= 30 ? 'color:#A32D2D;font-weight:700;' : 'color:#854F0B;font-weight:600;';

    html += '<tr>';
    html += '<td><div style="font-weight:600;font-size:13px;">' + (o.memberName || o.memberId) + '</div><div style="font-size:11px;color:#888;">' + o.memberId + ' &middot; ' + o.loanId + '</div></td>';
    html += '<td><span class="' + typeClass + '" style="padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;">' + o.loanType + '</span></td>';
    html += '<td style="font-family:monospace;font-weight:600;">&#8369;' + Math.round(o.balance).toLocaleString() + '</td>';
    html += '<td style="' + daysClass + '">' + o.daysOverdue + ' days</td>';
    html += '<td style="font-size:12px;">' + (o.lastPayment || '\u2014') + '</td>';
    html += '<td style="font-size:12px;">' + (o.maturityDate || '\u2014') + '</td>';
    html += '<td style="font-family:monospace;">&#8369;' + Math.round(o.balance).toLocaleString() + '</td>';
    html += '<td><button class="action-btn" onclick="showToast(\'Send reminder to ' + (o.memberName || o.memberId).replace(/'/g, '') + '\')">&#128231; Remind</button></td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function setFilterOV(el, filter) {
  document.querySelectorAll('#page-overdue .filter-btn').forEach(function(b) {
    b.classList.remove('on');
  });
  el.classList.add('on');
  renderOvTable(filter);
}
</script>
