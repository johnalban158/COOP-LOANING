<script>
var BORROWERS = [];
var SELECTED_BORROWER = null;
var DEDUCTIONS = [];

function loadOfficerData() {
  var borrowerList = document.getElementById('borrower-list');
  if (!borrowerList) return;
  
  borrowerList.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128100;</div><div class="empty-title">Loading borrowers...</div><div class="empty-sub">Fetching borrower records.</div></div>';
  
  google.script.run
    .withSuccessHandler(function(data) {
      BORROWERS = data || [];
      renderBorrowerList();
      document.getElementById('borrower-count').textContent = BORROWERS.length + ' borrowers';
    })
    .withFailureHandler(function(e) {
      borrowerList.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Error loading data</div><div class="empty-sub">' + e.message + '</div></div>';
    })
    .getOfficerBorrowerData();
}

function renderBorrowerList() {
  var borrowerList = document.getElementById('borrower-list');
  if (!borrowerList) return;
  
  if (BORROWERS.length === 0) {
    borrowerList.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128100;</div><div class="empty-title">No borrowers found</div><div class="empty-sub">No borrower records available.</div></div>';
    return;
  }
  
  var html = '';
  BORROWERS.forEach(function(b, i) {
    var balanceClass = b.balance > 0 ? 'overdue' : '';
    html += '<div class="borrower-item" onclick="selectBorrower(' + i + ')" data-index="' + i + '">';
    html += '<div class="borrower-name">' + b.lastName + ', ' + b.firstName + '</div>';
    html += '<div class="borrower-id">' + b.memberId + '</div>';
    html += '<div class="borrower-balance ' + balanceClass + '">Balance: ₱' + b.balance.toLocaleString() + '</div>';
    html += '</div>';
  });
  
  borrowerList.innerHTML = html;
}

function filterBorrowers() {
  var search = document.getElementById('borrower-search').value.toLowerCase();
  var items = document.querySelectorAll('.borrower-item');
  
  items.forEach(function(item) {
    var index = parseInt(item.dataset.index);
    var b = BORROWERS[index];
    if (!b) return;
    
    var match = b.lastName.toLowerCase().indexOf(search) !== -1 ||
                b.firstName.toLowerCase().indexOf(search) !== -1 ||
                b.memberId.toLowerCase().indexOf(search) !== -1;
    
    item.style.display = match ? 'block' : 'none';
  });
}

function selectBorrower(index) {
  SELECTED_BORROWER = BORROWERS[index];
  
  // Update active state
  document.querySelectorAll('.borrower-item').forEach(function(item) {
    item.classList.remove('active');
  });
  document.querySelector('.borrower-item[data-index="' + index + '"]').classList.add('active');
  
  renderDetailPanel();
}

function renderDetailPanel() {
  var detailPanel = document.getElementById('detail-panel');
  if (!detailPanel || !SELECTED_BORROWER) return;
  
  var b = SELECTED_BORROWER;
  
  var html = '';
  html += '<div class="detail-header">';
  html += '<div class="detail-name">' + b.lastName + ', ' + b.firstName + '</div>';
  html += '<div class="detail-id">' + b.memberId + '</div>';
  html += '<div class="detail-school">' + (b.school || 'N/A') + '</div>';
  html += '</div>';
  
  // Stats Cards
  html += '<div class="stats-grid">';
  html += '<div class="stat-card"><div class="stat-label">Principal</div><div class="stat-value">₱' + b.principal.toLocaleString() + '</div></div>';
  html += '<div class="stat-card"><div class="stat-label">Total Paid</div><div class="stat-value positive">₱' + b.paid.toLocaleString() + '</div></div>';
  html += '<div class="stat-card"><div class="stat-label">Balance</div><div class="stat-value ' + (b.balance > 0 ? 'negative' : 'positive') + '">₱' + b.balance.toLocaleString() + '</div></div>';
  html += '<div class="stat-card"><div class="stat-label">Status</div><div class="stat-value">' + (b.balance > 0 ? 'Overdue' : 'Current') + '</div></div>';
  html += '</div>';
  
  // Payment History
  html += '<div class="detail-section">';
  html += '<div class="section-title">Payment History</div>';
  if (b.payments && b.payments.length > 0) {
    html += '<table class="payment-table">';
    html += '<thead><tr><th>Date</th><th>Amount</th></tr></thead>';
    html += '<tbody>';
    b.payments.forEach(function(p) {
      html += '<tr><td>' + p.date + '</td><td class="amount">₱' + p.amount.toLocaleString() + '</td></tr>';
    });
    html += '</tbody></table>';
  } else {
    html += '<div class="empty-state"><div class="empty-icon">&#128196;</div><div class="empty-title">No payments yet</div></div>';
  }
  html += '</div>';
  
  // Deductions
  html += '<div class="detail-section">';
  html += '<div class="section-title">';
  html += '<span>Deductions</span>';
  html += '<button onclick="openDeductionModal()">+ Add Deduction</button>';
  html += '</div>';
  html += '<div class="deductions-list" id="deductions-list">';
  if (b.deductions && b.deductions.length > 0) {
    b.deductions.forEach(function(d, i) {
      html += '<div class="deduction-item">';
      html += '<div class="deduction-info">';
      html += '<div class="deduction-name">' + d.name + '</div>';
      html += '<div class="deduction-details">' + d.type + ' - ' + d.appliesTo + '</div>';
      html += '</div>';
      html += '<div class="deduction-amount">₱' + d.amount.toLocaleString() + '</div>';
      html += '<button class="deduction-remove" onclick="removeDeduction(' + i + ')">&times;</button>';
      html += '</div>';
    });
  } else {
    html += '<div class="empty-state"><div class="empty-icon">&#128176;</div><div class="empty-title">No deductions</div></div>';
  }
  html += '</div>';
  html += '<div class="deductions-total">Total Deductions: ₱' + (b.totalDeductions || 0).toLocaleString() + '</div>';
  html += '</div>';
  
  // Remarks
  html += '<div class="detail-section">';
  html += '<div class="section-title">Remarks / Notes</div>';
  html += '<textarea class="remarks-field" id="remarks-field" placeholder="Add notes about this borrower...">' + (b.remarks || '') + '</textarea>';
  html += '<button class="btn-primary" style="margin-top:8px;" onclick="saveRemarks()">Save Remarks</button>';
  html += '</div>';
  
  detailPanel.innerHTML = html;
  
  // Load deductions for this borrower
  loadDeductions(b.memberId);
}

function loadDeductions(memberId) {
  google.script.run
    .withSuccessHandler(function(data) {
      DEDUCTIONS = data || [];
      renderDeductionsList();
    })
    .withFailureHandler(function(e) {
      console.error('Error loading deductions:', e);
    })
    .getDeductionsForMember(memberId);
}

function renderDeductionsList() {
  var list = document.getElementById('deductions-list');
  if (!list) return;
  
  if (DEDUCTIONS.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128176;</div><div class="empty-title">No deductions</div></div>';
    return;
  }
  
  var html = '';
  var total = 0;
  DEDUCTIONS.forEach(function(d, i) {
    total += d.amount;
    html += '<div class="deduction-item">';
    html += '<div class="deduction-info">';
    html += '<div class="deduction-name">' + d.name + '</div>';
    html += '<div class="deduction-details">' + d.type + ' - ' + d.appliesTo + '</div>';
    html += '</div>';
    html += '<div class="deduction-amount">₱' + d.amount.toLocaleString() + '</div>';
    html += '<button class="deduction-remove" onclick="removeDeduction(' + i + ')">&times;</button>';
    html += '</div>';
  });
  
  list.innerHTML = html;
  
  // Update total
  var totalEl = list.nextElementSibling;
  if (totalEl) {
    totalEl.textContent = 'Total Deductions: ₱' + total.toLocaleString();
  }
}

function openDeductionModal() {
  if (!SELECTED_BORROWER) return;
  document.getElementById('deduction-modal').style.display = 'flex';
  document.getElementById('ded-name').value = '';
  document.getElementById('ded-value').value = '';
  document.getElementById('ded-computed').textContent = '₱0';
  document.querySelector('input[name="ded-type"][value="percent"]').checked = true;
  toggleDedType();
}

function closeDeductionModal() {
  document.getElementById('deduction-modal').style.display = 'none';
}

function toggleDedType() {
  var type = document.querySelector('input[name="ded-type"]:checked').value;
  var label = document.getElementById('ded-value-label');
  label.textContent = type === 'percent' ? 'Percentage (%)' : 'Fixed Amount (₱)';
  updateComputedDeduction();
}

function updateComputedDeduction() {
  var type = document.querySelector('input[name="ded-type"]:checked').value;
  var value = parseFloat(document.getElementById('ded-value').value) || 0;
  var principal = SELECTED_BORROWER ? SELECTED_BORROWER.principal : 0;
  var computed = type === 'percent' ? (principal * value / 100) : value;
  document.getElementById('ded-computed').textContent = '₱' + computed.toLocaleString();
}

// Add event listener for value input
document.addEventListener('DOMContentLoaded', function() {
  var dedValue = document.getElementById('ded-value');
  if (dedValue) {
    dedValue.addEventListener('input', updateComputedDeduction);
  }
});

function addDeduction() {
  if (!SELECTED_BORROWER) return;
  
  var name = document.getElementById('ded-name').value.trim();
  var type = document.querySelector('input[name="ded-type"]:checked').value;
  var value = parseFloat(document.getElementById('ded-value').value) || 0;
  var appliesTo = document.getElementById('ded-applies').value;
  
  if (!name) {
    showToast('Please enter a fee name');
    return;
  }
  
  if (value <= 0) {
    showToast('Please enter a valid value');
    return;
  }
  
  var principal = SELECTED_BORROWER.principal;
  var computed = type === 'percent' ? (principal * value / 100) : value;
  
  var deduction = {
    memberId: SELECTED_BORROWER.memberId,
    name: name,
    type: type,
    value: value,
    appliesTo: appliesTo,
    amount: computed
  };
  
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        showToast('✓ Deduction added');
       closeDeductionModal();
        loadDeductions(SELECTED_BORROWER.memberId);
      } else {
        showToast('Error: ' + (r && r.message || 'Failed'));
      }
    })
    .withFailureHandler(function(e) {
      showToast('Error: ' + e.message);
    })
    .addDeduction(deduction);
}

function removeDeduction(index) {
  if (!DEDUCTIONS[index]) return;
  
  if (!confirm('Remove this deduction?')) return;
  
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        showToast('✓ Deduction removed');
        loadDeductions(SELECTED_BORROWER.memberId);
      } else {
        showToast('Error: ' + (r && r.message || 'Failed'));
      }
    })
    .withFailureHandler(function(e) {
      showToast('Error: ' + e.message);
    })
    .removeDeduction(DEDUCTIONS[index].id);
}

function saveRemarks() {
  if (!SELECTED_BORROWER) return;
  
  var remarks = document.getElementById('remarks-field').value;
  
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        showToast('✓ Remarks saved');
      } else {
        showToast('Error: ' + (r && r.message || 'Failed'));
      }
    })
    .withFailureHandler(function(e) {
      showToast('Error: ' + e.message);
    })
    .saveBorrowerRemarks(SELECTED_BORROWER.memberId, remarks);
}

function showToast(message) {
  // Simple toast implementation
  var toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#1C2B3A;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:1000;';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(function() {
    toast.remove();
  }, 3000);
}

function deleteMyOfficerAccount() {
  var role = '';
  try { role = localStorage.getItem('campuscoop_role') || ''; } catch(e) {}
  if (!role) {
    showToast('Unable to determine your officer role');
    return;
  }
  if (!confirm('Delete your officer account?\n\nYou will no longer be able to log in as an officer. This action cannot be undone.')) return;
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        showToast('\u2713 Officer account deleted. Redirecting to login...');
        setTimeout(function() {
          var base = document.querySelector('base');
          window.top.location.href = (base ? base.href : '') + '?page=login';
        }, 1500);
      } else {
        showToast('Error: ' + (r && r.message || 'Failed to delete'));
      }
    })
    .withFailureHandler(function(e) {
      showToast('Error: ' + e.message);
    })
    .deleteMyOfficerAccount(role);
}
</script>
