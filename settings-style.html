<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F4F2EE;color:#000;min-height:100vh;}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.main{display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:0.5px solid #E0DDD6;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-title{font-size:15px;font-weight:600;}
.topbar-sub{font-size:12px;color:#666;margin-top:1px;}
.topbar-right{display:flex;gap:8px;align-items:center;}
.btn-back{background:#fff;color:#444;border:0.5px solid #D0CCC6;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-back:hover{background:#FAFAF8;}
.content{padding:24px 28px;flex:1;overflow-y:auto;}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.s-card{background:#fff;border:0.5px solid #E0DDD6;border-radius:12px;padding:22px;}
.s-title{font-size:14px;font-weight:600;margin-bottom:6px;}
.s-desc{font-size:12px;color:#666;line-height:1.6;margin-bottom:18px;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.fl{font-size:12px;font-weight:500;color:#444;}
.fi{padding:9px 12px;border:0.5px solid #D0CCC6;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:700;outline:none;width:100%;transition:border-color 0.15s;}
.fi:focus{border-color:#7BBFFF;}
.fi-text{font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;}
.fhint{font-size:11px;color:#777;margin-top:3px;line-height:1.5;}
.db-status{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:14px;}
.ds-off{background:#FAEEDA;color:#854F0B;border:0.5px solid #FAC775;}
.ds-on{background:#EAF3DE;color:#3B6D11;border:0.5px solid #C0DD97;}
.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
.btn-prim{width:100%;padding:10px;background:#1C2B3A;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:4px;}
.btn-prim:hover{opacity:0.9;}
.btn-sec{width:100%;padding:10px;background:#fff;color:#444;border:0.5px solid #D0CCC6;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:8px;}
.btn-sec:hover{background:#FAFAF8;}
.sheet-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.sheet-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#FAFAF8;border-radius:8px;border:0.5px solid #E0DDD6;font-size:13px;}
.sheet-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;}
.sb-wait{background:#FAEEDA;color:#854F0B;}
.sb-ok{background:#EAF3DE;color:#3B6D11;}
.sb-miss{background:#FCEBEB;color:#A32D2D;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:0.5px solid #F0EDE8;font-size:13px;}
.info-row:last-child{border-bottom:none;}
.info-label{color:#666;font-size:12px;}
.info-val{font-weight:500;}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.btn-danger{padding:10px;background:#FCEBEB;color:#A32D2D;border:0.5px solid #F7C1C1;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.15s;}
.btn-danger:hover{background:#FAD4D4;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1C2B3A;color:#fff;padding:10px 22px;border-radius:8px;font-size:13px;display:none;z-index:999;white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif;}

/* ── Guide Accordion ── */
.guide-accordion{display:flex;flex-direction:column;gap:6px;}
.guide-item{border:0.5px solid #E0DDD6;border-radius:8px;overflow:hidden;}
.guide-q{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#1C2B3A;background:#FAFAF8;transition:background 0.15s;}
.guide-q:hover{background:#F0EDE8;}
.guide-arrow{font-size:10px;color:#aaa;transition:transform 0.25s;}
.guide-item.open .guide-arrow{transform:rotate(90deg);color:#7BBFFF;}
.guide-a{display:none;padding:14px 16px;font-size:12px;color:#444;line-height:1.7;border-top:0.5px solid #E0DDD6;background:#fff;}
.guide-item.open .guide-a{display:block;}
.guide-a ul{margin:6px 0 6px 18px;padding:0;}
.guide-a li{margin-bottom:4px;}
.guide-a p{margin-bottom:6px;}

/* ── Chatbot Suggestion Box ── */
.chatbox{background:#F4F2EE;border:0.5px solid #E0DDD6;border-radius:12px;padding:16px;margin-bottom:14px;max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.chat-msg{display:flex;gap:8px;align-items:flex-start;}
.chat-msg.chat-bot{flex-direction:row;}
.chat-msg.chat-user{flex-direction:row-reverse;}
.chat-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.chat-bot .chat-avatar{background:#E6F1FB;}
.chat-user .chat-avatar{background:#EAF3DE;}
.chat-bubble{padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.6;max-width:85%;}
.cb-bot{background:#fff;border:0.5px solid #E0DDD6;color:#333;border-top-left-radius:4px;}
.cb-user{background:#1C2B3A;color:#fff;border-top-right-radius:4px;}
.cb-success{background:#EAF3DE;color:#3B6D11;border:0.5px solid #C0DD97;border-top-left-radius:4px;}
.chat-input-row{display:flex;gap:8px;}
.chat-fi{flex:1;}
.chat-send-btn{padding:10px 20px;background:#1C2B3A;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap;transition:opacity 0.15s;}
.chat-send-btn:hover{opacity:0.9;}
.chat-send-btn:disabled{opacity:0.5;cursor:not-allowed;}

/* ── Responsive ── */
@media(max-width:900px){
  .shell{grid-template-columns:1fr;}
  .topbar{padding:14px 16px;padding-left:56px;}
  .content{padding:18px 16px;}
  .settings-grid{grid-template-columns:1fr;}
}

/* ── Officer Permissions Checkboxes ── */
.perm-list{display:flex;flex-direction:column;gap:4px;margin-top:4px;}
.perm-item{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#444;padding:5px 8px;border-radius:6px;cursor:pointer;transition:background 0.12s;user-select:none;}
.perm-item:hover{background:#F4F2EE;}
.perm-item input[type=checkbox]{width:14px;height:14px;accent-color:#1C2B3A;cursor:pointer;flex-shrink:0;}

/* ── Alert Messages ── */
.err{background:#FCEBEB;border:1px solid #F7C1C1;color:#A32D2D;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;}
.ok{background:#EAF3DE;border:1px solid #C0DD97;color:#3B6D11;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;}
</style>
