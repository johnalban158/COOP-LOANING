<script>
/* ── Show/Hide Password Toggle ── */
var _eyeOpen = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var _eyeClosed = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

function togglePW(inputId, icon) {
  var el = document.getElementById(inputId);
  if (!el) return;
  if (el.type === 'password') {
    el.type = 'text';
    icon.innerHTML = _eyeClosed;
  } else {
    el.type = 'password';
    icon.innerHTML = _eyeOpen;
  }
}

/* ── Messenger-style "Welcome back" — pre-fill phone, show avatar ── */
(function() {
  try {
    var saved = localStorage.getItem('campuscoop_remember');
    if (saved) {
      var info = JSON.parse(saved);
      window.addEventListener('DOMContentLoaded', function() {
        showWelcomeBack(info);
      });
    }
  } catch(e) {}
})();

function showWelcomeBack(info) {
  var wb    = document.getElementById('wb-wrap');
  var wbAv  = document.getElementById('wb-avatar');
  var wbNm  = document.getElementById('wb-name');
  var wbPh  = document.getElementById('wb-phone');
  var fgPh  = document.getElementById('fg-phone');
  var idEl  = document.getElementById('m-id');
  var pwEl  = document.getElementById('m-pw');
  var hint  = document.getElementById('member-hint');

  if (!wb || !info || !info.phone) return;

  if (idEl) idEl.value = info.phone;

  var firstName = info.firstName || 'Member';
  if (wbAv)  wbAv.textContent = firstName.charAt(0).toUpperCase();
  if (wbNm)  wbNm.textContent = 'Welcome back, ' + firstName + '!';
  if (wbPh)  wbPh.textContent = info.phone;
  if (wb)    wb.style.display = 'block';
  if (fgPh)  fgPh.style.display = 'none';
  if (hint)  hint.textContent = 'Enter your password to sign in.';

  switchTab('member');
  if (pwEl) setTimeout(function(){ pwEl.focus(); }, 150);
}

function clearRememberedUser() {
  try { localStorage.removeItem('campuscoop_remember'); } catch(e) {}
  var wb   = document.getElementById('wb-wrap');
  var fgPh = document.getElementById('fg-phone');
  var idEl = document.getElementById('m-id');
  var pwEl = document.getElementById('m-pw');
  var hint = document.getElementById('member-hint');
  if (wb)   wb.style.display = 'none';
  if (fgPh) fgPh.style.display = 'flex';
  if (idEl) idEl.value = '';
  if (pwEl) pwEl.value = '';
  if (hint) hint.textContent = 'Use your cooperative username to log in.';
  if (idEl) idEl.focus();
}

function switchTab(t) {
  ['member','officer'].forEach(function(x) {
    var b = document.getElementById('tbtn-' + x);
    var d = document.getElementById('tab-' + x);
    if (b) b.className = 'tab-btn';
    if (d) d.className = 'tab-body';
  });
  var ab = document.getElementById('tbtn-' + t);
  if (ab) ab.className = 'tab-btn on' + (t === 'officer' ? ' on-admin' : '');
  var tb = document.getElementById('tab-' + t);
  if (tb) tb.className = 'tab-body on';
}

/* ── Officer Role Selection ── */
function selectOfficerRole(role) {
  var roles = ['regular', 'shortterm', 'commodity', 'treasurer', 'chairperson'];
  roles.forEach(function(r) {
    var p = document.getElementById('rpill-' + r);
    if (p) {
      p.classList.remove('sel-reg', 'sel-st', 'sel-com', 'sel-ts', 'sel-cp');
      if (r === role) {
        if (r === 'regular') p.classList.add('sel-reg');
        if (r === 'shortterm') p.classList.add('sel-st');
        if (r === 'commodity') p.classList.add('sel-com');
        if (r === 'treasurer') p.classList.add('sel-ts');
        if (r === 'chairperson') p.classList.add('sel-cp');
      }
    }
  });

  document.getElementById('officer-role').value = role;

  var icon  = document.getElementById('officer-icon');
  var title = document.getElementById('officer-title');
  var desc  = document.getElementById('officer-desc');
  var btn   = document.getElementById('officer-btn');
  var label = document.getElementById('o-user-label');

  if (role === 'regular') {
    if (icon)  { icon.innerHTML = '&#128218;'; icon.style.background = '#E6F1FB'; }
    if (title)  title.textContent = 'Regular Loan Officer';
    if (desc)   desc.textContent  = 'Can handle Regular and STL Teacher applications.';
    if (btn)    btn.style.background = '#1C2B3A';
    if (label)  label.textContent = 'Email / Username';
  } else if (role === 'shortterm') {
    if (icon)  { icon.innerHTML = '&#9889;'; icon.style.background = '#FFF9E6'; }
    if (title)  title.textContent = 'Short Term Officer';
    if (desc)   desc.textContent  = 'Handles Short Term and Commodity for Job Orders.';
    if (btn)    btn.style.background = '#F5A623';
    if (label)  label.textContent = 'Email / Username';
  } else if (role === 'commodity') {
    if (icon)  { icon.innerHTML = '&#127968;'; icon.style.background = '#EAF3DE'; }
    if (title)  title.textContent = 'Commodity Officer';
    if (desc)   desc.textContent  = 'Handles Short Term and Commodity for Job Orders.';
    if (btn)    btn.style.background = '#3B6D11';
    if (label)  label.textContent = 'Email / Username';
  } else if (role === 'treasurer') {
    if (icon)  { icon.innerHTML = '&#128176;'; icon.style.background = '#FDE9E8'; }
    if (title)  title.textContent = 'Treasurer';
    if (desc)   desc.textContent  = 'Access to Dashboard, Deductions, Payments, and Collections.';
    if (btn)    btn.style.background = '#E74C3C';
    if (label)  label.textContent = 'Email / Username';
  } else if (role === 'chairperson') {
    if (icon)  { icon.innerHTML = '&#128200;'; icon.style.background = '#F0F0F0'; }
    if (title)  title.textContent = 'Chairperson';
    if (desc)   desc.textContent  = 'View-only access to the entire loan system summary.';
    if (btn)    btn.style.background = '#6B7280';
    if (label)  label.textContent = 'Email / Username';
  }
}

/* ── Officer Login ── */
function doOfficerLogin() {
  var user = (document.getElementById('o-user').value || '').trim();
  var pw   = (document.getElementById('o-pw').value   || '');
  var role = document.getElementById('officer-role').value;
  var err  = document.getElementById('officer-err');
  var btn  = document.getElementById('officer-btn');

  if (err) err.style.display = 'none';
  if (!user || !pw) {
    if (err) { err.textContent = 'Please enter username and password.'; err.style.display = 'block'; }
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = 'Signing in...'; }

  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        // Newly assigned officers must secure their account first:
        // set their own email + password before entering the dashboard.
        if (r.officer && r.officer.mustChangePassword) {
          try {
            sessionStorage.setItem('campuscoop_pending_officer', JSON.stringify({
              user: user,
              role: r.role || role,
              name: (r.officer && r.officer.name) || ''
            }));
          } catch(e) {}
          window.top.location.href = document.querySelector('base').href + '?page=officer-setup';
          return;
        }
        try { localStorage.setItem('campuscoop_role', r.role || role); } catch(e) {}
        // Store the admin/officer name for audit logging (role changes, etc.)
        try {
          var _adminName = (r.officer && (r.officer.name || r.officer.email)) || user || (r.role || role);
          localStorage.setItem('campuscoop_admin_name', _adminName);
        } catch(e) {}
        
        // Check if officer profile is complete - temporarily skip profile setup
        // if (r.officer && r.officer.isProfileComplete === false) {
        //   window.top.location.href = document.querySelector('base').href + '?page=profile-setup&role=' + (r.role || role);
        // } else {
          window.top.location.href = document.querySelector('base').href + '?page=dashboard';
        // }
      } else {
        if (err) { err.textContent = (r && r.message) || 'Invalid officer credentials.'; err.style.display = 'block'; }
        if (btn) { btn.disabled = false; btn.textContent = 'Sign in as Officer'; }
      }
    })
    .withFailureHandler(function(e) {
      if (err) { err.textContent = 'Error: ' + e.message; err.style.display = 'block'; }
      if (btn) { btn.disabled = false; btn.textContent = 'Sign in as Officer'; }
    })
    .loginAdmin(user, pw, role);
}

/* ── Member Login ── */
function doMemberLogin() {
  var idEl = document.getElementById('m-id');
  var pwEl = document.getElementById('m-pw');
  var user = (idEl ? idEl.value : '').trim();
  var pw   = (pwEl ? pwEl.value : '');
  var err  = document.getElementById('member-err');
  var btn  = document.getElementById('member-btn');

  if (err) err.style.display = 'none';
  if (!user || !pw) {
    if (err) { err.textContent = 'Please enter username and password.'; err.style.display = 'block'; }
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = 'Signing in...'; }

  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        try {
          var memberObj = r.member || {};
          if (!memberObj.username) memberObj.username = user;
          localStorage.setItem('campuscoop_current_member', JSON.stringify(memberObj));
        } catch(e) {}
        try {
          localStorage.setItem('campuscoop_remember', JSON.stringify({
            phone: user,
            firstName: (r.member && r.member.firstName) || ''
          }));
        } catch(e) {}
        
        // Navigation guard / redirection - temporarily skip profile setup
        // if (r.member && r.member.isProfileComplete === false) {
        //   var setupLnk = document.getElementById('goto-profile-setup');
        //   if (setupLnk) {
        //     setupLnk.click();
        //   } else {
        //     window.top.location.href = document.querySelector('base').href + '?page=profile-setup';
        //   }
        // } else {
          var homeLnk = document.getElementById('goto-member');
          if (homeLnk) {
            homeLnk.click();
          } else {
            window.top.location.href = document.querySelector('base').href + '?page=member-home';
          }
        // }
      } else {
        if (err) { err.textContent = (r && r.message) || 'Invalid username or password.'; err.style.display = 'block'; }
        if (btn) { btn.disabled = false; btn.textContent = 'Sign in as Member'; }
      }
    })
    .withFailureHandler(function(e) {
      if (err) { err.textContent = 'Error: ' + e.message; err.style.display = 'block'; }
      if (btn) { btn.disabled = false; btn.textContent = 'Sign in as Member'; }
    })
    .loginMember(user, pw);
}

/* ── Forgot Password Modal ── */
function showForgotPassword() {
  var ov = document.getElementById('fp-overlay');
  var err = document.getElementById('fp-err');
  var ok = document.getElementById('fp-ok');
  var inp = document.getElementById('fp-input');
  var btn = document.getElementById('fp-btn');
  if (err) { err.style.display = 'none'; err.textContent = ''; }
  if (ok)  { ok.style.display = 'none'; ok.textContent = ''; }
  if (inp) inp.value = '';
  if (btn) { btn.disabled = false; btn.textContent = 'Send Reset Link'; }
  if (ov)  ov.classList.add('show');
  if (inp) setTimeout(function(){ inp.focus(); }, 200);
}

function closeForgotPassword() {
  var ov = document.getElementById('fp-overlay');
  if (ov) ov.classList.remove('show');
}

function doForgotPassword() {
  var inp = document.getElementById('fp-input');
  var err = document.getElementById('fp-err');
  var ok  = document.getElementById('fp-ok');
  var btn = document.getElementById('fp-btn');
  var val = (inp ? inp.value : '').trim();

  if (err) err.style.display = 'none';
  if (ok)  ok.style.display = 'none';

  if (!val) {
    if (err) { err.textContent = 'Please enter your registered email address.'; err.style.display = 'block'; }
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }

  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success) {
        if (ok) {
          ok.innerHTML = '&#10004; A password reset link has been sent to your registered email address.'
            + '<br><span style="font-size:11px;color:#555;margin-top:4px;display:inline-block;">Please check your inbox (and spam folder) and click the link to reset your password. The link will expire in 30 minutes.</span>';
          ok.style.display = 'block';
        }
        if (err) err.style.display = 'none';
        if (inp) inp.value = '';
        if (btn) { btn.disabled = false; btn.textContent = 'Send Reset Link'; }
      } else {
        if (err) { err.textContent = (r && r.message) || 'Unable to start reset process. Please try again.'; err.style.display = 'block'; }
        if (btn) { btn.disabled = false; btn.textContent = 'Send Reset Link'; }
      }
    })
    .withFailureHandler(function(e) {
      if (err) { err.textContent = 'Error: ' + e.message; err.style.display = 'block'; }
      if (btn) { btn.disabled = false; btn.textContent = 'Send Reset Link'; }
    })
    .requestPasswordReset(val);
}
</script>
