<script>
/* ═══ Reports Page Script ═══ */

var _rptPeriod = 'weekly';

function loadReports() {
  // Set current month in week-month selector
  var now = new Date();
  var monthSel = document.getElementById('rpt-week-month');
  if (monthSel) monthSel.value = now.getMonth();
  // Set current year
  var yearSel = document.getElementById('rpt-year');
  if (yearSel) {
    var cy = now.getFullYear();
    // ensure current year option exists
    var found = false;
    for (var i = 0; i < yearSel.options.length; i++) {
      if (yearSel.options[i].value == cy) { found = true; break; }
    }
    if (!found) {
      var opt = document.createElement('option');
      opt.value = cy; opt.text = cy;
      yearSel.appendChild(opt);
    }
    yearSel.value = cy;
  }
}

function setReportPeriod(p) {
  _rptPeriod = p;
  document.querySelectorAll('.rpt-pbtn').forEach(function(b) { b.classList.remove('on'); });
  document.getElementById('rpt-p-' + p).classList.add('on');

  // Show/hide relevant selectors
  var weekly = document.getElementById('rpt-weekly-opts');
  var weekNum = document.getElementById('rpt-week-opts');
  var monthly = document.getElementById('rpt-monthly-opts');

  if (p === 'weekly') {
    weekly.style.display = ''; weekNum.style.display = '';
    monthly.style.display = 'none';
  } else if (p === 'monthly') {
    weekly.style.display = 'none'; weekNum.style.display = 'none';
    monthly.style.display = '';
  } else {
    weekly.style.display = 'none'; weekNum.style.display = 'none';
    monthly.style.display = 'none';
  }
}

function toggleMonthTag(el) {
  el.classList.toggle('on');
}

function onReportYearChange() {
  // Just UI, no auto-generate
}

function generateReport() {
  var btn = document.getElementById('rpt-gen-btn');
  var output = document.getElementById('rpt-output');
  if (btn) { btn.disabled = true; btn.innerHTML = '&#8987; Generating...'; }
  output.innerHTML = '<div class="rpt-loading">&#8987; Generating report... please wait.</div>';
  output.classList.add('visible');

  var params = {
    period: _rptPeriod,
    year: document.getElementById('rpt-year').value
  };

  if (_rptPeriod === 'weekly') {
    params.month = Number(document.getElementById('rpt-week-month').value);
    params.week = Number(document.getElementById('rpt-week-num').value);
  } else if (_rptPeriod === 'monthly') {
    var selected = [];
    document.querySelectorAll('#rpt-month-tags .rpt-month-tag.on').forEach(function(t) {
      selected.push(Number(t.getAttribute('data-m')));
    });
    if (selected.length === 0) {
      output.innerHTML = '<div class="rpt-loading" style="color:#A32D2D;">&#9888; Please select at least one month.</div>';
      if (btn) { btn.disabled = false; btn.innerHTML = '&#9654; Generate Report'; }
      return;
    }
    params.months = selected;
  }

  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) { btn.disabled = false; btn.innerHTML = '&#9654; Generate Report'; }
      if (r && r.success) {
        renderReport(r);
        document.getElementById('rpt-print-btn').style.display = '';
      } else {
        output.innerHTML = '<div class="rpt-loading" style="color:#A32D2D;">&#9888; ' + (r && r.message || 'Failed to generate report.') + '</div>';
      }
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.innerHTML = '&#9654; Generate Report'; }
      output.innerHTML = '<div class="rpt-loading" style="color:#A32D2D;">&#9888; Error: ' + e.message + '</div>';
    })
    .getReportData(params);
}

function peso(n) { return '\u20B1' + Math.round(n).toLocaleString(); }

function renderReport(data) {
  var t = data.totals;
  var pf = data.portfolio;
  var pd = data.periodData;
  var periodLabel = '';
  if (pd.length === 1) periodLabel = pd[0].label;
  else if (pd.length > 1) periodLabel = pd[0].label + ' — ' + pd[pd.length - 1].label;
  else periodLabel = data.year;

  var html = '';

  // ── Report Header ──
  html += '<div class="rpt-header">';
  html += '<div class="rpt-header-logo">CAMPUS<span>COOP</span></div>';
  html += '<div class="rpt-header-sub">Cooperative Loan System &middot; Sultan Kudarat State University</div>';
  html += '<div class="rpt-header-title">Financial Report — ' + data.period.charAt(0).toUpperCase() + data.period.slice(1) + ' Summary</div>';
  html += '<div class="rpt-header-period">' + periodLabel + '</div>';
  html += '<div class="rpt-header-gen">Generated: ' + data.generatedAt + '</div>';
  html += '</div>';

  // ── KPI Summary ──
  html += '<div class="rpt-kpi-row">';
  html += '<div class="rpt-kpi blue"><div class="rpt-kpi-val">' + t.loansReleased + '</div><div class="rpt-kpi-label">Loans Disbursed</div></div>';
  html += '<div class="rpt-kpi"><div class="rpt-kpi-val">' + peso(t.amtReleased) + '</div><div class="rpt-kpi-label">Amount Released</div></div>';
  html += '<div class="rpt-kpi green"><div class="rpt-kpi-val">' + peso(t.amtCollected) + '</div><div class="rpt-kpi-label">Total Collected</div></div>';
  html += '<div class="rpt-kpi"><div class="rpt-kpi-val">' + t.collectionRate + '%</div><div class="rpt-kpi-label">Collection Rate</div></div>';
  html += '<div class="rpt-kpi red"><div class="rpt-kpi-val">' + pf.overdueCount + '</div><div class="rpt-kpi-label">Overdue Accounts</div></div>';
  html += '</div>';

  // ── 1. Loan Portfolio Snapshot ──
  html += '<div class="rpt-section">';
  html += '<div class="rpt-section-title"><span class="rpt-section-icon">&#127970;</span> Loan Portfolio Snapshot (Current)</div>';
  html += '<table class="rpt-table"><thead><tr><th>Metric</th><th class="num">Value</th></tr></thead><tbody>';
  html += '<tr><td>Total Registered Members</td><td class="num">' + pf.totalMembers + '</td></tr>';
  html += '<tr><td>Active Loans</td><td class="num">' + pf.activeLoans + '</td></tr>';
  html += '<tr><td>Total Outstanding Balance</td><td class="num">' + peso(pf.totalOutstanding) + '</td></tr>';
  html += '<tr><td>Overdue Accounts</td><td class="num" style="color:#A32D2D;font-weight:700;">' + pf.overdueCount + '</td></tr>';
  html += '<tr><td>Amount at Risk (Overdue)</td><td class="num" style="color:#A32D2D;font-weight:700;">' + peso(pf.overdueAmt) + '</td></tr>';
  html += '</tbody></table></div>';

  // ── 2. Disbursement Report ──
  html += '<div class="rpt-section">';
  html += '<div class="rpt-section-title"><span class="rpt-section-icon">&#128181;</span> Disbursement Report</div>';
  html += '<table class="rpt-table"><thead><tr><th>Period</th><th class="num">STL (#)</th><th class="num">STL Amt</th><th class="num">REG (#)</th><th class="num">REG Amt</th><th class="num">COM (#)</th><th class="num">COM Amt</th><th class="num">Total (#)</th><th class="num">Total Amt</th></tr></thead><tbody>';
  for (var i = 0; i < pd.length; i++) {
    var e = pd[i];
    html += '<tr><td>' + e.label + '</td>';
    html += '<td class="num">' + e.releasedSTL + '</td><td class="num">' + peso(e.amtSTL) + '</td>';
    html += '<td class="num">' + e.releasedREG + '</td><td class="num">' + peso(e.amtREG) + '</td>';
    html += '<td class="num">' + e.releasedCOM + '</td><td class="num">' + peso(e.amtCOM) + '</td>';
    html += '<td class="num">' + e.loansReleased + '</td><td class="num">' + peso(e.amtReleased) + '</td></tr>';
  }
  html += '</tbody><tfoot><tr><td>TOTAL</td>';
  html += '<td class="num">' + t.releasedSTL + '</td><td class="num">' + peso(t.amtSTL) + '</td>';
  html += '<td class="num">' + t.releasedREG + '</td><td class="num">' + peso(t.amtREG) + '</td>';
  html += '<td class="num">' + t.releasedCOM + '</td><td class="num">' + peso(t.amtCOM) + '</td>';
  html += '<td class="num">' + t.loansReleased + '</td><td class="num">' + peso(t.amtReleased) + '</td>';
  html += '</tr></tfoot></table></div>';

  // ── 3. Collection Report ──
  html += '<div class="rpt-section">';
  html += '<div class="rpt-section-title"><span class="rpt-section-icon">&#128176;</span> Collection Report</div>';
  html += '<table class="rpt-table"><thead><tr><th>Period</th><th class="num">STL</th><th class="num">Regular</th><th class="num">Commodity</th><th class="num">Total Collected</th><th class="num">Payments (#)</th></tr></thead><tbody>';
  for (var j = 0; j < pd.length; j++) {
    var c = pd[j];
    html += '<tr><td>' + c.label + '</td>';
    html += '<td class="num">' + peso(c.collSTL) + '</td><td class="num">' + peso(c.collREG) + '</td>';
    html += '<td class="num">' + peso(c.collCOM) + '</td><td class="num">' + peso(c.amtCollected) + '</td>';
    html += '<td class="num">' + c.paymentsReceived + '</td></tr>';
  }
  html += '</tbody><tfoot><tr><td>TOTAL</td>';
  html += '<td class="num">' + peso(t.collSTL) + '</td><td class="num">' + peso(t.collREG) + '</td>';
  html += '<td class="num">' + peso(t.collCOM) + '</td><td class="num">' + peso(t.amtCollected) + '</td>';
  html += '<td class="num">' + t.paymentsReceived + '</td>';
  html += '</tr></tfoot></table></div>';

  // ── 4. Budget Utilization / Cash Flow ──
  html += '<div class="rpt-section">';
  html += '<div class="rpt-section-title"><span class="rpt-section-icon">&#128200;</span> Budget Utilization &amp; Cash Flow</div>';
  html += '<div class="rpt-cashflow">';
  html += '<div class="rpt-cf-card"><div class="rpt-cf-label">Funds Disbursed</div><div class="rpt-cf-val">' + peso(t.amtReleased) + '</div></div>';
  html += '<div class="rpt-cf-card"><div class="rpt-cf-label">Funds Collected</div><div class="rpt-cf-val positive">' + peso(t.amtCollected) + '</div></div>';
  var ncf = t.netCashFlow;
  html += '<div class="rpt-cf-card"><div class="rpt-cf-label">Net Cash Flow</div><div class="rpt-cf-val ' + (ncf >= 0 ? 'positive' : 'negative') + '">' + (ncf >= 0 ? '+' : '') + peso(ncf) + '</div></div>';
  html += '<div class="rpt-cf-card"><div class="rpt-cf-label">Collection Rate</div><div class="rpt-cf-val ' + (t.collectionRate >= 80 ? 'positive' : t.collectionRate < 50 ? 'negative' : '') + '">' + t.collectionRate + '%</div></div>';
  html += '</div></div>';

  // ── 5. Application Activity ──
  html += '<div class="rpt-section">';
  html += '<div class="rpt-section-title"><span class="rpt-section-icon">&#128203;</span> Loan Application Activity</div>';
  html += '<table class="rpt-table"><thead><tr><th>Period</th><th class="num">Submitted</th><th class="num">Approved</th><th class="num">Rejected</th><th class="num">Pending</th></tr></thead><tbody>';
  for (var k = 0; k < pd.length; k++) {
    var ap = pd[k];
    html += '<tr><td>' + ap.label + '</td>';
    html += '<td class="num">' + ap.appsSubmitted + '</td><td class="num" style="color:#3B6D11;">' + ap.appsApproved + '</td>';
    html += '<td class="num" style="color:#A32D2D;">' + ap.appsRejected + '</td><td class="num" style="color:#854F0B;">' + ap.appsPending + '</td></tr>';
  }
  html += '</tbody><tfoot><tr><td>TOTAL</td>';
  html += '<td class="num">' + t.appsSubmitted + '</td><td class="num">' + t.appsApproved + '</td>';
  html += '<td class="num">' + t.appsRejected + '</td><td class="num">' + (t.appsSubmitted - t.appsApproved - t.appsRejected) + '</td>';
  html += '</tr></tfoot></table></div>';

  // ── 6. Member Activity ──
  html += '<div class="rpt-section">';
  html += '<div class="rpt-section-title"><span class="rpt-section-icon">&#128101;</span> Member Activity</div>';
  html += '<table class="rpt-table"><thead><tr><th>Period</th><th class="num">New Members Registered</th></tr></thead><tbody>';
  for (var m = 0; m < pd.length; m++) {
    html += '<tr><td>' + pd[m].label + '</td><td class="num">' + pd[m].newMembers + '</td></tr>';
  }
  html += '</tbody><tfoot><tr><td>TOTAL</td><td class="num">' + t.newMembers + '</td></tr></tfoot></table></div>';

  // ── Auditor's Notes / Flags ──
  html += '<div class="rpt-section">';
  html += '<div class="rpt-section-title"><span class="rpt-section-icon">&#9888;</span> Audit Flags &amp; Observations</div>';
  html += '<table class="rpt-table"><thead><tr><th>Flag</th><th>Details</th><th>Severity</th></tr></thead><tbody>';

  if (pf.overdueCount > 0) {
    html += '<tr><td>Overdue Accounts</td><td>' + pf.overdueCount + ' loans past maturity date with ' + peso(pf.overdueAmt) + ' at risk</td><td style="color:#A32D2D;font-weight:600;">HIGH</td></tr>';
  }
  if (t.netCashFlow < 0) {
    html += '<tr><td>Negative Cash Flow</td><td>Disbursements exceed collections by ' + peso(Math.abs(t.netCashFlow)) + ' in this period</td><td style="color:#A32D2D;font-weight:600;">HIGH</td></tr>';
  }
  if (t.collectionRate < 50 && t.amtReleased > 0) {
    html += '<tr><td>Low Collection Rate</td><td>Only ' + t.collectionRate + '% of released amounts have been collected</td><td style="color:#854F0B;font-weight:600;">MEDIUM</td></tr>';
  }
  if (t.appsRejected > t.appsApproved && t.appsSubmitted > 0) {
    html += '<tr><td>High Rejection Rate</td><td>' + t.appsRejected + ' rejected vs ' + t.appsApproved + ' approved applications</td><td style="color:#854F0B;font-weight:600;">MEDIUM</td></tr>';
  }
  if (pf.overdueCount === 0 && t.netCashFlow >= 0 && (t.collectionRate >= 50 || t.amtReleased === 0)) {
    html += '<tr><td colspan="3" style="text-align:center;color:#3B6D11;font-weight:600;padding:16px;">&#10003; No significant audit flags detected for this period.</td></tr>';
  }
  html += '</tbody></table></div>';

  // ── Disclaimer ──
  html += '<div class="rpt-disclaimer">';
  html += '&#128196; This report is electronically generated by CampusCoop. Data is sourced from the connected Google Spreadsheet database.<br/>';
  html += 'For official accounting purposes, this report should be reviewed and signed by the authorized cooperative officer.<br/>';
  html += 'CampusCoop &middot; Sultan Kudarat State University &middot; AY 2025&ndash;2026';
  html += '</div>';

  document.getElementById('rpt-output').innerHTML = html;
}

function printReport() {
  window.print();
}
</script>
