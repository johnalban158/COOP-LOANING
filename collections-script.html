<script>
var _collData = null;
var _collFilter = 'all';

// Map role to the loan type filter keyword
function _roleToFilter(role) {
  if (role === 'regular')   return 'regular';
  if (role === 'shortterm') return 'short';
  if (role === 'commodity') return 'commodity';
  return 'all'; // admin sees all
}

function loadCollections() {
  var tbody = document.getElementById('coll-tbody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">&#8635;</div><div class="empty-title">Loading collections...</div></div></td></tr>';

  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) { 
        showToast('Error: ' + (r && r.message || 'Loading collections failed')); 
        return; 
      }
      _collData = r;
      _applyRoleVisibility();
      renderCollStats();
      // Auto-filter by role
      var role = '';
      try { role = localStorage.getItem('campuscoop_role') || ''; } catch(e) {}
      var filter = _roleToFilter(role);
      _collFilter = filter;
      renderCollTable(filter);
    })
    .withFailureHandler(function(e) { showToast('Failed: ' + e.message); })
    .getCollectionsData();
}

// Hide stat rows and filter buttons that don't belong to the officer's role
function _applyRoleVisibility() {
  var role = '';
  try { role = localStorage.getItem('campuscoop_role') || ''; } catch(e) {}
  if (!role || role === 'admin') return; // admin sees everything

  var show = _roleToFilter(role); // 'regular', 'short', or 'commodity'

  // Hide "By loan type" rows that don't match
  var rowSt  = document.getElementById('coll-row-st');
  var rowReg = document.getElementById('coll-row-reg');
  var rowCom = document.getElementById('coll-row-com');
  if (rowSt)  rowSt.style.display  = (show === 'short')     ? '' : 'none';
  if (rowReg) rowReg.style.display = (show === 'regular')   ? '' : 'none';
  if (rowCom) rowCom.style.display = (show === 'commodity') ? '' : 'none';

  // Hide filter buttons that don't match (keep "All" hidden too since they're restricted)
  document.querySelectorAll('#page-collections .filter-btn').forEach(function(btn) {
    var txt = (btn.textContent || '').toLowerCase().trim();
    if (txt === 'all') { btn.style.display = 'none'; return; }
    var matches = (show === 'short' && txt.indexOf('short') !== -1)
               || (show === 'regular' && txt.indexOf('regular') !== -1)
               || (show === 'commodity' && txt.indexOf('commodity') !== -1);
    btn.style.display = matches ? '' : 'none';
  });
}

function renderCollStats() {
  var r = _collData;
  var el1 = document.getElementById('coll-rate');
  var el2 = document.getElementById('coll-total');
  var el3 = document.getElementById('coll-outstanding');
  var el4 = document.getElementById('coll-overdue-amt');
  if (el1) el1.textContent = r.collectionRate + '%';
  if (el2) el2.textContent = '\u20B1' + Math.round(r.totalCollected).toLocaleString();
  if (el3) el3.textContent = '\u20B1' + Math.round(r.totalOutstanding).toLocaleString();
  if (el4) el4.textContent = '\u20B1' + Math.round(r.collectedThisMonth).toLocaleString();

  // Progress bar
  var bar = document.getElementById('coll-progress-bar');
  var pLabel1 = document.getElementById('coll-progress-amt');
  var pLabel2 = document.getElementById('coll-progress-pct');
  if (bar) bar.style.width = Math.min(r.collectionRate, 100) + '%';
  if (pLabel1) pLabel1.textContent = '\u20B1' + Math.round(r.collectedThisMonth).toLocaleString() + ' collected';
  if (pLabel2) pLabel2.textContent = r.collectionRate + '% of target';

  // By type
  var bt = r.byType || {};
  var stEl = document.getElementById('coll-by-st');
  var rgEl = document.getElementById('coll-by-reg');
  var clEl = document.getElementById('coll-by-com');
  var ttEl = document.getElementById('coll-by-total');
  if (stEl) stEl.textContent = '\u20B1' + Math.round(bt['Short Term'] || 0).toLocaleString();
  if (rgEl) rgEl.textContent = '\u20B1' + Math.round(bt['Regular'] || 0).toLocaleString();
  if (clEl) clEl.textContent = '\u20B1' + Math.round(bt['Commodity'] || 0).toLocaleString();
  if (ttEl) ttEl.textContent = '\u20B1' + Math.round(r.totalCollected).toLocaleString();
}

function renderCollTable(filter) {
  _collFilter = filter;
  var list = (_collData && _collData.collections) || [];
  if (filter !== 'all') {
    list = list.filter(function(c) {
      return c.loanType && c.loanType.toLowerCase().indexOf(filter.toLowerCase()) !== -1;
    });
  }

  var tbody = document.getElementById('coll-tbody');
  if (!tbody) return;

  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">&#128202;</div><div class="empty-title">No collection records found</div><div class="empty-sub">Collection records will appear here once payments are confirmed.</div></div></td></tr>';
    return;
  }

  var html = '';
  list.forEach(function(c) {
    html += '<tr>';
    html += '<td><div style="font-weight:600;font-size:13px;">' + (c.memberName || c.memberId) + '</div><div style="font-size:11px;color:#888;">' + (c.memberId || '') + '</div></td>';
    html += '<td>' + (c.loanType || '\u2014') + '</td>';
    html += '<td style="font-weight:600;font-family:monospace;">\u20B1' + (c.amount ? Number(c.amount).toLocaleString() : '0') + '</td>';
    html += '<td style="font-size:12px;">' + (c.datePaid || '\u2014') + '</td>';
    html += '<td><span style="background:#EAF3DE;color:#3B6D11;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;">Confirmed</span></td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function setFilterColl(el, filter) {
  document.querySelectorAll('#page-collections .filter-btn').forEach(function(b) {
    b.classList.remove('on');
  });
  el.classList.add('on');
  renderCollTable(filter);
}
</script>
