<!DOCTYPE html>
<html>
  <head>
    <base href="<?= scriptUrl ?>">
    <meta charset="utf-8">
    <title>CampusCoop – Setup Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <?!= include('setup-style') ?>
  </head>
  <body>
    <div class="setup-wrap">
      <div class="setup-card">
        <div class="header-bar">
          <div class="header-title">Setup Your Account</div>
          <div class="header-sub">To secure your cooperative account, please configure your email address, phone number, and a new personal password.</div>
        </div>
        <div class="form-body">
          <div class="err" id="setup-err"></div>
          
          <div class="fg">
            <label class="fl">Full Name</label>
            <input class="fi" id="s-name" placeholder="Your full name" type="text" />
          </div>

          <div class="fg">
            <label class="fl">Email Address</label>
            <input class="fi" id="s-email" placeholder="e.g. member@email.com" type="email" required />
          </div>

          <div class="fg">
            <label class="fl">Mobile Number</label>
            <input class="fi" id="s-phone" placeholder="e.g. 09171234567" type="tel" required />
          </div>

          <div class="fg">
            <label class="fl">New Password</label>
            <div style="position:relative;">
              <input class="fi" id="s-password" placeholder="Min. 8 characters" type="password" required style="padding-right:44px;" />
              <span class="pw-toggle-btn" onclick="togglePW('s-password',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
            </div>
          </div>

          <div class="fg">
            <label class="fl">Confirm Password</label>
            <div style="position:relative;">
              <input class="fi" id="s-confirm" placeholder="Match new password" type="password" required style="padding-right:44px;" />
              <span class="pw-toggle-btn" onclick="togglePW('s-confirm',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
            </div>
          </div>

          <button class="btn-submit" id="setup-btn" onclick="submitSetupForm()">Complete Profile Setup</button>
          
          <div class="hint">Ensure you enter a working email. It will be required if you need to reset your password in the future.</div>
        </div>
      </div>
    </div>
    <?!= include('setup-script') ?>
  </body>
</html>
